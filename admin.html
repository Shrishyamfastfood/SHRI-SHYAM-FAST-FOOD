<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Shri Shyam Fast Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="text-gray-800">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm shadow-xl text-center">
            <h2 class="text-2xl font-bold mb-6">Admin Panel</h2>
            <input type="text" id="admin-id" placeholder="Admin ID" class="w-full mb-4 p-3 border rounded-xl focus:outline-none focus:border-orange-500">
            <input type="password" id="admin-pass" placeholder="Password" class="w-full mb-6 p-3 border rounded-xl focus:outline-none focus:border-orange-500">
            <button onclick="login()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-black transition">Login</button>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden min-h-screen">
        <nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center">
            <div class="font-bold text-xl"><i class="fa-solid fa-user-shield text-orange-500 mr-2"></i> Admin Dashboard</div>
            <div><button onclick="setupInitialMenu()" class="bg-orange-600 px-3 py-1 text-sm rounded mr-3 hover:bg-orange-500">Setup Menu Data (Click Once)</button></div>
        </nav>

        <div class="max-w-6xl mx-auto px-6 py-8">
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <div class="px-6 py-4 bg-gray-50 border-b border-gray-200 font-bold text-lg">Live Orders <i class="fa-solid fa-circle text-green-500 animate-pulse text-xs ml-2"></i></div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-500 text-sm border-b">
                                <th class="px-6 py-4">Customer</th>
                                <th class="px-6 py-4">Items</th>
                                <th class="px-6 py-4">Amount & Payment</th>
                                <th class="px-6 py-4">Status</th>
                            </tr>
                        </thead>
                        <tbody id="orders-list">
                            <tr><td colspan="4" class="text-center py-8 text-gray-500">Loading live orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // LOGIN LOGIC
        function login() {
            if(document.getElementById('admin-id').value === "Jitu" && document.getElementById('admin-pass').value === "Jitu12") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                fetchOrders();
            } else { alert("Wrong ID or Password"); }
        }

        // REAL-TIME ORDERS FROM FIREBASE
        function fetchOrders() {
            db.collection("orders").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                const list = document.getElementById('orders-list');
                list.innerHTML = '';
                if(snapshot.empty) {
                    list.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">No orders yet.</td></tr>';
                    return;
                }
                
                snapshot.forEach((doc) => {
                    const order = doc.data();
                    const itemsHtml = order.items.map(i => `${i.baseName} (${i.variantName})`).join('<br>');
                    const drinkHtml = order.hasFreeDrink ? `<br><span class="text-green-600 font-bold text-xs">+ 1 Free Cold Drink</span>` : '';
                    const payColor = order.paymentMethod === 'UPI' ? 'text-blue-600' : 'text-orange-600';

                    list.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-6 py-4"><b>${order.customerName}</b><br><span class="text-sm text-gray-500"><i class="fa-solid fa-phone text-xs"></i> ${order.customerPhone}</span></td>
                        <td class="px-6 py-4 text-sm">${itemsHtml} ${drinkHtml}</td>
                        <td class="px-6 py-4"><b>₹${order.totalAmount}</b><br><span class="text-xs font-bold ${payColor}">${order.paymentMethod}</span></td>
                        <td class="px-6 py-4">
                            <select onchange="updateStatus('${doc.id}', this.value)" class="border p-2 rounded text-sm font-bold bg-white outline-none">
                                <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Accepted" ${order.status === 'Accepted' ? 'selected' : ''}>Accepted</option>
                                <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </td>
                    </tr>`;
                });
            });
        }

        // UPDATE ORDER STATUS IN FIREBASE
        function updateStatus(id, newStatus) {
            db.collection("orders").doc(id).update({ status: newStatus })
              .then(() => console.log("Status updated"))
              .catch(err => alert("Error updating status"));
        }

        // SETUP DATABASE (ONLY NEEDED ONCE)
        function setupInitialMenu() {
            if(!confirm("Push default menu to database? (Only do this once if DB is empty)")) return;
            
            const initialMenu = [
                { id: 'sand1', name: "Special Sandwich", img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=300&q=80", desc: "Grilled to perfection with fresh veggies.", variants: [{ id: 'sand1_f', name: "Regular", price: 60 }] },
                { id: 'burg1', name: "Crispy Burger", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=300&q=80", desc: "Aloo tikki loaded with cheese.", variants: [{ id: 'burg1_f', name: "Regular", price: 50 }] },
                { id: 'momo1', name: "Veg Momos", img: "https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?auto=format&fit=crop&w=300&q=80", desc: "Steamed hot momos served with chutney.", variants: [{ id: 'momo1_f', name: "Full Plate", price: 80 }, { id: 'momo1_h', name: "Half Plate", price: 40 }] },
                { id: 'pav1', name: "Mumbai Pav Bhaji", img: "https://images.unsplash.com/photo-1606491956689-2ea866880c84?auto=format&fit=crop&w=300&q=80", desc: "Buttery paav with extra spicy bhaji.", variants: [{ id: 'pav1_f', name: "Full Plate", price: 90 }, { id: 'pav1_h', name: "Half Plate", price: 50 }] },
                { id: 'chow1', name: "Hakka Chowmein", img: "https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=300&q=80", desc: "Wok-tossed noodles with veggies.", variants: [{ id: 'chow1_f', name: "Full Plate", price: 70 }, { id: 'chow1_h', name: "Half Plate", price: 40 }] },
                { id: 'bhel1', name: "Chatpati Bhel Puri", img: "https://images.unsplash.com/photo-1541529086526-db283c563270?auto=format&fit=crop&w=300&q=80", desc: "Sweet, sour, and spicy mixture.", variants: [{ id: 'bhel1_f', name: "Full Plate", price: 50 }, { id: 'bhel1_h', name: "Half Plate", price: 30 }] }
            ];

            initialMenu.forEach(item => {
                db.collection("menu").doc(item.id).set(item).then(() => console.log(item.name + " added."));
            });
            alert("Menu setup complete! Refresh the main website to see the food items.");
        }
    </script>
</body>
</html>
