<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food Moulasar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; padding-bottom: 120px; }
        .gradient-nav { background: linear-gradient(135deg, #cc0000 0%, #ff5722 100%); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-green { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .cart-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="gradient-nav text-white shadow-xl sticky top-0 z-50 rounded-b-[2rem]">
        <div class="max-w-6xl mx-auto px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-14 h-14 rounded-full border-2 border-white shadow-lg">
                <div>
                    <h1 class="text-sm font-black italic leading-tight">SHRI SHYAM FAST FOOD</h1>
                    <p class="text-[11px] font-bold opacity-90"><i class="fa-solid fa-location-dot"></i> MOULASAR</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="status-dot" class="status-dot dot-red"></span>
                        <span id="status-text" class="text-[9px] font-black uppercase tracking-widest text-white/80">Checking...</span>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <a href="tel:918058733741" class="bg-white/20 p-2 rounded-full inline-block mb-1"><i class="fa-solid fa-phone"></i></a>
                <p class="text-[10px] font-bold">8058733741</p>
            </div>
        </div>
    </header>

    <div class="max-w-xl mx-auto px-4 mt-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black italic text-gray-800">Hamara Menu</h2>
            <button onclick="checkAdmin()" class="text-gray-300"><i class="fa-solid fa-gear"></i></button>
        </div>

        <div id="admin-box" class="hidden mb-6 p-5 bg-white rounded-3xl shadow-lg border-2 border-red-100">
            <p class="text-xs font-bold text-gray-400 mb-2 text-center underline">ADMIN CONTROL</p>
            <button id="shop-btn" onclick="toggleStatus()" class="w-full py-4 rounded-2xl font-black text-white"></button>
        </div>

        <div id="menu-items" class="space-y-4">
            </div>
    </div>

    <div id="cart-bar" class="hidden fixed bottom-6 left-4 right-4 z-[100] cart-animate">
        <div class="bg-black text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center">
            <div>
                <p id="cart-count" class="text-[10px] font-bold text-gray-400">0 ITEMS ADDED</p>
                <p id="cart-total" class="text-lg font-black text-green-400">₹0</p>
            </div>
            <button onclick="openPayment()" class="bg-green-600 px-6 py-3 rounded-xl font-black text-sm flex items-center gap-2 active:scale-95 transition">
                ORDER NOW <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
        </div>
    </div>

    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[200] flex items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full text-center">
            <h3 class="font-black text-xl mb-2 italic">JAY SHREE SHYAM</h3>
            <p class="text-[10px] font-bold text-gray-400 mb-6 uppercase tracking-widest">Scan & Pay for Order</p>
            <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-3xl border mb-6 shadow-sm">
            <button onclick="finishOrder()" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl shadow-lg">DONE (WHATSAPP)</button>
            <button onclick="this.parentElement.parentElement.classList.add('hidden')" class="mt-4 text-gray-400 font-bold text-xs">CANCEL</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        let shopOpen = false;
        let cart = {};

        // 1. Connection & Status
        rdb.ref('shop_status').on('value', (snap) => {
            shopOpen = snap.val() ?? true;
            document.getElementById('status-dot').className = shopOpen ? "status-dot dot-green" : "status-dot dot-red";
            document.getElementById('status-text').innerText = shopOpen ? "Shop Open" : "Shop Closed";
            
            const btn = document.getElementById('shop-btn');
            btn.innerText = shopOpen ? "CLOSE SHOP NOW" : "OPEN SHOP NOW";
            btn.className = shopOpen ? "w-full py-4 rounded-2xl font-black bg-red-600 text-white" : "w-full py-4 rounded-2xl font-black bg-green-600 text-white";
        });

        // 2. Load Menu
        rdb.ref('menu').on('value', (snap) => {
            const list = document.getElementById('menu-items');
            const data = snap.val() || [
                { name: "Special Sandwich", price: 60, icon: "🥪" },
                { name: "Bhelpuri Plate", price: 40, icon: "🥣" },
                { name: "Veg Burger", price: 50, icon: "🍔" }
            ];
            list.innerHTML = '';
            data.forEach((item, index) => {
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100">
                        <div class="flex items-center gap-4">
                            <span class="text-3xl">${item.icon}</span>
                            <div>
                                <p class="font-bold text-gray-800 text-sm">${item.name}</p>
                                <p class="text-red-500 font-black italic">₹${item.price}</p>
                            </div>
                        </div>
                        <button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-50 text-red-600 font-black px-5 py-2 rounded-xl text-xs active:scale-90 transition">ADD +</button>
                    </div>`;
            });
        });

        function addToCart(name, price) {
            if(!shopOpen) { alert("Dukaan abhi band hai!"); return; }
            cart[name] = (cart[name] || 0) + 1;
            updateCartUI();
        }

        function updateCartUI() {
            let total = 0, count = 0;
            for(let key in cart) {
                count += cart[key];
                // Note: Simplified total logic for this demo
                total += (cart[key] * (key.includes('Sandwich') ? 60 : key.includes('Bhelpuri') ? 40 : 50));
            }
            if(count > 0) {
                document.getElementById('cart-bar').classList.remove('hidden');
                document.getElementById('cart-count').innerText = count + " ITEMS ADDED";
                document.getElementById('cart-total').innerText = "₹" + total;
            }
        }

        function openPayment() { document.getElementById('qr-modal').classList.remove('hidden'); }

        function finishOrder() {
            let msg = "Jay Shree Shyam! Mera Order:%0A";
            for(let key in cart) msg += `- ${key} (${cart[key]})%0A`;
            window.location.href = `https://wa.me/918058733741?text=${msg}`;
        }

        function checkAdmin() { if(prompt("Pass:") === "jitu8087") document.getElementById('admin-box').classList.toggle('hidden'); }
        function toggleStatus() { rdb.ref('shop_status').set(!shopOpen); }
    </script>
</body>
</html>
