<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Ultimate Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 120px; }
        
        /* Z-Index Fix: Admin Panel hamesha top par */
        #admin-panel { z-index: 10000 !important; display: none; position: fixed; inset: 0; background: #0f172a; overflow-y: auto; padding: 20px; }
        #admin-panel.active { display: block !important; }
        
        #closed-screen { z-index: 9000 !important; }
        .cart-sheet { transition: transform 0.4s ease; transform: translateY(110%); z-index: 9500; }
        .cart-sheet.active { transform: translateY(0); }
        .product-img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; background: #eee; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white shadow-sm px-4 py-3 flex justify-between items-center border-b border-red-100">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-10 h-10 rounded-full border-2 border-red-600">
            <div>
                <h1 class="font-black text-red-600 uppercase leading-none">Shri Shyam</h1>
                <p id="shop-indicator" class="text-[9px] font-bold text-orange-500 uppercase mt-1 italic">Syncing...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('track-modal').classList.remove('hidden')" class="px-3 py-1 bg-red-50 text-red-600 font-bold text-[10px] rounded-full border">Track</button>
            <button onclick="loginAdmin()" class="w-9 h-9 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center border shadow-sm"><i class="fa-solid fa-user-shield"></i></button>
        </div>
    </header>

    <!-- Overlay: Shop Closed -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-clock text-5xl text-red-500 mb-4 animate-pulse"></i>
        <h2 class="text-3xl font-black text-slate-800 uppercase italic">Shop is Closed</h2>
        <p class="text-slate-400 text-sm mt-2">Hum jald hi wapas aayenge!</p>
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-slate-900 text-white rounded-full text-xs font-black uppercase tracking-widest shadow-xl">Admin Login</button>
    </div>

    <!-- Admin Panel (Full Screen) -->
    <div id="admin-panel">
        <div class="max-w-xl mx-auto">
            <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                <h2 class="text-2xl font-black text-yellow-400 italic uppercase">Admin Hub</h2>
                <button onclick="closeAdmin()" class="text-white bg-white/10 w-10 h-10 rounded-full"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-5 rounded-2xl font-black mb-8 uppercase text-lg shadow-2xl transition-all">Loading Status...</button>
            
            <div class="bg-white/5 p-6 rounded-3xl border border-white/10 mb-8">
                <h3 class="text-xs font-black text-gray-400 uppercase mb-4 tracking-widest">Manage Menu</h3>
                <div class="grid grid-cols-1 gap-3 mb-6">
                    <input id="new-n" placeholder="Product Name" class="p-4 rounded-xl bg-white text-black font-bold outline-none border-none">
                    <div class="flex gap-2">
                        <input id="new-p" type="number" placeholder="Price" class="w-24 p-4 rounded-xl bg-white text-black font-bold outline-none border-none">
                        <input id="new-img" placeholder="Image Link (IBB, etc)" class="flex-1 p-4 rounded-xl bg-white text-black font-bold outline-none border-none">
                    </div>
                    <button onclick="addItem()" class="bg-blue-600 text-white font-black py-4 rounded-xl uppercase shadow-lg active:scale-95">Add to Menu</button>
                </div>
                <div id="admin-menu-list" class="space-y-2 max-h-64 overflow-y-auto pr-2"></div>
            </div>

            <h3 class="text-orange-400 font-black mb-4 uppercase text-sm italic">Live Orders</h3>
            <div id="admin-orders-list" class="space-y-4"></div>
        </div>
    </div>

    <main class="max-w-xl mx-auto px-4 py-6">
        <div id="menu-box" class="grid grid-cols-1 gap-4">
            <!-- Items load here -->
        </div>
    </main>

    <!-- Cart -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-xl mx-auto z-40 translate-y-40 transition-all">
        <div onclick="openCheckout()" class="bg-slate-900 p-4 rounded-2xl flex justify-between items-center text-white border-2 border-red-600 shadow-2xl cursor-pointer">
            <div class="flex items-center gap-3 pl-2">
                <i class="fa-solid fa-utensils text-red-500"></i>
                <p id="float-total" class="text-xl font-black text-red-500">₹0</p>
            </div>
            <span class="bg-red-600 px-6 py-2 rounded-xl font-black text-xs uppercase italic tracking-widest">Checkout</span>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 flex flex-col justify-end bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-t-[2.5rem] p-6 max-w-xl mx-auto w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-2xl uppercase italic">Order Details</h3>
                <button onclick="closeCheckout()"><i class="fa-solid fa-circle-xmark text-3xl text-gray-200"></i></button>
            </div>
            <div id="cart-summary" class="bg-gray-50 p-4 rounded-2xl mb-4 space-y-2"></div>
            <div class="flex justify-between font-black text-xl mb-6 px-2"><span>Total Amount</span><span id="sheet-total" class="text-red-600">₹0</span></div>
            <div class="space-y-3">
                <input id="u-n" placeholder="Your Name" class="w-full p-4 bg-gray-100 rounded-xl font-bold outline-none">
                <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-100 rounded-xl font-bold outline-none">
                <input id="u-a" placeholder="Table No / Full Address" class="w-full p-4 bg-gray-100 rounded-xl font-bold outline-none">
                <select id="u-pay" class="w-full p-4 bg-green-50 text-green-700 rounded-xl font-black outline-none border-2 border-green-100">
                    <option value="PAID">Pay Online (Scan QR)</option>
                    <option value="COD">Cash on Delivery</option>
                </select>
                <button onclick="handlePayment()" class="w-full bg-red-600 text-white font-black py-5 rounded-2xl uppercase shadow-xl mt-4 active:scale-95">Send Order via WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/98 z-[11000] flex items-center justify-center p-6 text-center">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full shadow-2xl border-4 border-green-500">
            <h3 class="font-black text-xl mb-4">Scan To Pay</h3>
            <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl mb-6 shadow-lg">
            <button onclick="finalSubmit('PAID')" class="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase">I Have Paid ✅</button>
            <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="mt-4 text-gray-400 font-bold text-xs uppercase">Cancel</button>
        </div>
    </div>

    <!-- Tracking Modal -->
    <div id="track-modal" class="hidden fixed inset-0 bg-black/80 z-[11000] flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full relative">
            <button onclick="document.getElementById('track-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-300"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h3 class="font-black text-center mb-6 italic uppercase tracking-widest">Track Status</h3>
            <input id="track-id" placeholder="Enter Tracking ID" class="w-full p-4 border-2 rounded-2xl text-center font-bold uppercase mb-4 outline-none focus:border-red-500">
            <button onclick="trackOrder()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl uppercase shadow-lg">Check Now</button>
            <div id="track-res" class="mt-8 text-center"></div>
        </div>
    </div>

    <script>
        // FIREBASE MASTER CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();
        let cart = [];
        let isShopOpen = true;

        // 1. Database Connections
        rdb.ref('shop_status').on('value', (snap) => {
            isShopOpen = snap.val() !== false;
            document.getElementById('closed-screen').classList.toggle('hidden', isShopOpen);
            document.getElementById('shop-indicator').innerText = isShopOpen ? "● Accepting Orders" : "○ Offline Now";
            document.getElementById('shop-indicator').style.color = isShopOpen ? "#22c55e" : "#ef4444";
            
            const btn = document.getElementById('toggle-shop-btn');
            if(btn) {
                btn.innerText = isShopOpen ? "Close Shop" : "Open Shop Now";
                btn.className = `w-full py-5 rounded-2xl font-black mb-8 uppercase text-lg shadow-2xl transition-all text-white ${isShopOpen ? 'bg-red-600' : 'bg-green-600'}`;
            }
        });

        rdb.ref('menu').on('value', (snap) => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminList = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminList.innerHTML = '';

            Object.keys(data).forEach(id => {
                const item = data[id];
                const avail = item.available !== false;
                const img = item.image || 'https://via.placeholder.com/150?text=Food';

                box.innerHTML += `
                    <div class="bg-white p-4 rounded-3xl flex items-center justify-between border shadow-sm ${avail ? '' : 'opacity-40 grayscale'}">
                        <div class="flex items-center gap-4">
                            <img src="${img}" class="product-img shadow-sm border border-gray-100">
                            <div><p class="font-black text-slate-800">${item.name}</p>
                            <p class="text-red-600 font-black text-lg">₹${item.price}</p></div>
                        </div>
                        ${avail ? `<button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-600 text-white w-10 h-10 rounded-xl active:scale-90"><i class="fa-solid fa-plus"></i></button>` : '<span class="text-[9px] font-black text-gray-400">OUT</span>'}
                    </div>`;

                adminList.innerHTML += `
                    <div class="flex justify-between items-center bg-white/10 p-3 rounded-2xl border border-white/5">
                        <span class="text-xs font-bold">${item.name}</span>
                        <div class="flex gap-2">
                            <button onclick="rdb.ref('menu/${id}/available').set(${!avail})" class="px-3 py-1 rounded-lg text-[9px] font-black ${avail?'bg-green-600':'bg-red-600'}">${avail?'IN':'OUT'}</button>
                            <button onclick="rdb.ref('menu/${id}').remove()" class="text-red-400 p-2"><i class="fa fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        });

        rdb.ref('orders').on('value', (snap) => {
            const list = document.getElementById('admin-orders-list');
            if(!list) return; list.innerHTML = '';
            const data = snap.val() || {};
            Object.keys(data).reverse().forEach(id => {
                const o = data[id];
                list.innerHTML += `
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 mb-2">
                        <div class="flex justify-between font-black text-yellow-400 mb-1"><span>${o.customerName}</span><span>₹${o.total}</span></div>
                        <p class="text-gray-400 text-xs italic mb-3">${o.items.split('%0A').join(', ')}</p>
                        <div class="flex gap-2">
                            <select onchange="rdb.ref('orders/${id}/status').set(this.value)" class="flex-1 bg-gray-800 p-2 rounded-xl text-xs font-bold border border-white/20">
                                <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                                <option value="Ready" ${o.status==='Ready'?'selected':''}>Ready</option>
                                <option value="Cancel" ${o.status==='Cancel'?'selected':''}>Cancel</option>
                            </select>
                            <button onclick="window.open('https://wa.me/91${o.customerPhone}')" class="bg-green-600 px-4 rounded-xl"><i class="fa-brands fa-whatsapp"></i></button>
                        </div>
                    </div>`;
            });
        });

        // App Logic
        function loginAdmin() {
            if(prompt("Admin Password?") === "1234") {
                document.getElementById('admin-panel').classList.add('active');
            }
        }
        function closeAdmin() { document.getElementById('admin-panel').classList.remove('active'); }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        
        function addItem() {
            const n = document.getElementById('new-n').value;
            const p = document.getElementById('new-p').value;
            const i = document.getElementById('new-img').value;
            if(n && p) {
                rdb.ref('menu').push({ name:n, price:parseInt(p), image:i, available:true });
                document.getElementById('new-n').value = ''; document.getElementById('new-p').value = '';
            }
        }

        function addToCart(n, p) { cart.push({name:n, price:p}); updateCart(); }
        function updateCart() {
            let total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('floating-cart').style.transform = cart.length > 0 ? "translateY(0)" : "translateY(150%)";
            document.getElementById('float-total').innerText = "₹" + total;
            document.getElementById('sheet-total').innerText = "₹" + total;
            document.getElementById('cart-summary').innerHTML = cart.map((item, idx) => `<div class="flex justify-between bg-white p-3 rounded-xl border border-gray-100 font-bold text-sm"><span>${item.name}</span><i class="fa-solid fa-circle-xmark text-red-500 cursor-pointer" onclick="cart.splice(${idx},1);updateCart()"></i></div>`).join('');
        }

        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }

        function handlePayment() {
            const n = document.getElementById('u-n').value;
            const ph = document.getElementById('u-p').value;
            if(!n || !ph) return alert("Please fill Details!");
            if(document.getElementById('u-pay').value === "PAID") document.getElementById('qr-modal').classList.remove('hidden');
            else finalSubmit("COD");
        }

        function finalSubmit(method) {
            const tid = Math.random().toString(36).substring(2, 8).toUpperCase();
            const order = {
                customerName: document.getElementById('u-n').value,
                customerPhone: document.getElementById('u-p').value,
                address: document.getElementById('u-a').value,
                items: cart.map(i => i.name).join('%0A'),
                total: cart.reduce((s, i) => s + i.price, 0),
                payType: method, status: 'Pending', trackingId: tid, timestamp: Date.now()
            };

            rdb.ref('orders').push(order).then(() => {
                const wa = `https://wa.me/918058733741?text=*NEW ORDER: ${tid}*%0A*Name:* ${order.customerName}%0A*Total:* ₹${order.total}%0A*Items:* ${order.items}`;
                window.open(wa, '_blank');
                cart = []; updateCart(); closeCheckout(); document.getElementById('qr-modal').classList.add('hidden');
                alert("Order Successful! ID: " + tid);
            });
        }

        function trackOrder() {
            const id = document.getElementById('track-id').value.toUpperCase();
            rdb.ref('orders').orderByChild('trackingId').equalTo(id).once('value', (snap) => {
                const res = document.getElementById('track-res');
                if(snap.exists()) {
                    const data = Object.values(snap.val())[0];
                    res.innerHTML = `<div class="p-6 bg-red-50 rounded-3xl border-2 border-red-100 animate-bounce"><p class="text-3xl font-black text-red-600">${data.status}</p></div>`;
                } else res.innerHTML = `<p class="font-black text-red-500">ID NOT FOUND!</p>`;
            });
        }
    </script>
</body>
</html>
