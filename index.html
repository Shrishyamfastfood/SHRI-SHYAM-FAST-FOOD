<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food Moulasar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .gradient-nav { background: linear-gradient(90deg, #cc0000 0%, #ff5722 100%); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="gradient-nav text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" alt="Logo" class="w-12 h-12 rounded-full border-2 border-white">
                <div>
                    <h1 class="text-sm font-black italic">SHRI SHYAM FAST FOOD</h1>
                    <!-- YAHAN HAI WOH BINDI -->
                    <p class="text-[10px] flex items-center gap-2 font-bold uppercase">
                        <span id="conn-dot" class="status-dot bg-yellow-400"></span> 
                        <span id="status-text">Connecting...</span>
                    </p>
                </div>
            </div>
            <button onclick="showLogin()" class="text-white/50"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <script>
        const firebaseConfig = { /* ... wahi purana config ... */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Connection Check & Shop Status
        db.collection("settings").doc("shop_status").onSnapshot(doc => {
            const dot = document.getElementById('conn-dot');
            const txt = document.getElementById('status-text');
            
            if(doc.exists) {
                const isOpen = doc.data().isOpen;
                dot.className = isOpen ? "status-dot bg-green-500" : "status-dot bg-red-500";
                txt.innerText = isOpen ? "SHOP OPEN" : "SHOP CLOSED";
            } else {
                dot.className = "status-dot bg-red-500";
                txt.innerText = "OFFLINE";
            }
        }, () => {
            document.getElementById('conn-dot').className = "status-dot bg-red-500";
            document.getElementById('status-text').innerText = "DISCONNECTED";
        });

        function showLogin() { if(prompt("Password:") === "jitu8087") alert("Admin Panel logic yahan add karein..."); }
    </script>
</body>
</html>
