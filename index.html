<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 140px; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,0,0,0.1); }
        .gradient-text { background: linear-gradient(90deg, #dc2626, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-press:active { transform: scale(0.95); transition: 0.2s; }
        .cart-sheet { transition: transform 0.4s; transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; left: 0; top: 0; width: 100%; } }
    </style>
</head>
<body>

    <!-- Notification Sound -->
    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Print Area (Hidden in UI) -->
    <div id="print-area" class="hidden p-4 text-black font-mono text-sm"></div>

    <div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md z-[2000] flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-4xl font-black text-gray-800">Shop Closed</h2>
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-100 rounded-full text-xs font-black text-gray-500 border btn-press uppercase">Owner Login</button>
    </div>

    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 object-cover">
            <div>
                <h1 class="font-black text-lg gradient-text uppercase">Shri Shyam Fast Food</h1>
                <div id="shop-indicator" class="text-[10px] font-black uppercase flex items-center gap-1">Checking...</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('track-modal').classList.remove('hidden')" class="px-3 h-10 rounded-full bg-red-50 border border-red-200 text-red-600 font-black text-[10px] btn-press uppercase">Track</button>
            <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 border text-gray-500 flex items-center justify-center btn-press"><i class="fa-solid fa-sliders"></i></button>
        </div>
    </header>

    <div class="max-w-2xl mx-auto px-4 py-6">
        <!-- Admin Dashboard -->
        <div id="admin-panel" class="hidden bg-gray-900 rounded-[2rem] shadow-2xl p-6 mb-8 text-white">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-yellow-400">Dashboard</h2>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center btn-press"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-xl font-black mb-6 uppercase btn-press">Status...</button>
            
            <div class="bg-white/5 p-4 rounded-2xl mb-6 border border-white/10">
                <p class="font-bold text-gray-300 text-xs mb-3 uppercase">Add Item</p>
                <div class="grid grid-cols-12 gap-2 text-black">
                    <input id="new-i" placeholder="🍔" class="col-span-3 p-3 rounded-xl text-center">
                    <input id="new-n" placeholder="Name" class="col-span-9 p-3 rounded-xl">
                    <input id="new-p" type="number" placeholder="Price" class="col-span-6 p-3 rounded-xl">
                    <button onclick="addItem()" class="col-span-6 bg-red-600 text-white font-black rounded-xl btn-press">ADD +</button>
                </div>
                <div id="admin-menu-list" class="mt-4 space-y-3 max-h-48 overflow-y-auto"></div>
            </div>

            <h3 class="text-lg font-black mb-4 text-orange-400">Live Orders</h3>
            <div id="admin-orders-list" class="space-y-4 max-h-96 overflow-y-auto"></div>
        </div>

        <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Floating Cart -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300 translate-y-32">
        <div onclick="openCheckout()" class="bg-gradient-to-r from-green-600 to-emerald-500 p-4 rounded-2xl shadow-xl flex justify-between items-center text-white cursor-pointer btn-press">
            <div id="float-total-box">
                <p id="float-items" class="text-xs font-bold uppercase">0 Items</p>
                <p id="float-total" class="text-lg font-black">₹0</p>
            </div>
            <div class="font-black text-sm">VIEW CART <i class="fa-solid fa-bag-shopping"></i></div>
        </div>
    </div>

    <!-- Checkout -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl mx-auto rounded-t-[2.5rem] shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-[2.5rem]">
                <h3 class="font-black text-2xl">Checkout</h3>
                <button onclick="closeCheckout()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center btn-press"><i class="fa-solid fa-arrow-down"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <div id="cart-summary" class="bg-gray-50 p-4 rounded-2xl space-y-2"></div>
                <div class="flex justify-between font-black text-lg p-2"><span>Total</span><span id="sheet-total" class="text-red-600">₹0</span></div>
                <input id="u-n" placeholder="Aapka Naam" class="w-full p-4 bg-gray-100 rounded-xl font-bold">
                <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-100 rounded-xl font-bold">
                <input id="u-a" placeholder="Address / Table No." class="w-full p-4 bg-gray-100 rounded-xl font-bold">
                <select id="u-t" class="w-full p-4 bg-gray-100 rounded-xl font-bold">
                    <option>15 मिनट में</option><option>30 मिनट में</option><option>On The Shop</option>
                </select>
                <select id="u-pay" class="w-full p-4 bg-green-50 text-green-700 rounded-xl font-black">
                    <option value="PAID">QR Code (Online Pay)</option>
                    <option value="COD">Cash on Delivery (COD)</option>
                </select>
            </div>
            <div class="p-5 bg-white border-t">
                <button onclick="processPayment()" class="w-full bg-gradient-to-r from-red-600 to-orange-500 text-white font-black py-4 rounded-2xl btn-press">CONFIRM ORDER</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[3000] flex items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full text-center">
             <h3 class="font-black text-2xl mb-2 gradient-text">JAY SHREE SHYAM</h3>
             <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl border-4 mb-6 mx-auto">
             <button onclick="confirmOrderAndSave('PAID')" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-lg mb-3 btn-press">PAYMENT DONE</button>
             <button onclick="document.getElementById('qr-modal').classList.add('hidden');" class="text-gray-400 font-bold text-xs uppercase btn-press">CANCEL</button>
        </div>
    </div>

    <!-- Track Modal -->
    <div id="track-modal" class="hidden fixed inset-0 bg-black/60 z-[3000] flex items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] p-6 max-w-sm w-full relative">
             <button onclick="document.getElementById('track-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
             <h3 class="font-black text-xl mb-4 text-gray-800 text-center">Track Order</h3>
             <input id="track-id-input" placeholder="Tracking ID" class="w-full p-4 bg-gray-50 border rounded-xl font-bold text-center uppercase mb-3 outline-none">
             <button onclick="searchOrder()" class="w-full bg-gray-800 text-white font-black py-3 rounded-xl btn-press">SEARCH</button>
             <div id="track-result" class="mt-2 text-center"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();
        let cart = [];
        let isShopOpen = true;
        let lastOrderCount = 0;

        function generateTrackingId() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

        // Sound Notification Trigger
        rdb.ref('orders').on('value', snap => {
            const count = snap.numChildren();
            if (count > lastOrderCount && lastOrderCount !== 0) {
                document.getElementById('order-sound').play().catch(e => console.log("Click screen to enable sound"));
            }
            lastOrderCount = count;
            renderOrders(snap.val() || {});
        });

        rdb.ref('shop_status').on('value', snap => {
            isShopOpen = (snap.val() !== false);
            document.getElementById('closed-screen').classList.toggle('hidden', isShopOpen);
            document.getElementById('shop-indicator').innerHTML = `<span class="h-2 w-2 rounded-full ${isShopOpen ? 'bg-green-500' : 'bg-red-500'}"></span> ${isShopOpen ? 'OPEN' : 'CLOSED'}`;
            const btn = document.getElementById('toggle-shop-btn');
            btn.innerText = isShopOpen ? "🔴 Turn Off Shop" : "🟢 Turn On Shop";
            btn.className = `w-full py-4 rounded-xl font-black ${isShopOpen ? 'bg-red-600' : 'bg-green-600'} text-white btn-press`;
        });

        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminBox = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminBox.innerHTML = '';
            Object.keys(data).forEach(id => {
                const i = data[id];
                const avail = i.available !== false;
                box.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100 ${avail ? '' : 'opacity-50'}">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-xl border">${i.icon || '🍔'}</div>
                        <div><p class="font-black">${i.name}</p><p class="text-red-500 font-black text-sm">₹${i.price}</p></div>
                    </div>
                    ${avail ? `<button onclick="addToCart('${i.name}', ${i.price})" class="border-2 border-red-100 text-red-500 px-4 py-2 rounded-xl text-xs font-black btn-press">ADD</button>` : `<span class="text-[10px] font-black text-gray-400">OUT</span>`}
                </div>`;
                adminBox.innerHTML += `<div class="bg-white/10 p-2 rounded-lg flex justify-between items-center text-xs">
                    <span>${i.name}</span>
                    <div class="flex gap-2">
                        <button onclick="rdb.ref('menu/${id}/available').set(${!avail})" class="px-2 py-1 rounded ${avail ? 'bg-green-600' : 'bg-red-600'}">${avail ? 'IN' : 'OUT'}</button>
                        <button onclick="rdb.ref('menu/${id}').remove()" class="text-red-400"><i class="fa fa-trash"></i></button>
                    </div>
                </div>`;
            });
        });

        function renderOrders(orders) {
            const list = document.getElementById('admin-orders-list');
            list.innerHTML = '';
            Object.keys(orders).reverse().forEach(id => {
                const o = orders[id];
                list.innerHTML += `
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10 mb-3 text-sm">
                    <div class="flex justify-between font-black text-orange-400"><span>${o.customerName}</span><span>₹${o.total}</span></div>
                    <div class="text-[10px] text-gray-400 mt-1">${o.trackingId} | ${o.payType}</div>
                    <div class="my-2 text-gray-300 font-bold">${o.items.replace(/%0A/g, ', ')}</div>
                    <div class="flex gap-2 mt-3">
                        <select onchange="updateStatus('${id}', this.value, '${o.customerPhone}', '${o.customerName}')" class="flex-1 bg-gray-800 p-2 rounded-lg text-xs outline-none">
                            <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                            <option value="Accepted" ${o.status==='Accepted'?'selected':''}>Accepted</option>
                            <option value="Ready" ${o.status==='Ready'?'selected':''}>Ready</option>
                        </select>
                        <button onclick='printBill(${JSON.stringify(o)})' class="bg-blue-600 px-3 rounded-lg"><i class="fa fa-print"></i></button>
                        <button onclick="window.open('https://wa.me/91${o.customerPhone}')" class="bg-green-600 px-3 rounded-lg"><i class="fa-brands fa-whatsapp"></i></button>
                    </div>
                </div>`;
            });
        }

        function addToCart(n, p) { cart.push({name:n, price:p}); updateCartUI(); }
        function updateCartUI() {
            let total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('floating-cart').classList.toggle('translate-y-32', cart.length === 0);
            document.getElementById('float-items').innerText = `${cart.length} ITEMS`;
            document.getElementById('float-total').innerText = `₹${total}`;
            document.getElementById('sheet-total').innerText = `₹${total}`;
            document.getElementById('cart-summary').innerHTML = cart.map((i, idx) => `<div class="flex justify-between text-sm font-bold"><span>${i.name}</span><div class="flex items-center gap-2"><span>₹${i.price}</span><i onclick="cart.splice(${idx},1);updateCartUI();" class="fa-solid fa-circle-minus text-red-400"></i></div></div>`).join('');
        }

        function processPayment() {
            if(!document.getElementById('u-n').value || !document.getElementById('u-p').value) return alert("Details bhariye");
            if(document.getElementById('u-pay').value === "PAID") document.getElementById('qr-modal').classList.remove('hidden');
            else confirmOrderAndSave("COD");
        }

        function confirmOrderAndSave(method) {
            const trackId = generateTrackingId();
            const name = document.getElementById('u-n').value;
            const phone = document.getElementById('u-p').value;
            const total = cart.reduce((s, i) => s + i.price, 0);
            const itemsFormatted = cart.map(i => `▫️ ${i.name} - ₹${i.price}`).join('\n');
            
            const orderData = {
                customerName: name, customerPhone: phone,
                address: document.getElementById('u-a').value,
                time: document.getElementById('u-t').value,
                items: cart.map(i => i.name).join('%0A'),
                total: total, payType: method, status: 'Pending',
                trackingId: trackId, timestamp: Date.now()
            };

            rdb.ref('orders').push(orderData).then(() => {
                let note = method === "PAID" ? `_(भाई मैंने ₹${total} का पेमेंट QR से कर दिया है, स्क्रीनशॉट भेज रहा हूँ!)_` : `_(Cash on Delivery)_`;
                const msg = `*🍔 नया ${method} ऑर्डर (MOULASAR)*\n\n*ग्राहक:* ${name}\n*नंबर:* ${phone}\n*समय:* ${orderData.time}\n*एड्रेस:* ${orderData.address}\n\n*आइटम्स:*\n${itemsFormatted}\n-------------------\n*कुल बिल: ₹${total}*\n-------------------\n${note}`;
                
                window.open(`https://wa.me/918058733741?text=${encodeURIComponent(msg)}`, '_blank');
                cart = []; updateCartUI(); closeCheckout();
                document.getElementById('qr-modal').classList.add('hidden');
            });
        }

        function printBill(o) {
            const area = document.getElementById('print-area');
            area.innerHTML = `
                <div style="text-align:center">
                    <h3>SHRI SHYAM FAST FOOD</h3>
                    <p>Moulasar | 80587 33741</p>
                    <hr>
                    <p>ID: ${o.trackingId}</p>
                    <p>Name: ${o.customerName}</p>
                    <hr>
                    <div style="text-align:left">${o.items.replace(/%0A/g, '<br>')}</div>
                    <hr>
                    <h4>TOTAL: ₹${o.total}</h4>
                    <p>Thank You!</p>
                </div>`;
            window.print();
        }

        function updateStatus(id, s, p, n) { rdb.ref('orders/'+id).update({status:s}); }
        function loginAdmin() { if(prompt("PIN:")==="8087jitu") document.getElementById('admin-panel').classList.remove('hidden'); }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        function addItem() { 
            const n=document.getElementById('new-n').value, p=document.getElementById('new-p').value, i=document.getElementById('new-i').value;
            if(n && p) rdb.ref('menu').push({name:n, price:parseInt(p), icon:i||'🍔', available:true});
        }
        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }
        function searchOrder() {
            const tid = document.getElementById('track-id-input').value.toUpperCase();
            rdb.ref('orders').orderByChild('trackingId').equalTo(tid).once('value', snap => {
                const val = snap.val();
                document.getElementById('track-result').innerHTML = val ? `<div class="p-4 bg-green-50 rounded-xl font-black text-green-700">STATUS: ${Object.values(val)[0].status}</div>` : `<p class="text-red-500 font-bold">Not Found!</p>`;
            });
        }
    </script>
</body>
</html>
