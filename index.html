<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food | Moulasar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 140px; overflow-x: hidden; }
        
        /* Premium UI */
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,0,0,0.1); }
        .gradient-text { background: linear-gradient(90deg, #dc2626, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-press:active { transform: scale(0.95); transition: 0.2s; }
        
        /* Animations */
        .slide-up { animation: slideUp 0.5s forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Cart Sheet */
        .cart-sheet { transition: transform 0.4s; transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        
        /* Bindi */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px currentColor; }
        .text-green-500 .status-dot { background-color: #22c55e; }
        .text-red-500 .status-dot { background-color: #ef4444; }
    </style>
</head>
<body>

    <!-- 1. DUKAAN BAND OVERLAY -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md z-[2000] flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-4xl font-black text-gray-800">Dukaan Band Hai</h2>
        <p class="text-gray-500 font-bold mt-2">Kripya khulne ka intezaar karein.</p>
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-100 rounded-full text-xs font-black text-gray-500 uppercase tracking-widest border btn-press">
            Admin Login
        </button>
    </div>

    <!-- 2. HEADER (WITH YOUR ORIGINAL LOGO) -->
    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <!-- AAPKA ASLI LOGO -->
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 shadow-md object-cover">
            <div>
                <h1 class="font-black text-lg leading-tight gradient-text uppercase tracking-tight">Shri Shyam Fast Food</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="shop-indicator" class="text-red-500 flex items-center gap-1.5 text-[10px] font-black uppercase">
                        <span class="status-dot"></span> <span id="shop-text">Checking...</span>
                    </span>
                    <span class="text-[10px] font-bold text-gray-400">| MOULASAR</span>
                </div>
            </div>
        </div>
        <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 border text-gray-500 flex items-center justify-center btn-press shadow-sm"><i class="fa-solid fa-sliders"></i></button>
    </header>

    <div class="max-w-2xl mx-auto px-4 py-6">
        
        <!-- 3. ADMIN DASHBOARD -->
        <div id="admin-panel" class="hidden slide-up bg-gray-900 rounded-[2rem] shadow-2xl p-6 mb-8 text-white relative">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black"><i class="fa-solid fa-bolt text-yellow-400 mr-2"></i> MASTER CONTROL</h2>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center btn-press"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Shop Toggle -->
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-xl font-black mb-6 uppercase tracking-widest btn-press shadow-lg"></button>

            <!-- Add Item -->
            <div class="bg-white/5 p-4 rounded-2xl mb-6 border border-white/10">
                <p class="font-bold text-gray-300 text-xs mb-3 uppercase tracking-wider">Naya Item Add Karein</p>
                <div class="grid grid-cols-12 gap-2">
                    <input id="new-i" placeholder="Emoji / Photo Link" class="col-span-3 p-3 bg-black/30 rounded-xl text-center outline-none border border-white/10 text-xs">
                    <input id="new-n" placeholder="Item Name" class="col-span-9 p-3 bg-black/30 rounded-xl outline-none border border-white/10">
                    <input id="new-p" type="number" placeholder="Price (₹)" class="col-span-6 p-3 bg-black/30 rounded-xl outline-none border border-white/10">
                    <button onclick="addItem()" class="col-span-6 bg-gradient-to-r from-red-600 to-orange-500 text-white font-black rounded-xl btn-press shadow-lg">ADD +</button>
                </div>
            </div>

            <!-- Manage Items -->
            <p class="font-bold text-gray-400 text-[10px] mb-3 uppercase tracking-widest">Live Menu</p>
            <div id="admin-menu-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>

        <!-- 4. MENU LIST -->
        <h2 class="text-2xl font-black text-gray-800 tracking-tight mb-4 border-b-2 border-red-100 pb-2 border-dashed">Today's Menu</h2>
        <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    </div>

    <!-- 5. FLOATING CART -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300 translate-y-32">
        <div onclick="openCheckout()" class="bg-gradient-to-r from-green-600 to-emerald-500 p-4 rounded-2xl shadow-xl flex justify-between items-center text-white cursor-pointer btn-press">
            <div>
                <p id="float-items" class="text-xs font-bold uppercase tracking-widest">0 Items</p>
                <p id="float-total" class="text-lg font-black">₹0</p>
            </div>
            <div class="flex items-center gap-2 font-black text-sm">
                VIEW CART <i class="fa-solid fa-bag-shopping text-xl"></i>
            </div>
        </div>
    </div>

    <!-- 6. BOTTOM CHECKOUT SHEET -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl mx-auto rounded-t-[2.5rem] shadow-2xl flex flex-col max-h-[90vh]">
            
            <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-[2.5rem]">
                <h3 class="font-black text-2xl text-gray-800">Checkout</h3>
                <button onclick="closeCheckout()" class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center btn-press text-gray-500"><i class="fa-solid fa-arrow-down"></i></button>
            </div>

            <div class="p-6 overflow-y-auto space-y-5">
                <div class="bg-gray-50 p-4 rounded-2xl border">
                    <p class="text-xs font-bold text-gray-400 mb-3 uppercase">Order Summary</p>
                    <div id="cart-summary" class="space-y-2 mb-3"></div>
                    <div class="flex justify-between items-center border-t pt-3 font-black text-lg">
                        <span>Total Pay</span><span id="sheet-total" class="text-red-600">₹0</span>
                    </div>
                </div>

                <div class="space-y-3">
                    <input id="u-n" placeholder="Aapka Naam" class="w-full p-4 bg-gray-50 border rounded-xl outline-none font-bold">
                    <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 border rounded-xl outline-none font-bold">
                    <input id="u-a" placeholder="Pura Address (Ya Self Pickup)" class="w-full p-4 bg-gray-50 border rounded-xl outline-none font-bold">
                    <select id="u-t" class="w-full p-4 bg-gray-50 border rounded-xl outline-none font-bold">
                        <option>15 मिनट में</option>
                        <option>30 मिनट में</option>
                        <option>1 घंटे में</option>
                    </select>
                </div>

                <div class="space-y-3 pb-6">
                    <select id="u-pay" class="w-full p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl outline-none font-black">
                        <option value="PAID">QR Code (Online Pay)</option>
                        <option value="COD">Cash on Delivery (COD)</option>
                    </select>
                </div>
            </div>

            <div class="p-5 bg-white border-t">
                <button onclick="processPayment()" class="w-full bg-gradient-to-r from-red-600 to-orange-500 text-white font-black py-4 rounded-2xl shadow-xl btn-press">CONFIRM ORDER</button>
            </div>
        </div>
    </div>

    <!-- 7. QR MODAL -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[3000] flex items-center justify-center p-6 text-center backdrop-blur-md">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full slide-up">
             <h3 class="font-black text-2xl mb-2 gradient-text">JAY SHREE SHYAM</h3>
             <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl border-4 mb-6">
             <button onclick="sendWhatsAppOrder('PAID')" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-lg mb-3 btn-press">PAYMENT DONE</button>
             <button onclick="document.getElementById('qr-modal').classList.add('hidden'); document.getElementById('qr-modal').classList.remove('flex');" class="text-gray-400 font-bold text-xs uppercase btn-press">CANCEL</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        let cart = [];
        let isShopOpen = true;

        // 1. Sync Shop
        rdb.ref('shop_status').on('value', snap => {
            isShopOpen = snap.val() ?? true;
            document.getElementById('closed-screen').style.display = isShopOpen ? 'none' : 'flex';
            document.getElementById('shop-indicator').className = isShopOpen ? "text-green-500 flex items-center gap-1.5 text-[10px] font-black uppercase" : "text-red-500 flex items-center gap-1.5 text-[10px] font-black uppercase";
            document.getElementById('shop-text').innerText = isShopOpen ? "SHOP OPEN" : "SHOP CLOSED";
            
            const btn = document.getElementById('toggle-shop-btn');
            btn.innerText = isShopOpen ? "🔴 TURN OFF SHOP" : "🟢 TURN ON SHOP";
            btn.className = isShopOpen ? "w-full py-4 rounded-xl font-black mb-6 uppercase bg-red-600 text-white shadow-lg btn-press" : "w-full py-4 rounded-xl font-black mb-6 uppercase bg-green-500 text-white shadow-lg btn-press";
        });

        // 2. Sync Menu
        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminBox = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminBox.innerHTML = '';
            
            let delay = 0;
            Object.keys(data).forEach(id => {
                const i = data[id];
                
                // ---------------------------------------------------------
                // PHOTO LOGIC START: Automatically Set Photos Based on Name
                // ---------------------------------------------------------
                let displayIcon = i.icon || '';
                let lowerName = i.name.toLowerCase();
                
                if (lowerName.includes('momo')) {
                    displayIcon = 'https://i.ibb.co/wFHJycY9/images.jpg';
                } else if (lowerName.includes('chawmin') || lowerName.includes('chowmein')) {
                    displayIcon = 'https://i.ibb.co/C3r9FycT/images-1.jpg';
                } else if (lowerName.includes('bhel')) {
                    displayIcon = 'https://i.ibb.co/MxjCt7QN/images-2.jpg';
                }

                // Check if the icon is a Web Link (Image) or just Emoji
                let isImage = displayIcon.startsWith('http');
                
                let renderCustomerIcon = isImage 
                    ? `<img src="${displayIcon}" class="w-full h-full object-cover">` 
                    : displayIcon;

                let renderAdminIcon = isImage 
                    ? `<img src="${displayIcon}" class="w-5 h-5 rounded object-cover inline-block mr-1">` 
                    : displayIcon;
                // ---------------------------------------------------------

                // UI Customer
                box.innerHTML += `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100 slide-up" style="animation-delay: ${delay}s">
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 bg-gray-50 rounded-xl flex items-center justify-center text-2xl border overflow-hidden shrink-0">${renderCustomerIcon}</div>
                        <div>
                            <p class="font-black text-gray-800">${i.name}</p>
                            <p class="text-red-500 font-black text-sm">₹${i.price}</p>
                        </div>
                    </div>
                    <button onclick="addToCart('${i.name}', ${i.price})" class="border-2 border-red-100 text-red-500 px-5 py-2 rounded-xl text-xs font-black hover:bg-red-50 btn-press">ADD</button>
                </div>`;
                
                // UI Admin
                adminBox.innerHTML += `
                <div class="flex justify-between items-center bg-white/5 p-2 rounded-lg border border-white/5">
                    <span class="font-bold text-xs truncate w-1/2 flex items-center">${renderAdminIcon} ${i.name}</span>
                    <div class="flex gap-2">
                        <input value="${i.price}" onchange="rdb.ref('menu/${id}/price').set(parseInt(this.value))" class="w-14 p-1 bg-black/40 text-center rounded text-xs font-bold border border-white/10 outline-none text-white">
                        <button onclick="rdb.ref('menu/${id}').remove()" class="text-red-400 p-1"><i class="fa fa-trash"></i></button>
                    </div>
                </div>`;
                delay += 0.05;
            });
        });

        // 3. Admin Tools
        function loginAdmin() { if(prompt("Enter PIN:") === "jitu8087") { document.getElementById('closed-screen').style.display = 'none'; document.getElementById('admin-panel').classList.remove('hidden'); window.scrollTo(0,0); } }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        function addItem() { 
            const n = document.getElementById('new-n').value, p = document.getElementById('new-p').value, i = document.getElementById('new-i').value || "🍽️";
            if(n && p) { rdb.ref('menu').push({name:n, price:parseInt(p), icon:i}); document.getElementById('new-n').value=''; document.getElementById('new-p').value=''; document.getElementById('new-i').value=''; }
        }

        // 4. Cart Logic
        function addToCart(n, p) { cart.push({name:n, price:p}); updateCartUI(); }
        function updateCartUI() {
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            const floatBar = document.getElementById('floating-cart');
            if(cart.length > 0) {
                floatBar.classList.remove('translate-y-32');
                document.getElementById('float-items').innerText = `${cart.length} ITEMS`;
                document.getElementById('float-total').innerText = `₹${total}`;
            } else {
                floatBar.classList.add('translate-y-32');
                closeCheckout();
            }

            const sumBox = document.getElementById('cart-summary');
            sumBox.innerHTML = cart.map((i, idx) => `
                <div class="flex justify-between items-center text-sm font-bold text-gray-700">
                    <span>${i.name}</span>
                    <div class="flex gap-3">
                        <span>₹${i.price}</span>
                        <i onclick="cart.splice(${idx},1);updateCartUI();" class="fa-solid fa-circle-minus text-red-400 text-lg cursor-pointer btn-press"></i>
                    </div>
                </div>`).join('');
            document.getElementById('sheet-total').innerText = `₹${total}`;
        }

        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }

        // 5. Payment & WhatsApp
        function processPayment() {
            if(!document.getElementById('u-n').value || !document.getElementById('u-p').value || !document.getElementById('u-a').value) { 
                alert("Details poori bhariye!"); return; 
            }
            if(document.getElementById('u-pay').value === "PAID") {
                document.getElementById('qr-modal').classList.remove('hidden');
                document.getElementById('qr-modal').classList.add('flex');
            } else {
                sendWhatsAppOrder("COD");
            }
        }

        function sendWhatsAppOrder(type) {
            const n = document.getElementById('u-n').value, p = document.getElementById('u-p').value, a = document.getElementById('u-a').value, t = document.getElementById('u-t').value;
            let items = cart.map(i => `▫️ ${i.name} - ₹${i.price}`).join('%0A');
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            
            let footerMsg = type === "PAID" ? `_(भाई मैंने ₹${total} का पेमेंट QR से कर दिया है, स्क्रीनशॉट भेज रहा हूँ!)_` : `_(Cash on Delivery - पैसे डिलीवरी पर दूंगा)_`;
            const msg = `*🍔 नया ${type} ऑर्डर (MOULASAR)*%0A%0A*ग्राहक:* ${n}%0A*नंबर:* ${p}%0A*समय:* ${t}%0A*एड्रेस:* ${a}%0A%0A*आइटम्स:*%0A${items}%0A-------------------%0A*कुल बिल: ₹${total}*%0A-------------------%0A${footerMsg}`;
            
            window.location.href = `https://wa.me/918058733741?text=${msg}`;
        }
    </script>
</body>
</html>
