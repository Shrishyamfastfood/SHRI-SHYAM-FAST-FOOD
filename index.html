<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food Moulasar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding-bottom: 100px; }
        .gradient-header { background: linear-gradient(135deg, #d32f2f 0%, #ff5722 100%); }
        #closed-screen { display: none; position: fixed; inset: 0; background: white; z-index: 10000; flex-direction: column; align-items: center; justify-content: center; }
        .order-card { border-left: 6px solid #22c55e; transition: 0.3s; }
        .menu-img { width: 80px; height: 80px; object-fit: cover; border-radius: 1rem; }
    </style>
</head>
<body>

    <!-- 1. DUKAN BAND SCREEN -->
    <div id="closed-screen" class="text-center p-6">
        <i class="fa-solid fa-store-slash text-8xl text-red-600 mb-6"></i>
        <h2 class="text-3xl font-black text-gray-900 uppercase italic">Dukaan Band Hai</h2>
        <button onclick="checkAdmin()" class="mt-12 px-8 py-3 bg-gray-100 rounded-full text-[10px] font-black text-gray-400 border border-dashed border-gray-300 uppercase tracking-widest">Admin Login</button>
    </div>

    <!-- 2. HEADER -->
    <header class="gradient-header text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-[100]">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-lg font-black italic tracking-tighter leading-none">SHRI SHYAM FAST FOOD</h1>
                <p class="text-[10px] font-bold mt-1 opacity-90"><i class="fa-solid fa-location-dot"></i> MOULASAR | 8058733741</p>
            </div>
            <button onclick="checkAdmin()" class="bg-white/20 p-3 rounded-2xl backdrop-blur-md"><i class="fa-solid fa-user-tie text-xl"></i></button>
        </div>
    </header>

    <div class="max-w-4xl mx-auto p-4 mt-4">
        
        <!-- 3. ADMIN PANEL (LIVE ORDERS) -->
        <div id="admin-panel" class="hidden space-y-6 mb-10">
            <div class="bg-white p-6 rounded-[2rem] shadow-xl border-t-8 border-green-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-gray-800 uppercase italic">Live Orders Dashboard</h2>
                    <button onclick="toggleShop()" id="shop-btn" class="px-6 py-2 rounded-xl text-white font-black text-[10px]"></button>
                </div>
                <div id="live-orders-list" class="space-y-4">
                    <p class="text-center text-gray-300 py-6 italic text-sm">Koi naya order nahi hai...</p>
                </div>
            </div>
        </div>

        <!-- 4. MENU SECTION -->
        <h2 class="text-2xl font-black mb-6 italic text-gray-800 flex items-center gap-3">Hamara Menu <span class="h-1 w-16 bg-red-600 rounded-full"></span></h2>
        <div id="menu-items-box" class="space-y-4">
            <!-- Items load here -->
        </div>
    </div>

    <!-- 5. CHECKOUT UI -->
    <div id="checkout-ui" class="hidden fixed bottom-0 left-0 right-0 z-[500] p-4">
        <div class="max-w-md mx-auto bg-white rounded-t-[3rem] shadow-[0_-20px_50px_rgba(0,0,0,0.15)] p-8">
            <h3 class="font-black text-xl mb-6 flex justify-between items-center">Order Details <span id="cart-total-top" class="text-red-600">₹0</span></h3>
            <div class="space-y-3">
                <input id="u-name" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none font-bold text-sm" placeholder="Aapka Naam (E.g. Prince)">
                <input id="u-phone" type="tel" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none font-bold text-sm" placeholder="Mobile Number">
                <input id="u-address" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none font-bold text-sm" placeholder="Dukan ka Address ya Self Delivery">
                <select id="u-time" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none font-bold text-sm">
                    <option value="15 Minute mein">15 Minute mein</option>
                    <option value="30 Minute mein">30 Minute mein</option>
                    <option value="1 Ghante mein">1 Ghante mein</option>
                </select>
                <button onclick="confirmOrder()" class="w-full bg-green-600 text-white font-black py-5 rounded-[1.8rem] shadow-xl hover:bg-green-700 transition uppercase tracking-widest">Pay & Order Done</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        let cart = [];
        let isShopOpen = true;

        function init() {
            // Status Monitor
            rdb.ref('shop_status').on('value', (snap) => {
                isShopOpen = snap.val() ?? true;
                document.getElementById('closed-screen').style.display = isShopOpen ? 'none' : 'flex';
                const btn = document.getElementById('shop-btn');
                btn.innerText = isShopOpen ? "CLOSE SHOP" : "OPEN SHOP";
                btn.className = isShopOpen ? "bg-red-600 px-6 py-2 rounded-xl text-white" : "bg-green-600 px-6 py-2 rounded-xl text-white";
            });

            // Menu Load with Photos
            rdb.ref('menu').on('value', (snap) => {
                const box = document.getElementById('menu-items-box');
                const data = snap.val() || [
                    { name: "Special Sandwich", price: 60, img: "https://i.ibb.co/68v8gB2/sandwich.jpg" },
                    { name: "Bhelpuri Economy", price: 30, img: "https://i.ibb.co/Xz9k6qB/bhelpuri.jpg" }
                ];
                box.innerHTML = '';
                Object.values(data).forEach(item => {
                    box.innerHTML += `
                    <div class="bg-white p-4 rounded-[2rem] flex justify-between items-center shadow-sm border border-gray-100">
                        <div class="flex items-center gap-4">
                            <img src="${item.img || 'https://via.placeholder.com/100'}" class="menu-img shadow-md">
                            <div>
                                <p class="font-black text-gray-800 text-sm uppercase">${item.name}</p>
                                <p class="text-red-600 font-black italic">₹${item.price}</p>
                            </div>
                        </div>
                        <button onclick="addToCart('${item.name}', ${item.price})" class="bg-black text-white font-black px-6 py-3 rounded-2xl text-[10px] uppercase shadow-lg">Add +</button>
                    </div>`;
                });
            });

            // Admin: Live Orders Monitor
            rdb.ref('live_orders').on('value', (snap) => {
                const list = document.getElementById('live-orders-list');
                list.innerHTML = '';
                if(snap.exists()){
                    snap.forEach(child => {
                        const o = child.val();
                        list.innerHTML += `
                        <div class="order-card bg-gray-50 p-4 rounded-2xl shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <p class="font-black text-gray-800">${o.name}</p>
                                    <p class="text-xs font-bold text-green-600">${o.phone}</p>
                                </div>
                                <span class="bg-white px-3 py-1 rounded-full text-[9px] font-black border uppercase">${o.time}</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mb-3"><i class="fa-solid fa-location-arrow"></i> ${o.addr}</p>
                            <div class="bg-white p-3 rounded-xl text-xs font-bold text-gray-600 border border-dashed">${o.items_text}</div>
                            <div class="mt-3 flex justify-between items-center">
                                <p class="font-black text-red-600 italic">Bill: ₹${o.total}</p>
                                <button onclick="rdb.ref('live_orders/${child.key}').remove()" class="text-[10px] text-gray-400 underline font-black uppercase tracking-tighter">Mark Done</button>
                            </div>
                        </div>`;
                    });
                } else {
                    list.innerHTML = '<p class="text-center text-gray-300 py-6 italic text-sm">Abhi koi order nahi hai...</p>';
                }
            });
        }

        // Cart Logic
        function addToCart(n, p) { 
            cart.push({name:n, price:p}); 
            let total = cart.reduce((a, b) => a + b.price, 0);
            document.getElementById('cart-total-top').innerText = `₹${total}`;
            document.getElementById('checkout-ui').classList.remove('hidden');
        }

        function confirmOrder() {
            const name = document.getElementById('u-name').value;
            const phone = document.getElementById('u-phone').value;
            const addr = document.getElementById('u-address').value;
            const time = document.getElementById('u-time').value;

            if(!name || !phone || !addr) { alert("Bhai poori details bhariye!"); return; }

            let itemsTxt = "";
            let total = cart.reduce((a, b) => { itemsTxt += `▫️ ${b.name} - ₹${b.price}\n`; return a + b.price; }, 0);

            // 1. SAVE TO ADMIN PANEL (FIREBASE)
            rdb.ref('live_orders').push({
                name, phone, addr, time, total, items_text: itemsTxt, timestamp: Date.now()
            });

            // 2. SEND TO WHATSAPP
            const waMsg = `*🍔 नया PAID ऑर्डर (MOULASAR)*%0A%0A*ग्राहक:* ${name}%0A*नंबर:* ${phone}%0A*समय:* ${time}%0A*एड्रेस:* ${addr}%0A%0A*आइटम्स:*%0A${itemsTxt.replace(/\n/g, '%0A')}-------------------%0A*कुल बिल: ₹${total}*%0A-------------------%0A_(भाई मैंने ₹${total} का पेमेंट QR से कर दिया है, स्क्रीनशॉट भेज रहा हूँ!)_`;
            
            window.location.href = `https://wa.me/918058733741?text=${waMsg}`;
            cart = [];
            document.getElementById('checkout-ui').classList.add('hidden');
        }

        // Admin Auth
        function checkAdmin() { if(prompt("Pass:") === "jitu8087") { document.getElementById('admin-panel').classList.remove('hidden'); document.getElementById('closed-screen').style.display = 'none'; window.scrollTo(0,0); } }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }

        init();
    </script>
</body>
</html>
