<!-- Is hisse ko Checkout Form ke button ke niche add karein -->
<div id="payment-modal" class="hidden fixed inset-0 bg-black/80 z-[100] flex flex-col items-center justify-center p-6 text-white">
    <div class="bg-white text-gray-800 p-6 rounded-3xl max-w-xs w-full text-center">
        <h3 class="text-xl font-black mb-2">Scan & Pay</h3>
        <p class="text-xs text-gray-500 mb-4">Payment karke screenshot WhatsApp par bhejein</p>
        
        <!-- Aapka Bheja Hua QR Code -->
        <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" alt="UPI QR" class="w-full rounded-xl mb-4 shadow-inner">
        
        <div class="flex flex-col gap-2">
            <button onclick="finalSubmit('WhatsApp')" class="bg-green-600 text-white font-bold py-3 rounded-xl">Confirm & Send Message</button>
            <button onclick="closePayment()" class="text-gray-400 text-xs font-bold uppercase py-2">Back to Cart</button>
        </div>
    </div>
</div>

<script>
// Purane processOrder() function ko isse replace karein
function processOrder() {
    const name = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();
    if(!name || !phone) return alert("Please enter name and phone number!");
    
    // Payment Modal dikhao
    document.getElementById('payment-modal').classList.remove('hidden');
}

function closePayment() {
    document.getElementById('payment-modal').classList.add('hidden');
}

function finalSubmit() {
    const name = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();
    const time = document.getElementById('pickup-time').value;

    let itemsTxt = "";
    let subtotal = cart.reduce((acc, item) => { itemsTxt += `▫️ ${item.name} - ₹${item.price}\n`; return acc + item.price; }, 0);
    
    const arrivalHindi = time === "15 Minutes" ? "15 मिनट में" : (time === "30 Minutes" ? "30 मिनट में" : "दुकान पर पहुँच गया हूँ");
    
    // Order Message with Payment Info
    const msg = `*🍔 नया पिकअप ऑर्डर (PAID)*\n\n*ग्राहक:* ${name}\n*नंबर:* ${phone}\n*कब आएँगे:* ${arrivalHindi}\n\n*ऑर्डर आइटम्स:*\n${itemsTxt}-------------------\n*कुल बिल: ₹${subtotal}*\n-------------------\n_(भाई मैंने ₹${subtotal} का पेमेंट कर दिया है, स्क्रीनशॉट भेज रहा हूँ!)_`;
    
    window.location.href = `https://wa.me/918058733741?text=${encodeURIComponent(msg)}`;
    cart = []; 
    updateCartUI();
    closePayment();
}
</script>
