<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; padding-bottom: 160px; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .category-pill.active { background: #dc2626; color: white; transform: scale(1.05); }
        .cart-sheet { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; }
        .cart-sheet:not(.active) { pointer-events: none; }
        .cart-sheet:not(.active) > div { transform: translateY(100%); }
        .cart-sheet > div { transition: transform 0.4s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-red-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="font-bold text-gray-600">Shri Shyam Kitchen Loading...</p>
</div>

<header class="sticky top-0 z-50 glass px-4 py-3 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
        <div class="relative">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full object-cover border-2 border-red-500">
            <div id="status-dot" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></div>
        </div>
        <div>
            <h1 class="font-black text-lg text-red-600 leading-none">SHRI SHYAM</h1>
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-1">Moulasar • Pickup</p>
        </div>
    </div>
    <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-white shadow-sm border flex items-center justify-center text-gray-600"><i class="fa-solid fa-user-shield"></i></button>
</header>

<main class="max-w-2xl mx-auto px-4 mt-6">
    <div class="mb-6">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
            <input id="searchBox" onkeyup="filterMenu()" type="text" placeholder="Search Momos, Burgers..." class="w-full pl-12 pr-4 py-4 rounded-2xl border-none shadow-md outline-none focus:ring-2 ring-red-500 font-medium">
        </div>
    </div>

    <div class="flex gap-3 overflow-x-auto pb-4 no-scrollbar" id="category-bar">
        <button onclick="filterCategory('All')" class="category-pill active px-6 py-2 rounded-full shadow-sm bg-white font-bold whitespace-nowrap">All Items</button>
        <button onclick="filterCategory('Fast Food')" class="category-pill px-6 py-2 rounded-full shadow-sm bg-white font-bold whitespace-nowrap">🍔 Fast Food</button>
        <button onclick="filterCategory('Pizza')" class="category-pill px-6 py-2 rounded-full shadow-sm bg-white font-bold whitespace-nowrap">🍕 Pizza</button>
        <button onclick="filterCategory('Drinks')" class="category-pill px-6 py-2 rounded-full shadow-sm bg-white font-bold whitespace-nowrap">🥤 Drinks</button>
    </div>

    <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    <div id="user-tracking" class="mt-10 hidden"></div>
</main>

<div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-[60] translate-y-32 transition-transform duration-500">
    <button onclick="openCheckout()" class="w-full bg-gray-900 text-white p-4 rounded-[2rem] shadow-2xl flex justify-between items-center px-8">
        <div class="flex items-center gap-4">
            <div class="relative"><i class="fa-solid fa-bag-shopping text-2xl"></i><span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span></div>
            <div class="text-left"><p id="cart-total" class="font-black text-xl leading-none">₹0</p><p class="text-[10px] text-gray-400 font-bold uppercase">View Cart</p></div>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
    </button>
</div>

<div id="checkout-sheet" class="cart-sheet bg-black/60 backdrop-blur-sm">
    <div class="bg-white rounded-t-[3rem] w-full max-w-2xl mx-auto max-h-[90vh] flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h3 class="text-2xl font-black text-gray-800">Your Order</h3>
            <button onclick="closeCheckout()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 overflow-y-auto flex-1"><div id="cart-items" class="space-y-4 mb-8"></div>
            <div class="space-y-4">
                <input id="user-name" placeholder="Aapka Naam" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-red-500 font-bold">
                <input id="user-phone" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-red-500 font-bold">
                <div class="grid grid-cols-2 gap-3">
                    <select id="pickup-time" class="p-4 bg-gray-50 rounded-2xl font-bold outline-none"><option>10-15 Mins</option><option>20-30 Mins</option><option>Direct Pickup</option></select>
                    <select id="pay-method" class="p-4 bg-green-50 text-green-700 rounded-2xl font-bold outline-none"><option value="CASH">Cash</option><option value="ONLINE">Online (QR)</option></select>
                </div>
            </div>
        </div>
        <div class="p-6 bg-gray-50">
            <div class="flex justify-between mb-4"><span class="font-bold">Total</span><span id="final-total" class="text-2xl font-black text-red-600">₹0</span></div>
            <button onclick="placeOrder()" class="w-full bg-red-600 text-white py-5 rounded-[2rem] font-black text-lg">CONFIRM ORDER</button>
        </div>
    </div>
</div>

<div id="admin-panel" class="hidden fixed inset-0 bg-gray-950 z-[9999] text-white p-6 overflow-y-auto">
    <div class="flex justify-between mb-8">
        <h2 class="text-2xl font-black text-yellow-400">Owner Panel</h2>
        <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="text-2xl"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="bg-white/5 p-4 rounded-2xl">Revenue: <h3 id="admin-revenue" class="text-xl font-bold">₹0</h3></div>
        <div class="bg-white/5 p-4 rounded-2xl">Orders: <h3 id="admin-pending" class="text-xl font-bold">0</h3></div>
    </div>
    <button id="shop-toggle" onclick="toggleShopStatus()" class="w-full py-4 rounded-2xl font-black mb-8 transition-all"></button>
    <div id="admin-orders-list" class="space-y-4 mb-10"></div>
    <div class="bg-white/5 p-6 rounded-3xl border border-white/10">
        <h3 class="mb-4 font-bold">Add Item</h3>
        <input id="add-icon" placeholder="🍔" class="w-full mb-2 p-3 bg-black/40 rounded-xl">
        <input id="add-name" placeholder="Item Name" class="w-full mb-2 p-3 bg-black/40 rounded-xl">
        <input id="add-price" type="number" placeholder="Price" class="w-full mb-2 p-3 bg-black/40 rounded-xl">
        <button onclick="addNewItem()" class="w-full bg-yellow-500 text-black font-black py-3 rounded-xl">SAVE ITEM</button>
    </div>
</div>

<div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[3000] flex items-center justify-center p-6">
    <div class="bg-white rounded-[3rem] p-8 max-w-sm w-full text-center">
        <h3 class="font-black text-2xl mb-6">Scan to Pay</h3>
        <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl mb-6">
        <button onclick="finishOrderProcess('PAID')" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black">I HAVE PAID</button>
    </div>
</div>

<audio id="adminSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
    authDomain: "shri-shyam-fast-food.firebaseapp.com",
    databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
    projectId: "shri-shyam-fast-food",
    storageBucket: "shri-shyam-fast-food.firebasestorage.app",
    messagingSenderId: "828353855950",
    appId: "1:828353855950:web:96d62828e8e410e8812b9f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let cart = [], menuData = [], isShopOpen = true, currentCategory = 'All';

// Helper function to hide loader
function hideLoader() {
    document.getElementById('loader').style.display = 'none';
}

// Store Status
db.ref('shop_status').on('value', snap => {
    isShopOpen = snap.val() !== false;
    document.getElementById('status-dot').className = `absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white ${isShopOpen ? 'bg-green-500' : 'bg-red-500'}`;
    const btn = document.getElementById('shop-toggle');
    if(btn) {
        btn.innerText = isShopOpen ? 'Turn Shop OFF' : 'Turn Shop ON';
        btn.className = `w-full py-4 rounded-2xl font-black mb-8 uppercase ${isShopOpen ? 'bg-red-600 text-white' : 'bg-green-600 text-white'}`;
    }
    hideLoader(); // Hide loader if store status is received
});

// Menu
db.ref('menu').on('value', snap => {
    const data = snap.val() || {};
    menuData = Object.keys(data).map(id => ({ id, ...data[id] }));
    renderMenu();
    hideLoader();
});

// Admin Orders
db.ref('orders').on('value', snap => {
    const orders = snap.val() || {};
    renderAdminOrders(orders);
    updateAnalytics(orders);
});

function renderMenu() {
    const box = document.getElementById('menu-box');
    box.innerHTML = '';
    const filtered = currentCategory === 'All' ? menuData : menuData.filter(i => i.category === currentCategory);
    filtered.forEach(item => {
        const avail = item.available !== false;
        box.innerHTML += `
            <div class="bg-white p-4 rounded-3xl shadow-sm flex justify-between items-center ${!avail ? 'grayscale opacity-60' : ''}">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-gray-50 rounded-2xl flex items-center justify-center text-2xl border">${item.icon}</div>
                    <div><h4 class="font-black text-gray-800">${item.name}</h4><p class="text-red-600 font-black">₹${item.price}</p></div>
                </div>
                ${avail ? `<button onclick="addToCart('${item.id}')" class="bg-red-50 text-red-600 w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition-all"><i class="fa-solid fa-plus"></i></button>` : ''}
            </div>`;
    });
}

function addToCart(id) {
    const item = menuData.find(m => m.id === id);
    cart.push(item);
    updateCartUI();
}

function updateCartUI() {
    const total = cart.reduce((s, i) => s + i.price, 0);
    document.getElementById('cart-count').innerText = cart.length;
    document.getElementById('cart-total').innerText = `₹${total}`;
    document.getElementById('final-total').innerText = `₹${total}`;
    document.getElementById('floating-cart').style.transform = cart.length > 0 ? 'translateY(0)' : 'translateY(128px)';
    
    const list = document.getElementById('cart-items');
    list.innerHTML = cart.map((item, idx) => `
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
            <p class="font-bold">${item.name}</p>
            <div class="flex items-center gap-4"><span class="font-black">₹${item.price}</span>
            <button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>
        </div>`).join('');
}

function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }

function placeOrder() {
    const name = document.getElementById('user-name').value;
    const phone = document.getElementById('user-phone').value;
    if(!name || phone.length < 10) return alert('Name aur Number sahi bhariye!');
    if(document.getElementById('pay-method').value === 'ONLINE') document.getElementById('qr-modal').classList.remove('hidden');
    else finishOrderProcess('CASH');
}

function finishOrderProcess(payType) {
    const token = Math.floor(1000 + Math.random() * 9000);
    const total = cart.reduce((s, i) => s + i.price, 0);
    const orderData = {
        token, customerName: document.getElementById('user-name').value, customerPhone: document.getElementById('user-phone').value,
        pickupTime: document.getElementById('pickup-time').value, items: cart.map(i => i.name).join(', '),
        total, payType, status: 'Pending', timestamp: Date.now()
    };

    db.ref('orders').push(orderData).then(() => {
        window.location.href = `https://wa.me/918058733741?text=Order Token: #${token}, Name: ${orderData.customerName}, Items: ${orderData.items}`;
    });
}

function renderAdminOrders(orders) {
    const list = document.getElementById('admin-orders-list');
    list.innerHTML = Object.keys(orders).reverse().map(id => {
        const o = orders[id];
        return o.status === 'Completed' ? '' : `
        <div class="bg-white/5 p-5 rounded-3xl border border-white/10">
            <h4 class="font-black text-yellow-400">#${o.token} • ${o.customerName}</h4>
            <p class="text-xs text-gray-400">${o.items}</p>
            <div class="flex gap-2 mt-4">
                <button onclick="db.ref('orders/${id}/status').set('Ready')" class="bg-green-600 px-4 py-2 rounded-lg text-xs">Ready</button>
                <button onclick="db.ref('orders/${id}/status').set('Completed')" class="bg-white/10 px-4 py-2 rounded-lg text-xs">Done</button>
            </div>
        </div>`;
    }).join('');
}

function updateAnalytics(orders) {
    let rev = 0, pend = 0;
    Object.values(orders).forEach(o => {
        if(o.status !== 'Cancelled') rev += o.total;
        if(o.status === 'Pending') pend++;
    });
    document.getElementById('admin-revenue').innerText = `₹${rev}`;
    document.getElementById('admin-pending').innerText = pend;
}

function loginAdmin() { if(prompt('Admin PIN:') === '8087jitu') document.getElementById('admin-panel').classList.remove('hidden'); }
function toggleShopStatus() { db.ref('shop_status').set(!isShopOpen); }
function addNewItem() {
    const name = document.getElementById('add-name').value;
    const price = document.getElementById('add-price').value;
    if(name && price) db.ref('menu').push({ name, icon: document.getElementById('add-icon').value, price: parseInt(price), available: true });
}
function filterCategory(cat) { 
    currentCategory = cat; 
    document.querySelectorAll('.category-pill').forEach(b => b.classList.toggle('active', b.innerText.includes(cat)));
    renderMenu(); 
}
function filterMenu() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    document.querySelectorAll('#menu-box > div').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
}

// Initial safety: hide loader after 5 seconds even if Firebase fails
setTimeout(hideLoader, 5000);
</script>
</body>
</html>
