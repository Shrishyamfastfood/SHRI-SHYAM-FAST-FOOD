<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 140px; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,0,0,0.1); }
        .btn-press:active { transform: scale(0.95); transition: 0.2s; }
        .cart-sheet { transition: transform 0.4s; transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        .best-seller { background: #fbbf24; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: 900; position: absolute; top: -8px; left: 10px; }
        
        /* FIX: Admin Panel Layering */
        #admin-panel { z-index: 3000 !important; position: relative; }
        #closed-screen { z-index: 2000 !important; }
    </style>
</head>
<body>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Closed Screen Overlay -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-4xl font-black text-gray-800">Shop Closed</h2>
        <p class="text-gray-500 font-bold mt-2">Kripya khulne ka intezaar karein.</p>
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-100 rounded-full text-xs font-black border btn-press uppercase">Owner Login</button>
    </div>

    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 object-cover">
            <div>
                <h1 class="font-black text-lg text-red-600 uppercase tracking-tight">Shri Shyam Fast Food</h1>
                <div id="shop-indicator" class="text-[10px] font-black flex items-center gap-1 uppercase">Checking...</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('track-modal').classList.remove('hidden')" class="px-3 h-10 rounded-full bg-red-50 text-red-600 font-black text-[10px] btn-press uppercase border border-red-100">Track</button>
            <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 border text-gray-500 flex items-center justify-center btn-press"><i class="fa-solid fa-sliders"></i></button>
        </div>
    </header>

    <div class="max-w-2xl mx-auto px-4 py-6">
        <!-- Admin Dashboard (Fixed Z-Index) -->
        <div id="admin-panel" class="hidden bg-gray-900 rounded-[2rem] shadow-2xl p-6 mb-8 text-white sticky top-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-yellow-400">Admin Hub</h2>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center btn-press"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-xl font-black mb-6 uppercase btn-press">Checking...</button>
            
            <div class="bg-white/5 p-4 rounded-2xl mb-6 border border-white/10">
                <div class="grid grid-cols-12 gap-2 text-black mb-4">
                    <input id="new-i" placeholder="🍔" class="col-span-3 p-3 rounded-xl text-center outline-none">
                    <input id="new-n" placeholder="Item Name" class="col-span-9 p-3 rounded-xl outline-none">
                    <input id="new-p" type="number" placeholder="Price" class="col-span-6 p-3 rounded-xl outline-none">
                    <button onclick="addItem()" class="col-span-6 bg-red-600 text-white font-black rounded-xl btn-press uppercase">Add +</button>
                </div>
                <div id="admin-menu-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
            </div>
            <h3 class="text-lg font-black mb-4 text-orange-400 uppercase">Live Orders</h3>
            <div id="admin-orders-list" class="space-y-4 max-h-96 overflow-y-auto"></div>
        </div>

        <h2 class="text-2xl font-black text-gray-800 mb-6 border-b-2 border-red-100 pb-2">Menu</h2>
        <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Floating Cart Bar -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300 translate-y-32">
        <div onclick="openCheckout()" class="bg-black p-4 rounded-2xl shadow-2xl flex justify-between items-center text-white cursor-pointer btn-press border-2 border-red-600">
            <div>
                <p id="float-items" class="text-xs font-bold text-gray-400">0 ITEMS</p>
                <p id="float-total" class="text-lg font-black text-red-500">₹0</p>
            </div>
            <div class="bg-red-600 px-6 py-2 rounded-xl font-black text-xs uppercase">Check <i class="fa-solid fa-arrow-right ml-2"></i></div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 z-[1000] flex flex-col justify-end bg-black/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl mx-auto rounded-t-[2.5rem] shadow-2xl flex flex-col max-h-[92vh]">
            <div class="p-6 border-b flex justify-between items-center"><h3 class="font-black text-2xl">Confirm Order</h3><button onclick="closeCheckout()" class="w-10 h-10 bg-gray-100 rounded-full btn-press"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="p-6 overflow-y-auto space-y-4">
                <div id="cart-summary" class="bg-gray-50 p-4 rounded-2xl space-y-3"></div>
                <div class="flex justify-between font-black text-xl px-2"><span>Total Pay</span><span id="sheet-total" class="text-red-600">₹0</span></div>
                <input id="u-n" placeholder="Aapka Naam" class="w-full p-4 bg-gray-50 border-2 rounded-xl font-bold outline-none">
                <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 border-2 rounded-xl font-bold outline-none">
                <input id="u-a" placeholder="Address / Table No." class="w-full p-4 bg-gray-50 border-2 rounded-xl font-bold outline-none">
                <div class="flex gap-2">
                    <select id="u-t" class="flex-1 p-4 bg-gray-50 border-2 rounded-xl font-bold outline-none"><option>15 मिनट में</option><option>30 मिनट में</option><option>On Shop</option></select>
                    <select id="u-pay" class="flex-1 p-4 bg-green-50 text-green-700 rounded-xl font-black border-2 border-green-200 outline-none"><option value="PAID">QR (Online)</option><option value="COD">COD (Cash)</option></select>
                </div>
            </div>
            <div class="p-6 bg-white border-t"><button onclick="processPayment()" class="w-full bg-red-600 text-white font-black py-4 rounded-2xl shadow-xl btn-press uppercase tracking-widest">Confirm Details</button></div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/98 z-[3000] flex items-center justify-center p-6 text-center">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full">
             <h3 class="font-black text-xl mb-4 uppercase">Scan to Pay</h3>
             <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl border-4 mb-6">
             <button onclick="confirmOrderAndSave('PAID')" class="w-full bg-green-500 text-white font-black py-4 rounded-xl btn-press uppercase">Payment Done ✅</button>
             <button onclick="document.getElementById('qr-modal').classList.add('hidden');" class="mt-4 text-gray-400 font-bold text-xs uppercase">Cancel</button>
        </div>
    </div>

    <!-- Track Modal -->
    <div id="track-modal" class="hidden fixed inset-0 bg-black/60 z-[3000] flex items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full relative">
             <button onclick="document.getElementById('track-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
             <h3 class="font-black text-xl mb-6 text-center uppercase tracking-widest">Order Tracking</h3>
             <input id="track-id-input" placeholder="Tracking ID" class="w-full p-4 bg-gray-50 border-2 rounded-xl font-bold text-center uppercase mb-4 outline-none">
             <button onclick="searchOrder()" class="w-full bg-red-600 text-white font-black py-4 rounded-xl btn-press uppercase">Track</button>
             <div id="track-result" class="mt-4"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();
        let cart = [];
        let isShopOpen = true;
        let lastOrderCount = 0;

        function generateTrackingId() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

        rdb.ref('shop_status').on('value', snap => {
            let val = snap.val();
            if (val === null) { rdb.ref('shop_status').set(true); val = true; }
            isShopOpen = (val !== false);
            document.getElementById('closed-screen').classList.toggle('hidden', isShopOpen);
            document.getElementById('shop-indicator').innerHTML = `<span class="h-2 w-2 rounded-full ${isShopOpen ? 'bg-green-500' : 'bg-red-500'}"></span> ${isShopOpen ? 'Online' : 'Offline'}`;
            const btn = document.getElementById('toggle-shop-btn');
            if(btn) {
                btn.innerText = isShopOpen ? "🔴 Turn Off Shop Now" : "🟢 Open Shop Now";
                btn.className = `w-full py-4 rounded-xl font-black ${isShopOpen ? 'bg-red-600' : 'bg-green-600'} text-white btn-press uppercase`;
            }
        });

        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminBox = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminBox.innerHTML = '';
            Object.keys(data).forEach(id => {
                const i = data[id];
                const avail = i.available !== false;
                box.innerHTML += `<div class="relative bg-white p-5 rounded-2xl flex justify-between items-center shadow-sm border ${avail ? '' : 'opacity-40 grayscale'}">
                    ${i.bestSeller ? '<span class="best-seller">BEST SELLER</span>' : ''}
                    <div class="flex items-center gap-4"><div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-xl border">${i.icon || '🍔'}</div><div><p class="font-black">${i.name}</p><p class="text-red-600 font-black">₹${i.price}</p></div></div>
                    ${avail ? `<button onclick="addToCart('${i.name}', ${i.price})" class="bg-red-50 text-red-600 px-5 py-2 rounded-xl text-xs font-black btn-press">ADD</button>` : `<span class="text-[10px] font-black text-gray-400">OUT</span>`}
                </div>`;
                adminBox.innerHTML += `<div class="bg-white/10 p-2 rounded-lg flex justify-between items-center text-xs mb-2"><span>${i.name}</span><div class="flex gap-2">
                    <button onclick="rdb.ref('menu/${id}/bestSeller').set(${!i.bestSeller})" class="px-2 rounded ${i.bestSeller ? 'bg-yellow-500':'bg-gray-600'}">★</button>
                    <button onclick="rdb.ref('menu/${id}/available').set(${!avail})" class="px-2 rounded ${avail ? 'bg-green-600':'bg-red-600'}">${avail ? 'IN':'OUT'}</button>
                    <button onclick="if(confirm('Delete?')) rdb.ref('menu/${id}').remove()" class="text-red-400"><i class="fa fa-trash"></i></button>
                </div></div>`;
            });
        });

        rdb.ref('orders').on('value', snap => {
            const orders = snap.val() || {};
            const count = snap.numChildren();
            if (count > lastOrderCount && lastOrderCount !== 0) document.getElementById('order-sound').play().catch(e => {});
            lastOrderCount = count;
            const list = document.getElementById('admin-orders-list');
            if(!list) return; list.innerHTML = '';
            Object.keys(orders).reverse().forEach(id => {
                const o = orders[id];
                list.innerHTML += `<div class="bg-white/10 p-4 rounded-2xl border border-white/10 mb-3 text-sm">
                    <div class="flex justify-between font-black text-yellow-400"><span>${o.customerName}</span><span>₹${o.total}</span></div>
                    <div class="text-[10px] text-gray-400 uppercase mt-1 tracking-widest">${o.trackingId} | ${o.payType}</div>
                    <div class="my-3 text-gray-200 bg-black/30 p-2 rounded-lg font-medium">${o.items.replace(/%0A/g, ', ')}</div>
                    <div class="flex gap-2">
                        <select onchange="rdb.ref('orders/${id}/status').set(this.value)" class="flex-1 bg-gray-800 p-2 rounded-xl text-xs font-bold border border-white/10 outline-none text-white">
                            <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                            <option value="Accepted" ${o.status==='Accepted'?'selected':''}>Accepted</option>
                            <option value="Cooking" ${o.status==='Cooking'?'selected':''}>Cooking</option>
                            <option value="Ready" ${o.status==='Ready'?'selected':''}>Ready</option>
                            <option value="Cancel" ${o.status==='Cancel'?'selected':''}>Cancel</option>
                        </select>
                        <button onclick="window.open('https://wa.me/91${o.customerPhone}')" class="bg-green-600 px-4 rounded-xl text-white"><i class="fa-brands fa-whatsapp"></i></button>
                    </div>
                </div>`;
            });
        });

        function addToCart(n, p) { cart.push({name:n, price:p}); updateCartUI(); }
        function updateCartUI() {
            let total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('floating-cart').classList.toggle('translate-y-32', cart.length === 0);
            document.getElementById('float-items').innerText = `${cart.length} ITEMS`;
            document.getElementById('float-total').innerText = `₹${total}`;
            document.getElementById('sheet-total').innerText = `₹${total}`;
            document.getElementById('cart-summary').innerHTML = cart.map((i, idx) => `<div class="flex justify-between text-sm font-bold p-2 bg-white rounded-xl"><span>${i.name}</span><i onclick="cart.splice(${idx},1);updateCartUI();" class="fa-solid fa-circle-xmark text-red-400 cursor-pointer"></i></div>`).join('');
        }

        function processPayment() {
            if(!document.getElementById('u-n').value || !document.getElementById('u-p').value) return alert("Kripya details bhariye!");
            if(document.getElementById('u-pay').value === "PAID") document.getElementById('qr-modal').classList.remove('hidden');
            else confirmOrderAndSave("COD");
        }

        function confirmOrderAndSave(method) {
            const trackId = generateTrackingId();
            const name = document.getElementById('u-n').value, phone = document.getElementById('u-p').value;
            const addr = document.getElementById('u-a').value, time = document.getElementById('u-t').value;
            const total = cart.reduce((s, i) => s + i.price, 0);
            const itemsFormatted = cart.map(i => `▫️ ${i.name} - ₹${i.price}`).join('\n');
            
            const orderData = {
                customerName: name, customerPhone: phone, address: addr, time: time,
                items: cart.map(i => i.name).join('%0A'), total: total, payType: method,
                status: 'Pending', trackingId: trackId, timestamp: Date.now()
            };

            rdb.ref('orders').push(orderData).then(() => {
                let note = method === "PAID" ? `\n_(भाई मैंने ₹${total} का पेमेंट QR से कर दिया है, स्क्रीनशॉट भेज रहा हूँ!)_` : `\n_(Cash on Delivery)_`;
                const msg = `*🍔 नया ${method} ऑर्डर (MOULASAR)*\n\n*ग्राहक:* ${name}\n*नंबर:* ${phone}\n*समय:* ${time}\n*एड्रेस:* ${addr}\n\n*आइटम्स:*\n${itemsFormatted}\n-------------------\n*कुल बिल: ₹${total}*\n-------------------\n*Tracking ID:* ${trackId}${note}`;
                window.open(`https://wa.me/918058733741?text=${encodeURIComponent(msg)}`, '_blank');
                cart = []; updateCartUI(); closeCheckout();
                document.getElementById('qr-modal').classList.add('hidden');
                alert("Order Placed Successfully! ID: " + trackId);
            });
        }

        function loginAdmin() { if(prompt("ENTER PIN:")==="8087jitu") document.getElementById('admin-panel').classList.remove('hidden'); }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        function addItem() { 
            const n=document.getElementById('new-n').value, p=document.getElementById('new-p').value, i=document.getElementById('new-i').value;
            if(n && p) {
                rdb.ref('menu').push({name:n, price:parseInt(p), icon:i||'🍔', available:true, bestSeller:false});
                document.getElementById('new-n').value=''; document.getElementById('new-p').value='';
            }
        }
        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }
        function searchOrder() {
            const tid = document.getElementById('track-id-input').value.toUpperCase();
            rdb.ref('orders').orderByChild('trackingId').equalTo(tid).once('value', snap => {
                const val = snap.val();
                const res = document.getElementById('track-result');
                if(val) {
                    const o = Object.values(val)[0];
                    res.innerHTML = `<div class="p-4 bg-green-50 text-green-700 font-black rounded-xl text-center uppercase tracking-tighter">${o.status}</div>`;
                } else res.innerHTML = `<p class="text-red-500 font-bold text-center">Not Found!</p>`;
            });
        }
    </script>
</body>
</html>
