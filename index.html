<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Shri Shyam Fast Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --brand-orange: #FF5722; --brand-yellow: #FFC107; }
        body { background-color: #fffaf0; }
        .bg-brand { background-color: var(--brand-orange); }
        .text-brand { color: var(--brand-orange); }
    </style>
</head>
<body class="font-sans">

    <!-- NAVIGATION -->
    <nav class="bg-brand p-4 text-white flex justify-between items-center sticky top-0 z-50 shadow-lg">
        <h1 class="text-xl font-bold">Jay Shri Shyam Fast Food</h1>
        <button onclick="toggleAdmin()" class="text-sm bg-white text-orange-600 px-3 py-1 rounded">Admin Login</button>
    </nav>

    <!-- CUSTOMER SECTION -->
    <div id="customer-view" class="max-w-md mx-auto p-4">
        <!-- Menu -->
        <h2 class="text-2xl font-bold mb-4 border-b-2 border-orange-200">Menu</h2>
        
        <div id="menu-list" class="space-y-4">
            <!-- Items will be injected here -->
        </div>

        <!-- Cart Summary -->
        <div class="mt-8 bg-white p-4 rounded-xl shadow-md border-t-4 border-orange-500">
            <h3 class="font-bold text-lg mb-2">Your Cart</h3>
            <div id="cart-items" class="text-sm text-gray-600 mb-2">Cart is empty</div>
            <hr class="my-2">
            <div class="flex justify-between"><span>Subtotal:</span> <span id="subtotal">₹0</span></div>
            <div class="flex justify-between text-blue-600"><span>Delivery:</span> <span id="delivery">₹0</span></div>
            <div id="free-gift" class="text-green-600 font-bold hidden">🎁 1 Free Cold Drink Included!</div>
            <div class="flex justify-between font-bold text-xl mt-2"><span>Total:</span> <span id="total">₹0</span></div>
            
            <p id="min-order-msg" class="text-red-500 text-xs mt-2"></p>
            
            <button id="checkout-btn" disabled class="w-full bg-gray-400 text-white py-3 rounded-lg mt-4 font-bold uppercase tracking-wider">
                Order via PhonePe QR
            </button>
        </div>
    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-xs">
            <h2 class="text-xl font-bold mb-4">Admin Access</h2>
            <input type="text" id="admin-id" placeholder="ID" class="w-full border p-2 mb-2 rounded">
            <input type="password" id="admin-pass" placeholder="Password" class="w-full border p-2 mb-4 rounded">
            <button onclick="login()" class="w-full bg-brand text-white py-2 rounded">Login</button>
            <button onclick="toggleAdmin()" class="w-full text-gray-500 mt-2 text-sm">Cancel</button>
        </div>
    </div>

    <script>
        const menu = [
            { id: 1, name: "Sandwich", price: 60, cat: "🥪" },
            { id: 2, name: "Burger", price: 50, cat: "🍔" },
            { id: 3, name: "Momos (Full)", price: 80, cat: "🥟" },
            { id: 4, name: "Pav Bhaji (Full)", price: 90, cat: "🥘" },
            { id: 5, name: "Chowmein (Full)", price: 70, cat: "🍝" }
        ];

        let cart = [];

        function renderMenu() {
            const menuList = document.getElementById('menu-list');
            menuList.innerHTML = menu.map(item => `
                <div class="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm">
                    <div>
                        <span class="text-lg">${item.cat}</span>
                        <span class="font-medium">${item.name}</span>
                        <div class="text-orange-600 font-bold">₹${item.price}</div>
                    </div>
                    <button onclick="addToCart(${item.id})" class="bg-orange-100 text-orange-600 px-4 py-1 rounded-full border border-orange-600 hover:bg-orange-600 hover:text-white transition">+ Add</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = menu.find(m => m.id === id);
            cart.push(item);
            updateCart();
        }

        function updateCart() {
            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            const delivery = (subtotal > 0 && subtotal < 200) ? 20 : 0;
            const isMinMet = subtotal >= 100;
            const hasFreeDrink = subtotal >= 100;

            document.getElementById('subtotal').innerText = `₹${subtotal}`;
            document.getElementById('delivery').innerText = `₹${delivery}`;
            document.getElementById('total').innerText = `₹${subtotal + delivery}`;
            
            // Free Drink Logic
            const giftEl = document.getElementById('free-gift');
            hasFreeDrink ? giftEl.classList.remove('hidden') : giftEl.classList.add('hidden');

            // Checkout Validation
            const btn = document.getElementById('checkout-btn');
            const msg = document.getElementById('min-order-msg');
            
            if (subtotal > 0 && !isMinMet) {
                msg.innerText = "Minimum order ₹100 required.";
                btn.disabled = true;
                btn.classList.replace('bg-brand', 'bg-gray-400');
            } else if (subtotal >= 100) {
                msg.innerText = "";
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-brand');
            }

            document.getElementById('cart-items').innerText = cart.length > 0 ? `${cart.length} items added` : "Cart is empty";
        }

        function toggleAdmin() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
        }

        function login() {
            const id = document.getElementById('admin-id').value;
            const pass = document.getElementById('admin-pass').value;
            if(id === "Jitu" && pass === "Jitu12") {
                alert("Welcome Jitu! Redirecting to Admin Panel...");
                // Here you would redirect to admin.html
            } else {
                alert("Invalid Credentials");
            }
        }

        renderMenu();
    </script>
</body>
</html>
