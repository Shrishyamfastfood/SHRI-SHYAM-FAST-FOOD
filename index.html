<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food</title>
    <style>
        /* === CSS & ANIMATIONS === */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8f9fa; color: #333; overflow-x: hidden; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Navbar */
        .navbar { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); animation: slideDown 0.5s ease-out; position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 22px; cursor: pointer; }
        .nav-btns button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; margin-left: 10px; }
        .nav-btns button:hover { background: white; color: #ff416c; transform: translateY(-2px); }

        /* Customer Section */
        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; animation: fadeIn 0.8s ease-out; }
        .section-title { text-align: center; color: #ff4b2b; margin-bottom: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .menu-card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; border: 1px solid #eee; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(255, 65, 108, 0.2); border-color: #ff416c; }
        .menu-card h3 { font-size: 18px; color: #333; }
        .menu-card p { font-size: 12px; color: #777; margin-bottom: 10px; }
        .menu-card .price { font-size: 20px; font-weight: 700; color: #ff416c; }
        .add-btn { background: #ff416c; color: white; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; width: 100%; margin-top: 10px; }
        .add-btn:hover { background: #28a745; }

        /* Cart Floating Button */
        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: #28a745; color: white; border: none; padding: 15px 20px; border-radius: 50px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4); animation: pulse 2s infinite; z-index: 1000; transition: 0.3s; display: none; }
        .floating-cart:hover { transform: scale(1.05); }

        /* Admin & Login Screens (Hidden by default) */
        .admin-view { display: none; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; margin: 50px auto; animation: fadeIn 0.5s; }
        .admin-view input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; outline: none; transition: 0.3s; }
        .admin-view input:focus { border-color: #ff416c; box-shadow: 0 0 8px rgba(255, 65, 108, 0.2); }
        .admin-view button { background: #ff416c; color: white; border: none; width: 100%; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .admin-view button:hover { background: #e0335a; }

        .dashboard { display: none; animation: fadeIn 0.5s; max-width: 900px; margin: 20px auto; padding: 0 20px;}
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .dash-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border-left: 5px solid #ff416c; }
        .dash-card h2 { color: #ff416c; font-size: 30px; }
        
        .table-wrap { background: white; padding: 20px; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f4f4f4; }
        .action-edit { color: #007bff; cursor: pointer; margin-right: 10px; }
        .action-delete { color: red; cursor: pointer; }

    </style>
</head>
<body>

    <!-- Navigation -->
    <div class="navbar">
        <h1 onclick="showCustomer()">Shri Shyam Fast Food</h1>
        <div class="nav-btns">
            <button onclick="showAdminLogin()">Admin Panel</button>
        </div>
    </div>

    <!-- 1. CUSTOMER MENU VIEW -->
    <div id="customer-page" class="container">
        <h2 class="section-title">Hamara Menu</h2>
        <div class="menu-grid" id="menu-container">
            <!-- Menu items will be loaded here by JavaScript -->
        </div>
    </div>

    <!-- Floating Cart Button for Customer -->
    <button class="floating-cart" id="cart-btn" onclick="checkout()">
        🛒 View Cart (<span id="cart-count">0</span>) - ₹<span id="cart-total">0</span>
    </button>

    <!-- 2. ADMIN LOGIN VIEW -->
    <div id="login-page" class="admin-view">
        <h2 style="text-align:center; color:#ff416c; margin-bottom: 20px;">Admin Login</h2>
        <input type="text" id="admin-id" placeholder="Admin ID">
        <input type="password" id="admin-pass" placeholder="Password">
        <button onclick="loginAdmin()">Login Securely</button>
        <p id="error-msg" style="color:red; font-size:12px; text-align:center; margin-top:10px; display:none;">Galat ID ya Password!</p>
    </div>

    <!-- 3. ADMIN DASHBOARD VIEW -->
    <div id="dashboard-page" class="dashboard">
        <h2 class="section-title">Dashboard Status</h2>
        <div class="dash-grid">
            <div class="dash-card">
                <p>Total Items</p>
                <h2 id="dash-total-items">0</h2>
            </div>
            <div class="dash-card">
                <p>Orders Today</p>
                <h2>0 (Demo)</h2>
            </div>
            <div class="dash-card" style="border-left-color: #28a745;">
                <p>Store Status</p>
                <h2 style="color: #28a745;">Open 🟢</h2>
            </div>
        </div>

        <div class="table-wrap">
            <h3 style="margin-bottom: 15px; color: #333;">Manage Menu & Stock</h3>
            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Price (₹)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-menu-table">
                    <!-- Admin table rows injected via JS -->
                </tbody>
            </table>
            <button onclick="alert('Demo: Naya Item add karne ka form yahan khulega!')" style="margin-top: 15px; background: #ff416c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">+ Add New Item</button>
        </div>
    </div>

    <!-- === JAVASCRIPT (C++ ki jagah Web Logic) === -->
    <script>
        // 1. Data Store (Mock Database)
        let menuItems = [
            { id: 1, name: "Special Aloo Tikki Burger", desc: "Crispy tikki with special sauce", price: 50 },
            { id: 2, name: "Chatpata Masala Noodles", desc: "Spicy desi style chowmein", price: 60 },
            { id: 3, name: "Baraf ka Gola (Kala Khatta)", desc: "Thanda thanda cool cool", price: 20 },
            { id: 4, name: "Cheese Grilled Sandwich", desc: "Loaded with cheese & veggies", price: 80 },
            { id: 5, name: "Pani Puri (10 Pcs)", desc: "Teekha aur meetha pani", price: 30 }
        ];

        let cart = [];

        // 2. Load Customer Menu
        function renderCustomerMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = "";
            menuItems.forEach(item => {
                container.innerHTML += `
                    <div class="menu-card">
                        <div>
                            <h3>${item.name}</h3>
                            <p>${item.desc}</p>
                            <div class="price">₹${item.price}</div>
                        </div>
                        <button class="add-btn" onclick="addToCart(${item.id}, '${item.name}', ${item.price})">
                            + Add to Cart
                        </button>
                    </div>
                `;
            });
        }

        // 3. Cart Functions
        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            updateCartUI();
            
            // Animation Trick
            const btn = document.getElementById('cart-btn');
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
        }

        function updateCartUI() {
            const count = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total;
            
            if(count > 0) document.getElementById('cart-btn').style.display = 'block';
        }

        // 4. WhatsApp Checkout Generation
        function checkout() {
            if(cart.length === 0) return;
            let orderText = "Hello Shri Shyam Fast Food!%0A%0A*Mera Order Hai:*%0A";
            let total = 0;
            
            cart.forEach((item, index) => {
                orderText += `${index + 1}. ${item.name} - ₹${item.price}%0A`;
                total += item.price;
            });
            
            orderText += `%0A*Total Bill:* ₹${total}%0A%0AKrpya is order ko confirm karein!`;
            
            // Apna WhatsApp Number yahan dalein (e.g., 919876543210)
            let whatsappUrl = `https://wa.me/910000000000?text=${orderText}`;
            window.open(whatsappUrl, '_blank');
            
            // Empty cart after order
            cart = [];
            updateCartUI();
            document.getElementById('cart-btn').style.display = 'none';
        }

        // 5. Admin Login System
        function showAdminLogin() {
            document.getElementById('customer-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'none';
            document.getElementById('cart-btn').style.display = 'none';
            document.getElementById('login-page').style.display = 'block';
        }

        function showCustomer() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'none';
            document.getElementById('customer-page').style.display = 'block';
            updateCartUI(); // Show cart if items exist
        }

        function loginAdmin() {
            let id = document.getElementById('admin-id').value;
            let pass = document.getElementById('admin-pass').value;

            if (id === "Shri Shyam Fast Food" && pass === "Jitu") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard-page').style.display = 'block';
                renderAdminDashboard();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // 6. Admin Dashboard Functions
        function renderAdminDashboard() {
            document.getElementById('dash-total-items').innerText = menuItems.length;
            const table = document.getElementById('admin-menu-table');
            table.innerHTML = "";
            
            menuItems.forEach(item => {
                table.innerHTML += `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>₹${item.price}</td>
                        <td>
                            <span class="action-edit" onclick="editItem(${item.id})">✏️ Edit</span>
                            <span class="action-delete" onclick="deleteItem(${item.id})">🗑️ Del</span>
                        </td>
                    </tr>
                `;
            });
        }

        function editItem(id) {
            let item = menuItems.find(i => i.id === id);
            let newPrice = prompt(`Naya price dalein for ${item.name}:`, item.price);
            if (newPrice && !isNaN(newPrice)) {
                item.price = parseInt(newPrice);
                renderAdminDashboard(); // Update Admin View
                renderCustomerMenu();   // Update Customer View
                alert("Price Update Ho Gaya!");
            }
        }

        function deleteItem(id) {
            if(confirm("Kya aap sach me is item ko delete karna chahte hain?")) {
                menuItems = menuItems.filter(i => i.id !== id);
                renderAdminDashboard();
                renderCustomerMenu();
            }
        }

        // Initialize App
        renderCustomerMenu();

    </script>
</body>
</html>
