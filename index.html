<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 140px; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,0,0,0.1); }
        .gradient-text { background: linear-gradient(90deg, #dc2626, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-press:active { transform: scale(0.95); transition: 0.2s; }
        .cart-sheet { transition: transform 0.4s; transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <!-- Closed Overlay -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md z-[2000] flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-4xl font-black text-gray-800">Shop Closed</h2>
        <p class="text-gray-500 font-bold mt-2">Kripya khulne ka intezaar karein.</p>
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-100 rounded-full text-xs font-black text-gray-500 uppercase tracking-widest border btn-press">Owner Login</button>
    </div>

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 object-cover">
            <div>
                <h1 class="font-black text-lg gradient-text uppercase tracking-tight">Shri Shyam Fast Food</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="shop-indicator" class="text-red-500 flex items-center gap-1.5 text-[10px] font-black uppercase">
                        <span class="status-dot bg-gray-400"></span> <span id="shop-text">Checking...</span>
                    </span>
                    <span class="text-[10px] font-bold text-gray-400">| MOULASAR | <i class="fa-solid fa-phone"></i> 80587 33741</span>
                </div>
            </div>
        </div>
        <div class="flex gap-2">
            <!-- Naya Track Button -->
            <button onclick="document.getElementById('track-modal').classList.remove('hidden')" class="px-3 h-10 rounded-full bg-red-50 border border-red-200 text-red-600 font-black text-[10px] flex items-center justify-center btn-press shadow-sm uppercase"><i class="fa-solid fa-location-crosshairs mr-1"></i> Track</button>
            <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 border text-gray-500 flex items-center justify-center btn-press"><i class="fa-solid fa-sliders"></i></button>
        </div>
    </header>

    <div class="max-w-2xl mx-auto px-4 py-6">
        
        <!-- Admin Dashboard -->
        <div id="admin-panel" class="hidden bg-gray-900 rounded-[2rem] shadow-2xl p-6 mb-8 text-white">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-yellow-400">Admin Dashboard</h2>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center btn-press"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-xl font-black mb-6 uppercase btn-press">Checking...</button>

            <div class="bg-white/5 p-4 rounded-2xl mb-6 border border-white/10">
                <p class="font-bold text-gray-300 text-xs mb-3 uppercase">Naya Item Add Karein</p>
                <div class="grid grid-cols-12 gap-2">
                    <input id="new-i" placeholder="Icon" class="col-span-3 p-3 bg-black/30 rounded-xl text-center text-xs">
                    <input id="new-n" placeholder="Item Name" class="col-span-9 p-3 bg-black/30 rounded-xl">
                    <input id="new-p" type="number" placeholder="Price (₹)" class="col-span-6 p-3 bg-black/30 rounded-xl">
                    <button onclick="addItem()" class="col-span-6 bg-red-600 text-white font-black rounded-xl btn-press">ADD +</button>
                </div>
                
                <p class="font-bold text-gray-300 text-[10px] mt-6 mb-2 uppercase tracking-widest">Manage Menu & Prices</p>
                <div id="admin-menu-list" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
            </div>

            <div class="mt-8 border-t border-white/10 pt-6">
                <h3 class="text-lg font-black mb-4 text-orange-400"><i class="fa-solid fa-receipt mr-2"></i> Live Orders</h3>
                <div id="admin-orders-list" class="space-y-4 max-h-96 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <h2 class="text-2xl font-black text-gray-800 mb-4 border-b-2 border-red-100 pb-2 border-dashed">Today's Menu</h2>
        <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Cart Bar -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300 translate-y-32">
        <div onclick="openCheckout()" class="bg-gradient-to-r from-green-600 to-emerald-500 p-4 rounded-2xl shadow-xl flex justify-between items-center text-white cursor-pointer btn-press">
            <div>
                <p id="float-items" class="text-xs font-bold uppercase">0 Items</p>
                <p id="float-total" class="text-lg font-black">₹0</p>
            </div>
            <div class="flex items-center gap-2 font-black text-sm">VIEW CART <i class="fa-solid fa-bag-shopping"></i></div>
        </div>
    </div>

    <!-- Checkout Sheet -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl mx-auto rounded-t-[2.5rem] shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-[2.5rem]">
                <h3 class="font-black text-2xl text-gray-800">Checkout</h3>
                <button onclick="closeCheckout()" class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center btn-press text-gray-500"><i class="fa-solid fa-arrow-down"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-5">
                <div class="bg-gray-50 p-4 rounded-2xl border">
                    <div id="cart-summary" class="space-y-2 mb-3"></div>
                    <div class="flex justify-between items-center border-t pt-3 font-black text-lg mt-4">
                        <span>Total Pay</span><span id="sheet-total" class="text-red-600">₹0</span>
                    </div>
                </div>
                <div class="space-y-3">
                    <input id="u-n" placeholder="Aapka Naam" class="w-full p-4 bg-gray-50 border rounded-xl font-bold">
                    <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 border rounded-xl font-bold">
                    <input id="u-a" placeholder="Address / Table No." class="w-full p-4 bg-gray-50 border rounded-xl font-bold">
                    <select id="u-t" class="w-full p-4 bg-gray-50 border rounded-xl font-bold">
                        <option>15 मिनट में</option><option>30 मिनट में</option><option>On The Shop</option>
                    </select>
                    <select id="u-pay" class="w-full p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl font-black">
                        <option value="PAID">QR Code (Online Pay)</option>
                        <option value="COD">Cash on Delivery (COD)</option>
                    </select>
                </div>
            </div>
            <div class="p-5 bg-white border-t">
                <button onclick="processPayment()" class="w-full bg-gradient-to-r from-red-600 to-orange-500 text-white font-black py-4 rounded-2xl shadow-xl btn-press">CONFIRM ORDER</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[3000] flex items-center justify-center p-6 text-center backdrop-blur-md">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full">
             <h3 class="font-black text-2xl mb-2 gradient-text">JAY SHREE SHYAM</h3>
             <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl border-4 mb-6">
             <button onclick="confirmOrderAndSave('PAID')" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-lg mb-3 btn-press">PAYMENT DONE</button>
             <button onclick="document.getElementById('qr-modal').classList.add('hidden');" class="text-gray-400 font-bold text-xs uppercase btn-press">CANCEL</button>
        </div>
    </div>

    <!-- Naya Track Order Modal -->
    <div id="track-modal" class="hidden fixed inset-0 bg-black/60 z-[3000] flex items-center justify-center p-6 text-center backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-6 max-w-sm w-full shadow-2xl relative">
             <button onclick="document.getElementById('track-modal').classList.add('hidden')" class="absolute top-4 right-4 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 btn-press"><i class="fa-solid fa-xmark"></i></button>
             <h3 class="font-black text-xl mb-4 text-gray-800 uppercase"><i class="fa-solid fa-route text-red-500 mr-2"></i> Track Order</h3>
             <input id="track-id-input" placeholder="Enter Tracking ID" class="w-full p-4 bg-gray-50 border rounded-xl font-bold text-center uppercase mb-3 outline-none">
             <button onclick="searchOrder()" class="w-full bg-gray-800 text-white font-black py-3 rounded-xl shadow-lg mb-2 btn-press">SEARCH ORDER</button>
             <div id="track-result" class="mt-2"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
          authDomain: "shri-shyam-fast-food.firebaseapp.com",
          databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
          projectId: "shri-shyam-fast-food",
          storageBucket: "shri-shyam-fast-food.firebasestorage.app",
          messagingSenderId: "828353855950",
          appId: "1:828353855950:web:96d62828e8e410e8812b9f",
          measurementId: "G-38J1Y2M8LD"
        };

        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        let cart = [];
        let isShopOpen = true;

        // Auto Generate 6 Digit Tracking ID
        function generateTrackingId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Force initialize if database is totally empty
        rdb.ref('shop_status').once('value', snap => {
            if (snap.val() === null) rdb.ref('shop_status').set(true);
        });

        // Shop Status Sync (Aapka original)
        rdb.ref('shop_status').on('value', snap => {
            isShopOpen = (snap.val() !== false);
            document.getElementById('closed-screen').style.display = isShopOpen ? 'none' : 'flex';
            document.getElementById('shop-indicator').innerHTML = `<span class="status-dot ${isShopOpen ? 'bg-green-500' : 'bg-red-500'}"></span> <span id="shop-text">${isShopOpen ? 'SHOP OPEN' : 'SHOP CLOSED'}</span>`;
            
            const btn = document.getElementById('toggle-shop-btn');
            btn.innerText = isShopOpen ? "🔴 TURN OFF SHOP" : "🟢 TURN ON SHOP";
            btn.className = isShopOpen ? "w-full py-4 rounded-xl font-black bg-red-600 text-white shadow-lg btn-press" : "w-full py-4 rounded-xl font-black bg-green-500 text-white shadow-lg btn-press";
        });

        // Menu Sync (Aapka original)
        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminBox = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminBox.innerHTML = '';
            
            const items = Object.keys(data).map(id => ({ id, ...data[id] }));
            items.sort((a, b) => (b.available !== false ? 1 : 0) - (a.available !== false ? 1 : 0));

            if(items.length === 0) box.innerHTML = '<p class="col-span-full text-center text-gray-400 py-10 font-bold">Menu khali hai.</p>';

            items.forEach(i => {
                const isAvail = i.available !== false;
                
                box.innerHTML += `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100 ${isAvail ? '' : 'opacity-60 grayscale'}">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-xl border">${i.icon || '🍽️'}</div>
                        <div><p class="font-black text-gray-800">${i.name}</p><p class="text-red-500 font-black text-sm">₹${i.price}</p></div>
                    </div>
                    ${isAvail ? `<button onclick="addToCart('${i.name.replace(/'/g, "")}', ${i.price})" class="border-2 border-red-100 text-red-500 px-5 py-2 rounded-xl text-xs font-black hover:bg-red-50 btn-press">ADD</button>` : `<span class="text-[10px] text-gray-400 font-black uppercase bg-gray-100 px-2 py-1 rounded">OUT</span>`}
                </div>`;
                
                adminBox.innerHTML += `
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-white truncate w-32">${i.name}</span>
                        <div class="flex gap-2">
                            <button onclick="rdb.ref('menu/${i.id}/available').set(${!isAvail})" class="px-2 py-1 text-[10px] rounded font-black ${isAvail ? 'bg-green-500' : 'bg-red-500'} text-white">${isAvail ? 'IN' : 'OUT'}</button>
                            <button onclick="if(confirm('Delete?')) rdb.ref('menu/${i.id}').remove()" class="text-red-400"><i class="fa fa-trash"></i></button>
                        </div>
                    </div>
                    <input type="number" value="${i.price}" onchange="rdb.ref('menu/${i.id}/price').set(parseInt(this.value))" class="w-full bg-black/40 border border-white/10 rounded px-2 py-1 text-xs text-yellow-400 font-black outline-none">
                </div>`;
            });
        });

        // Orders Sync (Naye Status options ke sath)
        rdb.ref('orders').on('value', snap => {
            const orders = snap.val() || {};
            const orderList = document.getElementById('admin-orders-list');
            orderList.innerHTML = '';
            const keys = Object.keys(orders).reverse();

            if(keys.length === 0) orderList.innerHTML = '<p class="text-gray-500 text-center text-sm font-bold">No orders.</p>';

            const statusOptions = ['Pending', 'Order Accepted', 'Cooking', 'Packing', 'Ready', 'Cancel', 'Refund Requested', 'Refund Successfully'];

            keys.forEach(id => {
                const o = orders[id];
                const time = new Date(o.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                let optionsHtml = `<option value="">Status Update</option>`;
                statusOptions.forEach(s => {
                    optionsHtml += `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`;
                });
                
                orderList.innerHTML += `
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-sm mb-4">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="font-black text-orange-400 text-base">${o.customerName}</p>
                            <p class="text-[10px] text-gray-400 font-bold">${time} | ${o.payType} | ID: <span class="text-white">${o.trackingId || 'N/A'}</span></p>
                        </div>
                        <span class="font-black text-xs bg-white/10 px-2 py-1 rounded text-white">${o.status}</span>
                    </div>
                    <div class="text-gray-300 text-xs mb-3 bg-black/30 p-2 rounded-lg">${o.items.replace(/%0A/g, '<br>')}</div>
                    <div class="flex gap-2">
                        <select onchange="updateOrderStatus('${id}', this.value, '${o.customerPhone}', '${o.customerName}', '${o.total}', '${o.trackingId}')" class="flex-1 bg-gray-800 text-white p-2 rounded-lg text-xs font-bold outline-none border border-gray-700">
                            ${optionsHtml}
                        </select>
                        <button onclick="window.location.href='https://wa.me/91${o.customerPhone}'" class="bg-green-600 px-3 rounded-lg text-white"><i class="fa-brands fa-whatsapp"></i></button>
                    </div>
                </div>`;
            });
        });

        // Aapke original functions
        function loginAdmin() { if(prompt("PIN:") === "8087jitu") { document.getElementById('admin-panel').classList.remove('hidden'); window.scrollTo(0,0); } }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        function addItem() {
            const n = document.getElementById('new-n').value, p = document.getElementById('new-p').value, i = document.getElementById('new-i').value || "🍔";
            if(n && p) { rdb.ref('menu').push({name:n, price:parseInt(p), icon:i, available:true}); document.getElementById('new-n').value=''; document.getElementById('new-p').value=''; }
        }
        function addToCart(n, p) { cart.push({name:n, price:p}); updateCartUI(); }
        function updateCartUI() {
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            const floatBar = document.getElementById('floating-cart');
            if(cart.length > 0) floatBar.classList.remove('translate-y-32'); else floatBar.classList.add('translate-y-32');
            document.getElementById('float-items').innerText = `${cart.length} ITEMS`;
            document.getElementById('float-total').innerText = `₹${total}`;
            document.getElementById('cart-summary').innerHTML = cart.map((i, idx) => `<div class="flex justify-between text-sm font-bold text-gray-700"><span>${i.name}</span><span>₹${i.price} <i onclick="cart.splice(${idx},1); updateCartUI();" class="fa-solid fa-circle-minus text-red-400 ml-2 cursor-pointer"></i></span></div>`).join('');
            document.getElementById('sheet-total').innerText = `₹${total}`;
        }
        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }
        function processPayment() {
            if(!document.getElementById('u-n').value
