<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Fixed Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .admin-screen { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 9999; overflow-y: auto; color: white; padding: 20px; }
        .admin-screen.active { display: block; }
        .btn-press:active { transform: scale(0.9); }
        .cart-sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; flex-direction: column; justify-content: end; }
        .cart-sheet.active { display: flex; }
    </style>
</head>
<body class="pb-24">

    <!-- Emergency Admin Trigger (Niche Chota sa Button) -->
    <div onclick="loginAdmin()" class="fixed bottom-4 left-4 w-8 h-8 bg-gray-200 rounded-full z-[50] flex items-center justify-center opacity-20 hover:opacity-100 transition-all cursor-pointer">
        <i class="fa-solid fa-key text-[10px]"></i>
    </div>

    <!-- Header -->
    <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-[100]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center text-white font-black">S</div>
            <div>
                <h1 class="font-black text-gray-800 uppercase">Shri Shyam</h1>
                <p id="status-text" class="text-[9px] font-bold text-gray-400">Connecting...</p>
            </div>
        </div>
        <!-- Admin Toggle Button -->
        <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 btn-press">
            <i class="fa-solid fa-user-gear"></i>
        </button>
    </header>

    <!-- Main Content -->
    <div class="p-4 max-w-2xl mx-auto">
        <div id="menu-container" class="grid gap-3">
            <p class="text-center py-10 text-gray-400">Loading Menu...</p>
        </div>
    </div>

    <!-- Admin Panel (Iska Display JS se control hota hai) -->
    <div id="admin-panel" class="admin-screen">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-orange-500">ADMIN CONTROL</h2>
            <button onclick="closeAdmin()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
        </div>

        <!-- Shop Toggle -->
        <div class="bg-white/5 p-4 rounded-2xl mb-6">
            <button id="shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-xl font-black uppercase bg-gray-700">Syncing...</button>
        </div>

        <!-- Add Item -->
        <div class="bg-white/5 p-4 rounded-2xl mb-6 border border-white/10">
            <h3 class="text-sm font-bold mb-3 uppercase text-gray-400">Naya Item Dalein</h3>
            <div class="grid grid-cols-1 gap-2">
                <input id="item-name" type="text" placeholder="Item Name" class="bg-black/50 p-3 rounded-xl outline-none">
                <div class="flex gap-2">
                    <input id="item-price" type="number" placeholder="Price" class="bg-black/50 p-3 rounded-xl w-1/2">
                    <input id="item-icon" type="text" placeholder="Icon (🍔)" class="bg-black/50 p-3 rounded-xl w-1/2 text-center">
                </div>
                <button onclick="addNewItem()" class="bg-orange-600 py-3 rounded-xl font-black uppercase mt-2">Add to Menu</button>
            </div>
        </div>

        <h3 class="font-black mb-4 text-gray-400 uppercase">Live Orders</h3>
        <div id="admin-orders" class="space-y-3"></div>
    </div>

    <!-- JavaScript -->
    <script>
        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };

        // Initialize
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Admin Logic (FORCE OPEN)
        function loginAdmin() {
            let pin = prompt("Enter Admin PIN:");
            if(pin === "8087jitu") {
                document.getElementById('admin-panel').classList.add('active');
            } else {
                alert("Galat PIN!");
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').classList.remove('active');
        }

        // 2. Add Item Logic
        function addNewItem() {
            const name = document.getElementById('item-name').value;
            const price = document.getElementById('item-price').value;
            const icon = document.getElementById('item-icon').value || '🍔';

            if(name && price) {
                db.ref('menu').push({
                    name: name,
                    price: parseInt(price),
                    icon: icon,
                    available: true,
                    category: 'Fast Food'
                }).then(() => {
                    alert("Item Add Ho Gaya!");
                    document.getElementById('item-name').value = '';
                    document.getElementById('item-price').value = '';
                });
            } else {
                alert("Naam aur Price bharein!");
            }
        }

        // 3. Shop Status
        let isShopOpen = true;
        db.ref('shop_status').on('value', snap => {
            isShopOpen = snap.val() !== false;
            const btn = document.getElementById('shop-btn');
            btn.innerText = isShopOpen ? "🔴 Band Karein" : "🟢 Chalu Karein";
            btn.style.background = isShopOpen ? "#dc2626" : "#16a34a";
            document.getElementById('status-text').innerText = isShopOpen ? "OPEN NOW" : "CLOSED";
        });

        function toggleShop() {
            db.ref('shop_status').set(!isShopOpen);
        }

        // 4. Menu Sync
        db.ref('menu').on('value', snap => {
            const data = snap.val();
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            if(!data) {
                container.innerHTML = '<p class="text-center text-gray-400">Menu khali h. Admin se add karein.</p>';
                return;
            }

            Object.keys(data).forEach(id => {
                const item = data[id];
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100">
                        <div class="flex items-center gap-4">
                            <span class="text-2xl">${item.icon}</span>
                            <div>
                                <h3 class="font-black text-gray-800">${item.name}</h3>
                                <p class="text-red-500 font-black">₹${item.price}</p>
                            </div>
                        </div>
                        <button class="bg-red-50 text-red-500 px-4 py-2 rounded-xl font-bold text-xs">ADD</button>
                    </div>
                `;
            });
        });

        // Test Connection
        db.ref('.info/connected').on('value', s => {
            if(s.val() === true) console.log("Database Connected!");
        });
    </script>
</body>
</html>
