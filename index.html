<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); }
        .admin-card { background: #fff; border-left: 5px solid #ef4444; }
    </style>
</head>
<body class="pb-20">

    <!-- HEADER -->
    <header class="bg-red-600 text-white p-6 rounded-b-[2rem] shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-black italic">SHRI SHYAM FAST FOOD</h1>
        <p class="text-xs opacity-80">Moulasar | <i class="fa-solid fa-phone"></i> 8058733741</p>
    </header>

    <div class="max-w-md mx-auto p-4">
        <!-- ADMIN DASHBOARD (Will appear on login) -->
        <div id="admin-panel" class="hidden space-y-4 mb-6">
            <h2 class="text-lg font-black text-gray-700">📦 Live Orders</h2>
            <div id="live-orders" class="space-y-3">
                <!-- Orders will appear here -->
            </div>
            <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-full bg-gray-200 py-2 rounded-lg font-bold text-xs">HIDE ADMIN</button>
        </div>

        <!-- MENU -->
        <div id="menu-list" class="space-y-4"></div>
    </div>

    <!-- ORDER FORM (Floating) -->
    <div id="order-ui" class="hidden fixed bottom-0 w-full max-w-md bg-white p-6 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
        <h2 class="font-black text-lg mb-4">Checkout Order</h2>
        <input id="c-name" class="w-full p-3 bg-gray-100 rounded-xl mb-2" placeholder="Naam">
        <input id="c-phone" class="w-full p-3 bg-gray-100 rounded-xl mb-2" placeholder="Phone Number">
        <input id="c-address" class="w-full p-3 bg-gray-100 rounded-xl mb-2" placeholder="Pura Address">
        <select id="c-time" class="w-full p-3 bg-gray-100 rounded-xl mb-4">
            <option>15 Minute mein</option>
            <option>30 Minute mein</option>
            <option>1 Ghante mein</option>
        </select>
        <button onclick="sendOrder()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl">PLACE ORDER NOW</button>
    </div>

    <script>
        const firebaseConfig = { /* ... wahi purana config ... */ };
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        // 1. Order Process
        function sendOrder() {
            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const addr = document.getElementById('c-address').value;
            const time = document.getElementById('c-time').value;
            
            // Firebase mein order save karo taaki Admin Panel mein dikhe
            const orderData = { name, phone, addr, time, items: "Sandwich, Bhel", total: 120, status: "Pending" };
            rdb.ref('orders').push(orderData);
            
            // WhatsApp Link
            const msg = `*🍔 NAYA PAID ORDER (MOULASAR)*%0A%0A*Grahak:* ${name}%0A*Phone:* ${phone}%0A*Address:* ${addr}%0A*Time:* ${time}%0A%0A*Items:*%0A- Sandwich%0A- Bhel%0A%0A*Total Bill: ₹120*%0A%0A_(Payment Done)_`;
            window.location.href = `https://wa.me/918058733741?text=${msg}`;
        }

        // 2. Admin Live Orders
        rdb.ref('orders').on('value', (snap) => {
            const orderBox = document.getElementById('live-orders');
            orderBox.innerHTML = '';
            snap.forEach(child => {
                const o = child.val();
                orderBox.innerHTML += `
                    <div class="admin-card p-4 rounded-xl shadow">
                        <p class="font-black">${o.name} - ${o.phone}</p>
                        <p class="text-xs text-gray-500">${o.addr} (${o.time})</p>
                        <button onclick="rdb.ref('orders/${child.key}').remove()" class="text-[10px] text-red-600 mt-2 font-bold underline">DELETE ORDER</button>
                    </div>`;
            });
        });

        // Admin Access
        function checkAdmin() { if(prompt("PIN:") === "jitu8087") document.getElementById('admin-panel').classList.remove('hidden'); }
    </script>
</body>
</html>
