<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Pickup App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 140px; overflow-x: hidden; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,0,0,0.1); }
        .gradient-text { background: linear-gradient(90deg, #dc2626, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cart-sheet { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

<!-- Loader -->
<div id="loader" class="fixed inset-0 bg-white z-[5000] flex items-center justify-center">
    <div class="text-center">
        <div class="w-16 h-16 border-4 border-red-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="font-black text-red-500">Loading Menu...</p>
    </div>
</div>

<!-- Shop Closed Screen -->
<div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md z-[2000] flex flex-col items-center justify-center text-center p-6">
    <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
    <h2 class="text-4xl font-black text-gray-800">Shop Closed</h2>
    <p class="text-gray-500 font-bold mt-2">Kripya baad me aayein</p>
    <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-100 rounded-full text-xs font-black uppercase border">Owner Login</button>
</div>

<!-- Header -->
<header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
        <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 object-cover">
        <div>
            <h1 class="font-black text-lg gradient-text uppercase tracking-tight">Shri Shyam Fast Food</h1>
            <div class="flex items-center gap-2 mt-1">
                <span id="shop-indicator" class="text-[10px] font-black uppercase flex items-center gap-1">
                    <span class="status-dot bg-gray-400"></span>
                    <span id="status-text">Checking...</span>
                </span>
                <span class="text-[10px] text-gray-400 font-bold">| MOULASAR</span>
            </div>
        </div>
    </div>
    <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 border flex items-center justify-center text-gray-500">
        <i class="fa-solid fa-sliders"></i>
    </button>
</header>

<main class="max-w-2xl mx-auto px-4 py-6">
    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden bg-gray-900 rounded-[2rem] shadow-2xl p-6 mb-8 text-white">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-yellow-400">Admin Dashboard</h2>
            <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white/10 p-3 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase">Orders</p>
                <h3 id="total-orders" class="text-xl font-black">0</h3>
            </div>
            <div class="bg-white/10 p-3 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase">Revenue</p>
                <h3 id="total-sales" class="text-xl font-black">₹0</h3>
            </div>
            <div class="bg-white/10 p-3 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 uppercase">Pending</p>
                <h3 id="pending-orders" class="text-xl font-black">0</h3>
            </div>
        </div>

        <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-3 rounded-xl font-black mb-6 uppercase transition-colors"></button>

        <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
            <p class="font-bold text-gray-300 text-xs mb-3 uppercase">Add New Item</p>
            <div class="grid grid-cols-12 gap-2">
                <input id="new-i" placeholder="🍔" class="col-span-3 p-3 bg-black/30 rounded-xl text-center">
                <input id="new-n" placeholder="Item Name" class="col-span-9 p-3 bg-black/30 rounded-xl">
                <input id="new-p" type="number" placeholder="Price" class="col-span-6 p-3 bg-black/30 rounded-xl">
                <button onclick="addItem()" class="col-span-6 bg-red-600 text-white font-black rounded-xl">ADD +</button>
            </div>
            <div id="admin-menu-list" class="space-y-3 mt-6 max-h-60 overflow-y-auto"></div>
        </div>

        <div class="mt-8 border-t border-white/10 pt-6">
            <h3 class="text-lg font-black mb-4 text-orange-400"><i class="fa-solid fa-receipt mr-2"></i>Live Orders</h3>
            <div id="admin-orders-list" class="space-y-4"></div>
        </div>
    </div>

    <!-- Search & Menu -->
    <input id="searchBox" onkeyup="filterMenu()" placeholder="Search food..." class="w-full p-4 rounded-2xl border mb-5 font-bold outline-none shadow-sm focus:border-red-400 transition-all">
    
    <h2 class="text-2xl font-black text-gray-800 mb-4 border-b-2 border-red-100 pb-2 border-dashed">Today's Menu</h2>
    <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
</main>

<!-- Floating Cart -->
<div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300 translate-y-32">
    <div onclick="openCheckout()" class="bg-gradient-to-r from-green-600 to-emerald-500 p-4 rounded-2xl shadow-xl flex justify-between items-center text-white cursor-pointer active:scale-95 transition-transform">
        <div>
            <p id="float-items" class="text-xs font-bold uppercase">0 Items</p>
            <p id="float-total" class="text-lg font-black">₹0</p>
        </div>
        <div class="flex items-center gap-2 font-black text-sm">VIEW CART <i class="fa-solid fa-bag-shopping"></i></div>
    </div>
</div>

<!-- Checkout Sheet -->
<div id="checkout-sheet" class="cart-sheet fixed inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-sm">
    <div class="bg-white w-full max-w-2xl mx-auto rounded-t-[2.5rem] shadow-2xl flex flex-col max-h-[90vh]">
        <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-[2.5rem]">
            <h3 class="font-black text-2xl text-gray-800">Checkout</h3>
            <button onclick="closeCheckout()" class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center text-gray-500"><i class="fa-solid fa-arrow-down"></i></button>
        </div>
        <div class="p-6 overflow-y-auto space-y-5">
            <div class="bg-gray-50 p-4 rounded-2xl border">
                <div id="cart-summary" class="space-y-2 mb-3"></div>
                <div class="flex justify-between items-center border-t pt-3 font-black text-lg mt-4">
                    <span>Total Pay</span>
                    <span id="sheet-total" class="text-red-600">₹0</span>
                </div>
            </div>
            <div class="space-y-3">
                <input id="u-n" placeholder="Your Name" class="w-full p-4 bg-gray-50 border rounded-xl font-bold outline-none">
                <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 border rounded-xl font-bold outline-none">
                <input id="u-a" placeholder="Pickup Note (Optional)" class="w-full p-4 bg-gray-50 border rounded-xl font-bold outline-none">
                <select id="u-t" class="w-full p-4 bg-gray-50 border rounded-xl font-bold outline-none">
                    <option>15 मिनट में</option>
                    <option>30 मिनट में</option>
                    <option>On The Shop</option>
                </select>
                <select id="u-pay" class="w-full p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl font-black outline-none">
                    <option value="PAID">QR Code (Online Pay)</option>
                    <option value="CASH">Cash on Pickup</option>
                </select>
            </div>
        </div>
        <div class="p-5 bg-white border-t">
            <button onclick="processPayment()" class="w-full bg-gradient-to-r from-red-600 to-orange-500 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-transform">CONFIRM ORDER</button>
        </div>
    </div>
</div>

<!-- QR Modal -->
<div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[3000] flex items-center justify-center p-6 text-center backdrop-blur-md">
    <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full">
        <h3 class="font-black text-2xl mb-2 gradient-text">JAY SHREE SHYAM</h3>
        <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl border-4 mb-6">
        <button onclick="confirmOrderAndSave('PAID')" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-lg mb-3">PAYMENT DONE</button>
        <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="text-gray-400 font-bold text-xs uppercase underline">CANCEL</button>
    </div>
</div>

<audio id="orderSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=notification-2-269292.mp3"></audio>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
    apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
    authDomain: "shri-shyam-fast-food.firebaseapp.com",
    databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
    projectId: "shri-shyam-fast-food",
    storageBucket: "shri-shyam-fast-food.firebasestorage.app",
    messagingSenderId: "828353855950",
    appId: "1:828353855950:web:96d62828e8e410e8812b9f"
};

firebase.initializeApp(firebaseConfig);
const rdb = firebase.database();
let cart = [];
let isShopOpen = true;

// Shop Status Listener
rdb.ref('shop_status').on('value', snap => {
    isShopOpen = snap.val() !== false;
    document.getElementById('closed-screen').style.display = isShopOpen ? 'none' : 'flex';
    document.getElementById('shop-indicator').innerHTML = `
        <span class="status-dot ${isShopOpen ? 'bg-green-500' : 'bg-red-500'}"></span>
        <span>${isShopOpen ? 'SHOP OPEN' : 'SHOP CLOSED'}</span>
    `;
    const btn = document.getElementById('toggle-shop-btn');
    btn.innerText = isShopOpen ? 'TURN OFF SHOP' : 'TURN ON SHOP';
    btn.className = `w-full py-4 rounded-xl font-black mb-6 uppercase ${isShopOpen ? 'bg-red-600' : 'bg-green-600'} text-white`;
});

// Menu Listener
rdb.ref('menu').on('value', snap => {
    document.getElementById('loader').style.display = 'none';
    const data = snap.val() || {};
    const box = document.getElementById('menu-box');
    const adminBox = document.getElementById('admin-menu-list');
    box.innerHTML = ''; adminBox.innerHTML = '';

    Object.keys(data).forEach(id => {
        const i = data[id];
        const isAvail = i.available !== false;
        
        // User View
        box.innerHTML += `
            <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100 ${isAvail ? '' : 'opacity-60 grayscale'}">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-xl border">${i.icon || '🍔'}</div>
                    <div>
                        <p class="font-black text-gray-800">${i.name}</p>
                        <p class="text-red-500 font-black text-sm">₹${i.price}</p>
                    </div>
                </div>
                ${isAvail ? `<button onclick="addToCart('${i.name}', ${i.price})" class="bg-red-50 text-red-600 border border-red-100 px-5 py-2 rounded-xl text-xs font-black active:scale-90 transition-transform">ADD</button>` : '<span class="text-[10px] text-gray-400 font-black uppercase bg-gray-100 px-2 py-1 rounded">OUT</span>'}
            </div>`;

        // Admin View
        adminBox.innerHTML += `
            <div class="bg-white/5 p-3 rounded-xl border border-white/10 flex justify-between items-center">
                <span class="text-xs font-bold truncate w-24">${i.name}</span>
                <div class="flex gap-2">
                    <button onclick="rdb.ref('menu/${id}/available').set(${!isAvail})" class="px-2 py-1 text-[10px] rounded font-black ${isAvail ? 'bg-green-500' : 'bg-red-500'} text-white">${isAvail ? 'IN' : 'OUT'}</button>
                    <button onclick="if(confirm('Delete?')) rdb.ref('menu/${id}').remove()" class="text-red-400 px-2"><i class="fa fa-trash"></i></button>
                </div>
            </div>`;
    });
});

// Orders Listener
rdb.ref('orders').on('value', snap => {
    const orders = snap.val() || {};
    let totalRevenue = 0, pendingCount = 0;
    const orderList = document.getElementById('admin-orders-list');
    orderList.innerHTML = '';

    Object.keys(orders).reverse().forEach(id => {
        const o = orders[id];
        totalRevenue += (o.status !== 'Cancelled' ? o.total : 0);
        if(o.status === 'Pending') pendingCount++;

        orderList.innerHTML += `
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-sm mb-4">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <p class="font-black text-yellow-400 text-xs">#${o.token}</p>
                        <p class="font-black text-orange-400 text-base">${o.customerName}</p>
                        <p class="text-[10px] text-gray-400">${o.payType} | ${o.pickupTime}</p>
                    </div>
                    <span class="font-black ${o.status === 'Pending' ? 'text-yellow-400' : 'text-green-400'}">${o.status}</span>
                </div>
                <div class="text-gray-300 text-xs mb-3 bg-black/20 p-2 rounded-lg">${o.items.replace(/%0A/g,'<br>')}</div>
                <div class="flex gap-2">
                    <select onchange="updateOrderStatus('${id}', this.value)" class="flex-1 bg-gray-800 text-white p-2 rounded-lg text-xs outline-none">
                        <option value="">Update Status</option>
                        <option value="Preparing">Preparing</option>
                        <option value="Ready">Ready</option>
                        <option value="Completed">Done</option>
                        <option value="Cancelled">Cancel</option>
                    </select>
                    <button onclick="window.location.href='https://wa.me/91${o.customerPhone}'" class="bg-green-600 px-3 rounded-lg"><i class="fa-brands fa-whatsapp"></i></button>
                </div>
            </div>`;
    });
    document.getElementById('total-orders').innerText = Object.keys(orders).length;
    document.getElementById('total-sales').innerText = `₹${totalRevenue}`;
    document.getElementById('pending-orders').innerText = pendingCount;
});

// Logic Functions
function addToCart(n, p) {
    cart.push({name: n, price: p});
    updateCartUI();
}

function updateCartUI() {
    let total = cart.reduce((sum, i) => sum + i.price, 0);
    const floatBar = document.getElementById('floating-cart');
    floatBar.classList.toggle('translate-y-32', cart.length === 0);
    
    document.getElementById('float-items').innerText = `${cart.length} ITEMS`;
    document.getElementById('float-total').innerText = `₹${total}`;
    document.getElementById('sheet-total').innerText = `₹${total}`;
    document.getElementById('cart-summary').innerHTML = cart.map((i, idx) => `
        <div class="flex justify-between text-sm font-bold text-gray-700">
            <span>${i.name}</span>
            <span>₹${i.price} <i onclick="removeFromCart(${idx})" class="fa-solid fa-circle-minus text-red-400 ml-2 cursor-pointer"></i></span>
        </div>
    `).join('');
}

function removeFromCart(idx) {
    cart.splice(idx, 1);
    updateCartUI();
}

function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }

function processPayment() {
    const name = document.getElementById('u-n').value;
    const phone = document.getElementById('u-p').value;
    if(!name || phone.length < 10) return alert('Kripya Name aur Sahi Phone Number bhariye!');
    
    if(document.getElementById('u-pay').value === 'PAID') {
        document.getElementById('qr-modal').classList.remove('hidden');
    } else {
        confirmOrderAndSave('CASH');
    }
}

function confirmOrderAndSave(type) {
    const name = document.getElementById('u-n').value;
    const phone = document.getElementById('u-p').value;
    const note = document.getElementById('u-a').value;
    const time = document.getElementById('u-t').value;
    const token = Math.floor(1000 + Math.random() * 9000);
    const total = cart.reduce((sum, i) => sum + i.price, 0);
    const itemsMsg = cart.map(i => `▫️ ${i.name} - ₹${i.price}`).join('%0A');

    const orderData = {
        token, customerName: name, customerPhone: phone, pickupNote: note,
        pickupTime: time, items: itemsMsg, total, payType: type,
        status: 'Pending', timestamp: Date.now()
    };

    rdb.ref('orders').push(orderData).then(() => {
        const msg = `*NEW ORDER (${type})*%0A*Token:* ${token}%0A*Name:* ${name}%0A*Time:* ${time}%0A*Items:*%0A${itemsMsg}%0A*Total:* ₹${total}`;
        window.location.href = `https://wa.me/918058733741?text=${msg}`;
        cart = []; updateCartUI(); closeCheckout();
        document.getElementById('qr-modal').classList.add('hidden');
    });
}

function updateOrderStatus(id, status) {
    if(status) rdb.ref(`orders/${id}/status`).set(status);
}

function loginAdmin() {
    if(prompt('PIN:') === '8087jitu') document.getElementById('admin-panel').classList.remove('hidden');
}

function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }

function addItem() {
    const n = document.getElementById('new-n').value;
    const p = document.getElementById('new-p').value;
    const i = document.getElementById('new-i').value || '🍔';
    if(n && p) {
        rdb.ref('menu').push({ name: n, price: parseInt(p), icon: i, available: true });
        document.getElementById('new-n').value = ''; document.getElementById('new-p').value = '';
    }
}

function filterMenu() {
    const val = document.getElementById('searchBox').value.toLowerCase();
    document.querySelectorAll('#menu-box > div').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
    });
}
</script>
</body>
</html>
