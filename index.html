<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <h1 class="text-2xl font-black text-red-600">Shri Shyam Fast Food</h1>
    <div id="status-box" class="mt-4 p-4 bg-white rounded-xl font-bold">Initializing...</div>
    <div id="menu-box" class="mt-4"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
          authDomain: "shri-shyam-fast-food.firebaseapp.com",
          databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
          projectId: "shri-shyam-fast-food",
          storageBucket: "shri-shyam-fast-food.firebasestorage.app",
          messagingSenderId: "828353855950",
          appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        // Direct bypass: Screen par kuch bhi dikhao, logic chalne do
        rdb.ref('shop_status').on('value', snap => {
            document.getElementById('status-box').innerText = "Shop is " + (snap.val() ? "OPEN" : "CLOSED");
        });

        rdb.ref('menu').on('value', snap => {
            document.getElementById('menu-box').innerHTML = "Menu Loaded: " + Object.keys(snap.val() || {}).length + " items";
        });
    </script>
</body>
</html>
