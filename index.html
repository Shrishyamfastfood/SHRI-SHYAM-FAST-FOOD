<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food Moulasar - Order Online</title>
    <meta name="google-site-verification" content="LpUYJVosMIE5qw2zFybFtpN3uhG7VjtGH5bLDA3asaU" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; padding-bottom: 100px; }
        .gradient-nav { background: linear-gradient(90deg, #cc0000 0%, #ff5722 100%); }
        .logo-img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid white; object-fit: cover; }
        .admin-panel { display: none; background: white; border-top: 5px solid #cc0000; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .payment-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- Payment Modal (QR Code) -->
    <div id="payment-modal" class="payment-modal">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl">
            <h3 class="text-xl font-black text-gray-800 mb-1">Scan & Pay</h3>
            <p class="text-[10px] text-gray-400 font-bold uppercase mb-4 tracking-widest">Shri Shyam Fast Food Moulasar</p>
            
            <!-- Aapka UPI QR Code -->
            <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" alt="UPI QR" class="w-full rounded-2xl mb-4 border-4 border-gray-50 shadow-inner">
            
            <p class="text-xs text-orange-600 font-bold mb-4 italic">Payment karke "DONE" dabayein aur WhatsApp par screenshot bhejien</p>
            
            <div class="flex flex-col gap-2">
                <button onclick="finalSubmit()" class="bg-green-600 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition">DONE: SEND ON WHATSAPP</button>
                <button onclick="closePayment()" class="text-gray-400 text-xs font-bold uppercase py-2">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="gradient-nav text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" alt="Logo" class="logo-img shadow-lg">
                <div>
                    <h1 class="text-lg font-black leading-none">Shri Shyam Fast Food</h1>
                    <p class="text-[10px] font-bold mt-1 text-white/80 uppercase tracking-tighter italic">Moulasar | 8058733741</p>
                </div>
            </div>
            <button onclick="showLogin()" class="text-white/30 hover:text-white"><i class="fa-solid fa-lock"></i></button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- ADMIN PANEL (Same as before) -->
        <div id="admin-section" class="admin-panel p-6 mb-10">
            <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-black text-red-600">ADMIN PANEL</h2><button onclick="logout()" class="text-gray-400 text-xs">LOGOUT</button></div>
            <div id="admin-controls" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div class="flex flex-col md:flex-row gap-8">
            <!-- Menu Section -->
            <div class="w-full md:w-2/3">
                <h2 class="text-2xl font-black mb-6 italic text-gray-800">Fresh Menu</h2>
                <div id="menu-container" class="grid grid-cols-1 gap-4"></div>
            </div>

            <!-- Cart Section -->
            <div class="w-full md:w-1/3">
                <div class="bg-white rounded-3xl shadow-xl p-6 sticky top-24 border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 flex justify-between items-center">Your Cart <span id="cart-count" class="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs font-black">0</span></h2>
                    <div id="cart-items" class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-2"></div>
                    <div class="border-t pt-4 mb-6 flex justify-between items-center text-2xl font-black"><span>Total</span><span id="total" class="text-red-600">₹0</span></div>
                    
                    <div id="checkout-form" class="hidden space-y-4">
                        <input type="text" id="cust-name" class="w-full border rounded-xl p-3 outline-none focus:border-red-500 bg-gray-50" placeholder="Aapka Naam">
                        <input type="tel" id="cust-phone" class="w-full border rounded-xl p-3 outline-none focus:border-red-500 bg-gray-50" placeholder="Mobile Number">
                        <select id="pickup-time" class="w-full border rounded-xl p-3 bg-gray-100 font-bold text-gray-700">
                            <option value="15 Minutes">15 Min mein aaunga</option>
                            <option value="30 Minutes">30 Min mein aaunga</option>
                            <option value="Just reached">Dukaan par hu</option>
                        </select>
                        <button onclick="openPayment()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-lg">PROCEED TO PAY & ORDER</button>
                    </div>
                    <p id="min-warning" class="text-orange-600 text-center font-bold text-xs mt-2 bg-orange-50 p-2 rounded-lg">Min. ₹100 required</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = [];

        function syncMenu() {
            db.collection("menu").onSnapshot(snapshot => {
                const container = document.getElementById('menu-container');
                const adminBox = document.getElementById('admin-controls');
                container.innerHTML = ''; adminBox.innerHTML = '';
                snapshot.forEach(doc => {
                    const item = doc.data(); const id = doc.id;
                    container.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm ${!item.available ? 'opacity-40 pointer-events-none' : ''}"><div class="flex items-center gap-4"><span class="text-3xl">${item.icon}</span><div><p class="font-bold text-gray-800">${item.name}</p><p class="text-red-600 font-black">₹${item.price}</p></div></div><button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-50 text-red-600 font-bold px-6 py-2 rounded-xl">ADD</button></div>`;
                    adminBox.innerHTML += `<div class="bg-gray-50 p-3 rounded-xl border"><p class="text-[10px] font-bold text-gray-400 uppercase">${item.name}</p><div class="flex gap-2 mt-1"><input type="number" value="${item.price}" onchange="db.collection('menu').doc('${id}').update({price: parseInt(this.value)})" class="w-20 p-1 border rounded text-xs font-bold"><button onclick="db.collection('menu').doc('${id}').update({available: ${!item.available}})" class="flex-1 py-1 rounded text-[10px] font-black ${item.available ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}">${item.available ? 'ON' : 'OFF'}</button></div></div>`;
                });
            });
        }

        function addToCart(name, price) { cart.push({name, price}); updateCartUI(); }
        function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }

        function updateCartUI() {
            const list = document.getElementById('cart-items');
            let subtotal = cart.reduce((acc, item) => acc + item.price, 0);
            list.innerHTML = cart.length === 0 ? '<p class="text-gray-400 text-center py-4 italic">Empty...</p>' : cart.map((item, index) => `<div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg text-xs"><p class="font-bold">${item.name} - ₹${item.price}</p><button onclick="removeFromCart(${index})" class="text-red-300"><i class="fa-solid fa-circle-xmark"></i></button></div>`).join('');
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('total').innerText = `₹${subtotal}`;
            const isMin = subtotal >= 100;
            document.getElementById('checkout-form').classList.toggle('hidden', !isMin);
            document.getElementById('min-warning').classList.toggle('hidden', isMin || subtotal === 0);
        }

        function openPayment() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            if(!name || !phone) return alert("Details bharo bhai!");
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closePayment() { document.getElementById('payment-modal').style.display = 'none'; }

        function finalSubmit() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const time = document.getElementById('pickup-time').value;
            let itemsTxt = "";
            let subtotal = cart.reduce((acc, item) => { itemsTxt += `▫️ ${item.name} - ₹${item.price}\n`; return acc + item.price; }, 0);
            const arrival = time === "15 Minutes" ? "15 मिनट में" : (time === "30 Minutes" ? "30 मिनट में" : "दुकान पर हूँ");
            
            const msg = `*🍔 नया PAID ऑर्डर (MOULASAR)*\n\n*ग्राहक:* ${name}\n*नंबर:* ${phone}\n*समय:* ${arrival}\n\n*आइटम्स:*\n${itemsTxt}-------------------\n*कुल बिल: ₹${subtotal}*\n-------------------\n_(भाई मैंने ₹${subtotal} का पेमेंट QR से कर दिया है, स्क्रीनशॉट भेज रहा हूँ!)_`;
            
            window.location.href = `https://wa.me/918058733741?text=${encodeURIComponent(msg)}`;
            cart = []; updateCartUI(); closePayment();
        }

        function showLogin() { if(prompt("Password:") === "jitu8087") document.getElementById('admin-section').style.display = 'block'; }
        function logout() { document.getElementById('admin-section').style.display = 'none'; }

        syncMenu();
    </script>
</body>
</html>
