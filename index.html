<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        .admin-panel { display: none; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <!-- Admin Panel Section -->
    <div id="admin-section" class="admin-panel max-w-2xl mx-auto mb-10">
        <h2 class="text-2xl font-black text-red-600 mb-6">ADMIN CONTROL PANEL</h2>
        <div id="admin-menu-list" class="space-y-4"></div>
        <button onclick="logout()" class="w-full mt-6 bg-gray-800 text-white py-3 rounded-xl font-bold">LOGOUT</button>
    </div>

    <!-- Customer Menu -->
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-black mb-6 text-center">Our Menu</h1>
        <div id="menu-container" class="space-y-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Load Menu from Firestore
        function loadMenu() {
            db.collection("menu").onSnapshot(snapshot => {
                const container = document.getElementById('menu-container');
                const adminList = document.getElementById('admin-menu-list');
                container.innerHTML = '';
                adminList.innerHTML = '';

                snapshot.forEach(doc => {
                    const item = doc.data();
                    const id = doc.id;

                    // Show to Customers
                    if (item.available) {
                        container.innerHTML += `
                            <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow">
                                <div><p class="font-bold">${item.name}</p><p class="text-red-600 font-bold">₹${item.price}</p></div>
                                <button onclick="order('${item.name}', ${item.price})" class="bg-red-600 text-white px-6 py-2 rounded-xl font-bold">ORDER</button>
                            </div>`;
                    }

                    // Show to Admin
                    adminList.innerHTML += `
                        <div class="bg-gray-50 p-4 rounded-xl border flex flex-col gap-2">
                            <div class="flex justify-between items-center">
                                <p class="font-bold">${item.name}</p>
                                <button onclick="toggleStock('${id}', ${item.available})" class="px-4 py-1 rounded-lg text-xs font-bold ${item.available ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}">
                                    ${item.available ? 'AVAILABLE' : 'OUT OF STOCK'}
                                </button>
                            </div>
                            <input type="number" value="${item.price}" onchange="updatePrice('${id}', this.value)" class="w-full p-2 border rounded-lg" placeholder="Edit Price">
                        </div>`;
                });
            });
        }

        // Functions
        function toggleStock(id, status) { db.collection("menu").doc(id).update({ available: !status }); }
        function updatePrice(id, newPrice) { db.collection("menu").doc(id).update({ price: parseInt(newPrice) }); }
        
        function showLogin() {
            if(prompt("Admin Password:") === "jitu8087") document.getElementById('admin-section').style.display = 'block';
        }
        function logout() { document.getElementById('admin-section').style.display = 'none'; }
        
        // WhatsApp
        function order(name, price) {
            window.location.href = `https://wa.me/918058733741?text=Order: ${name}, Price: ₹${price}`;
        }

        // Add a hidden login trigger
        document.body.innerHTML += `<button onclick="showLogin()" class="fixed bottom-4 right-4 bg-black text-white p-2 rounded-full opacity-20">Admin</button>`;
        
        loadMenu();
    </script>
</body>
</html>
