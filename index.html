<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Pro Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; padding-bottom: 120px; }
        
        /* Layering Fix: Admin Panel hamesha sabse upar rahega */
        #admin-panel { z-index: 9999 !important; position: relative; }
        #closed-screen { z-index: 8888 !important; }
        
        .cart-sheet { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(110%); z-index: 9500; }
        .cart-sheet.active { transform: translateY(0); }
        .admin-box { display: none; }
        .admin-box.show { display: block !important; }
        .product-img { width: 80px; height: 80px; object-fit: cover; border-radius: 1rem; }
    </style>
</head>
<body>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Shop Closed Overlay -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-4xl font-black text-gray-800 uppercase italic">Shop Closed</h2>
        <p class="text-gray-500 mt-2 font-bold uppercase text-xs tracking-widest">Abhi Orders Band Hain</p>
        <!-- Yahan se bhi admin khul sakega -->
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-900 text-white rounded-full font-black uppercase text-[10px] tracking-widest active:scale-90 transition-all shadow-xl">Admin Login</button>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md px-4 py-4 flex justify-between items-center border-b border-red-100">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-600 shadow-lg">
            <div>
                <h1 class="font-black text-xl text-red-600 tracking-tighter uppercase leading-none">Shri Shyam</h1>
                <div id="shop-indicator" class="text-[10px] font-bold mt-1 uppercase tracking-widest">Checking...</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('track-modal').classList.remove('hidden')" class="px-4 py-2 bg-red-50 text-red-600 font-bold text-[10px] rounded-full uppercase border border-red-200">Track</button>
            <button onclick="loginAdmin()" class="w-10 h-10 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center border hover:bg-red-600 hover:text-white transition-all"><i class="fa-solid fa-screwdriver-wrench"></i></button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-6">
        <!-- Admin Dashboard -->
        <div id="admin-panel" class="admin-box bg-slate-900 rounded-[2.5rem] p-6 mb-8 text-white shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-yellow-400 uppercase italic">Admin Control</h2>
                <button onclick="closeAdmin()"><i class="fa-solid fa-circle-xmark text-2xl opacity-50"></i></button>
            </div>
            
            <!-- Ye button ab hamesha dikhega shop off hone ke baad bhi -->
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-5 rounded-2xl font-black mb-8 uppercase shadow-xl transition-all border-4 border-white/10 text-lg">Status Loading...</button>
            
            <div class="bg-white/5 p-5 rounded-3xl mb-6 border border-white/10">
                <p class="text-[10px] font-black text-gray-400 mb-4 uppercase tracking-widest">Menu Manager</p>
                <div class="grid grid-cols-1 gap-3">
                    <input id="new-n" placeholder="Item Name" class="p-3 rounded-xl bg-white text-black font-bold outline-none">
                    <div class="flex gap-2">
                        <input id="new-p" type="number" placeholder="Price ₹" class="flex-1 p-3 rounded-xl bg-white text-black font-bold outline-none">
                        <input id="new-img" placeholder="Photo URL" class="flex-[2] p-3 rounded-xl bg-white text-black font-bold outline-none">
                    </div>
                    <button onclick="addItem()" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl uppercase">Save Item</button>
                </div>
                <div id="admin-menu-list" class="mt-6 space-y-2 max-h-60 overflow-y-auto"></div>
            </div>

            <h3 class="text-orange-400 font-black mb-4 uppercase text-sm">Active Orders</h3>
            <div id="admin-orders-list" class="space-y-4"></div>
        </div>

        <!-- User Menu Display -->
        <div id="menu-box" class="grid grid-cols-1 gap-4"></div>
    </main>

    <!-- Floating Cart -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 translate-y-32 transition-all duration-500">
        <div onclick="openCheckout()" class="bg-black p-4 rounded-[2rem] flex justify-between items-center text-white border-2 border-red-600 shadow-2xl cursor-pointer">
            <div class="flex items-center gap-4 pl-2">
                <div class="relative"><i class="fa-solid fa-bag-shopping text-2xl text-red-500"></i><span id="float-count" class="absolute -top-2 -right-2 bg-white text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span></div>
                <div><p id="float-total" class="text-xl font-black text-red-500 leading-none">₹0</p></div>
            </div>
            <div class="bg-red-600 px-8 py-3 rounded-2xl font-black text-xs uppercase tracking-widest">Order</div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 flex flex-col justify-end bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-t-[3rem] p-8 max-w-2xl mx-auto w-full shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-2xl uppercase">Checkout</h3>
                <button onclick="closeCheckout()"><i class="fa-solid fa-circle-xmark text-3xl text-gray-200"></i></button>
            </div>
            <div id="cart-summary" class="bg-gray-50 p-4 rounded-3xl mb-4 space-y-2 border border-gray-100"></div>
            <div class="flex justify-between font-black text-xl px-2 mb-6"><span>Total</span><span id="sheet-total" class="text-red-600">₹0</span></div>
            <div class="space-y-4">
                <input id="u-n" placeholder="Your Name" class="w-full p-4 bg-gray-100 rounded-2xl font-bold outline-none">
                <input id="u-p" type="tel" placeholder="WhatsApp Number" class="w-full p-4 bg-gray-100 rounded-2xl font-bold outline-none">
                <input id="u-a" placeholder="Address / Table No" class="w-full p-4 bg-gray-100 rounded-2xl font-bold outline-none">
                <select id="u-pay" class="w-full p-4 bg-green-50 text-green-700 rounded-2xl font-black outline-none"><option value="PAID">Online QR</option><option value="COD">Cash (COD)</option></select>
                <button onclick="handlePayment()" class="w-full bg-red-600 text-white font-black py-5 rounded-2xl uppercase shadow-xl mt-2">WhatsApp Order</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[9999] flex items-center justify-center p-6 text-center">
        <div class="bg-white rounded-[3rem] p-8 max-w-xs w-full shadow-2xl">
            <h3 class="font-black text-xl mb-4">Scan to Pay</h3>
            <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-[2rem] mb-6">
            <button onclick="finalSubmit('PAID')" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl uppercase">Payment Done ✅</button>
        </div>
    </div>

    <!-- Track Modal -->
    <div id="track-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] p-10 max-w-sm w-full relative">
            <button onclick="document.getElementById('track-modal').classList.add('hidden')" class="absolute top-6 right-6 text-gray-300"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h3 class="font-black text-center text-xl mb-8 uppercase italic">Track Order</h3>
            <input id="track-id" placeholder="Enter Order ID" class="w-full p-4 border rounded-2xl text-center font-bold uppercase mb-6 outline-none focus:border-red-500">
            <button onclick="trackOrder()" class="w-full bg-red-600 text-white font-black py-4 rounded-2xl uppercase">Check Status</button>
            <div id="track-res" class="mt-8 text-center"></div>
        </div>
    </div>

    <script>
        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();
        let cart = [];
        let isShopOpen = true;

        // 1. Database Logic
        rdb.ref('shop_status').on('value', (snap) => {
            isShopOpen = snap.val() !== false;
            document.getElementById('closed-screen').classList.toggle('hidden', isShopOpen);
            document.getElementById('shop-indicator').innerText = isShopOpen ? "● ONLINE" : "○ OFFLINE";
            document.getElementById('shop-indicator').style.color = isShopOpen ? "#22c55e" : "#ef4444";
            
            const btn = document.getElementById('toggle-shop-btn');
            if(btn) {
                btn.innerText = isShopOpen ? "🔴 CLOSE SHOP" : "🟢 OPEN SHOP NOW";
                btn.className = `w-full py-5 rounded-2xl font-black mb-8 uppercase shadow-xl text-white ${isShopOpen ? 'bg-red-600' : 'bg-green-600'}`;
            }
        });

        rdb.ref('menu').on('value', (snap) => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminList = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminList.innerHTML = '';
            Object.keys(data).forEach(id => {
                const item = data[id];
                const avail = item.available !== false;
                const img = item.image || 'https://via.placeholder.com/150';
                box.innerHTML += `<div class="bg-white p-4 rounded-3xl flex items-center justify-between border ${avail ? '' : 'opacity-40 grayscale'}">
                    <div class="flex items-center gap-4"><img src="${img}" class="product-img shadow-sm"><div><p class="font-black text-lg">${item.name}</p><p class="text-red-600 font-black text-xl">₹${item.price}</p></div></div>
                    ${avail ? `<button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-600 text-white w-12 h-12 rounded-2xl active:scale-90"><i class="fa-solid fa-plus"></i></button>` : '<span>OUT</span>'}</div>`;
                adminList.innerHTML += `<div class="flex justify-between items-center bg-white/10 p-3 rounded-xl border border-white/5 mb-2">
                    <span class="font-bold text-sm">${item.name}</span>
                    <div class="flex gap-2"><button onclick="rdb.ref('menu/${id}/available').set(${!avail})" class="px-3 py-1 rounded-lg font-black text-[10px] ${avail?'bg-green-600':'bg-red-600'}">${avail?'IN':'OUT'}</button>
                    <button onclick="rdb.ref('menu/${id}').remove()" class="text-red-400 p-2"><i class="fa fa-trash"></i></button></div></div>`;
            });
        });

        rdb.ref('orders').on('value', (snap) => {
            const orders = snap.val() || {};
            const list = document.getElementById('admin-orders-list');
            if(!list) return; list.innerHTML = '';
            Object.keys(orders).reverse().forEach(id => {
                const o = orders[id];
                list.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl border border-white/10 mb-3">
                    <div class="flex justify-between font-black text-yellow-400"><span>${o.customerName}</span><span>₹${o.total}</span></div>
                    <p class="text-gray-300 text-xs mb-3 italic">${o.items.replace(/%0A/g, ', ')}</p>
                    <div class="flex gap-2"><select onchange="rdb.ref('orders/${id}/status').set(this.value)" class="flex-1 bg-gray-800 p-2 rounded-xl text-xs font-bold"><option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option><option value="Ready" ${o.status==='Ready'?'selected':''}>Ready</option></select>
                    <button onclick="window.open('https://wa.me/91${o.customerPhone}')" class="bg-green-600 px-4 rounded-xl"><i class="fa-brands fa-whatsapp"></i></button></div></div>`;
            });
        });

        // App Logic
        function loginAdmin() {
            const pass = prompt("Enter Password:");
            if(pass === "1234") {
                document.getElementById('admin-panel').classList.add('show');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        function closeAdmin() { document.getElementById('admin-panel').classList.remove('show'); }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        function addItem() {
            const n = document.getElementById('new-n').value;
            const p = document.getElementById('new-p').value;
            const img = document.getElementById('new-img').value;
            if(n && p) { rdb.ref('menu').push({ name:n, price:parseInt(p), image:img, available:true }); }
        }
        function addToCart(n, p) { cart.push({name:n, price:p}); updateCart(); }
        function updateCart() {
            let total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('floating-cart').style.transform = cart.length > 0 ? "translateY(0)" : "translateY(150%)";
            document.getElementById('float-count').innerText = cart.length;
            document.getElementById('float-total').innerText = "₹" + total;
            document.getElementById('sheet-total').innerText = "₹" + total;
            document.getElementById('cart-summary').innerHTML = cart.map((i, idx) => `<div class="flex justify-between bg-white p-3 rounded-xl shadow-sm border border-gray-100"><span>${i.name}</span><i class="fa-solid fa-circle-xmark text-red-500" onclick="cart.splice(${idx},1);updateCart()"></i></div>`).join('');
        }
        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }
        function handlePayment() {
            if(!document.getElementById('u-n').value || !document.getElementById('u-p').value) return alert("Fill Details!");
            if(document.getElementById('u-pay').value === "PAID") document.getElementById('qr-modal').classList.remove('hidden');
            else finalSubmit("COD");
        }
        function finalSubmit(method) {
            const tid = Math.random().toString(36).substring(2, 8).toUpperCase();
            const order = { customerName: document.getElementById('u-n').value, customerPhone: document.getElementById('u-p').value, address: document.getElementById('u-a').value, items: cart.map(i => i.name).join('%0A'), total: cart.reduce((s, i) => s + i.price, 0), payType: method, status: 'Pending', trackingId: tid, timestamp: Date.now() };
            rdb.ref('orders').push(order).then(() => {
                const waMsg = `*🍔 NEW ORDER:* ${tid}%0A*Name:* ${order.customerName}%0A*Total:* ₹${order.total}%0A*Items:* ${order.items}`;
                window.open(`https://wa.me/918058733741?text=${waMsg}`, '_blank');
                cart = []; updateCart(); closeCheckout(); document.getElementById('qr-modal').classList.add('hidden');
            });
        }
        function trackOrder() {
            const id = document.getElementById('track-id').value.toUpperCase();
            rdb.ref('orders').orderByChild('trackingId').equalTo(id).once('value', (snap) => {
                const res = document.getElementById('track-res');
                if(snap.exists()) {
                    const data = Object.values(snap.val())[0];
                    res.innerHTML = `<div class="p-6 bg-red-50 rounded-3xl border-2 border-red-100"><p class="text-3xl font-black text-red-600">${data.status}</p></div>`;
                } else res.innerHTML = `<p class="font-black text-red-500">WRONG ID!</p>`;
            });
        }
    </script>
</body>
</html>
