<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food Moulasar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; transition: 0.3s; }
        .dot-green { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body class="bg-gray-50 pb-20">

    <!-- CLOSED SCREEN -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white z-[1000] flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-7xl text-red-500 mb-6"></i>
        <h2 class="text-3xl font-black text-gray-800">Dukaan Band Hai</h2>
        <button onclick="loginAdmin()" class="mt-10 text-gray-400 text-xs font-bold uppercase tracking-widest border border-gray-200 px-6 py-2 rounded-full">Admin Access</button>
    </div>

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-red-700 to-orange-600 text-white p-5 sticky top-0 z-40 shadow-xl rounded-b-[2rem]">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="font-black italic text-lg leading-none">SHRI SHYAM FAST FOOD</h1>
                <p class="text-[10px] font-bold mt-1 opacity-90 italic">MOULASAR | 8058733741</p>
                <div class="flex items-center gap-2 mt-2">
                    <span id="shop-dot" class="status-dot dot-red"></span>
                    <span id="shop-text" class="text-[9px] font-black uppercase">CHECKING...</span>
                </div>
            </div>
            <button onclick="loginAdmin()" class="bg-white/20 p-3 rounded-2xl backdrop-blur"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4 mt-4">
        <!-- ADMIN PANEL -->
        <div id="admin-panel" class="hidden bg-white p-6 rounded-3xl shadow-xl border-t-4 border-red-600 mb-8">
            <h2 class="font-black text-gray-800 mb-4">OWNER CONTROL</h2>
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-xl text-white font-black mb-4"></button>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <input id="new-n" placeholder="Name" class="p-2 border rounded-lg text-sm">
                <input id="new-p" placeholder="Price" class="p-2 border rounded-lg text-sm">
                <input id="new-i" placeholder="Emoji" class="p-2 border rounded-lg text-sm">
                <button onclick="addItem()" class="bg-black text-white rounded-lg font-black text-xs">ADD ITEM</button>
            </div>
            <div id="admin-menu-list" class="space-y-2"></div>
        </div>

        <!-- MENU -->
        <div id="menu-box" class="space-y-4 fade-in"></div>

        <!-- CART -->
        <div id="cart-ui" class="hidden fixed bottom-4 left-4 right-4 bg-white p-6 rounded-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] border">
            <h3 class="font-black mb-4">Checkout Details</h3>
            <input id="u-n" placeholder="Aapka Naam" class="w-full p-3 bg-gray-50 rounded-xl mb-2 text-sm font-bold">
            <input id="u-p" placeholder="Mobile Number" class="w-full p-3 bg-gray-50 rounded-xl mb-2 text-sm font-bold">
            <input id="u-a" placeholder="Address / Delivery Location" class="w-full p-3 bg-gray-50 rounded-xl mb-2 text-sm font-bold">
            <select id="u-t" class="w-full p-3 bg-gray-50 rounded-xl mb-4 text-sm font-bold">
                <option>15 Minute mein</option><option>30 Minute mein</option><option>1 Ghante mein</option>
            </select>
            <button onclick="placeOrder()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-lg">PAY & ORDER</button>
        </div>
    </div>

    <script>
        const rdb = firebase.database();
        let cart = [];
        let isShopOpen = true;

        // Firebase Sync
        rdb.ref('shop_status').on('value', snap => {
            isShopOpen = snap.val() ?? true;
            document.getElementById('closed-screen').style.display = isShopOpen ? 'none' : 'flex';
            document.getElementById('shop-dot').className = isShopOpen ? "status-dot dot-green" : "status-dot dot-red";
            document.getElementById('shop-text').innerText = isShopOpen ? "SHOP OPEN" : "SHOP CLOSED";
            const btn = document.getElementById('toggle-shop-btn');
            btn.innerText = isShopOpen ? "CLOSE SHOP" : "OPEN SHOP";
            btn.className = isShopOpen ? "w-full py-4 bg-red-600 text-white rounded-xl font-black" : "w-full py-4 bg-green-600 text-white rounded-xl font-black";
        });

        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminBox = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminBox.innerHTML = '';
            Object.keys(data).forEach(id => {
                const i = data[id];
                box.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3"><span class="text-3xl">${i.icon}</span><div><p class="font-black">${i.name}</p><p class="text-red-500 font-bold">₹${i.price}</p></div></div>
                    <button onclick="addToCart('${i.name}', ${i.price})" class="bg-black text-white px-6 py-2 rounded-xl text-xs font-black">ADD</button>
                </div>`;
                adminBox.innerHTML += `<div class="flex justify-between items-center text-xs border-b pb-1"><span>${i.name}</span><button onclick="rdb.ref('menu/${id}').remove()" class="text-red-500">DELETE</button></div>`;
            });
        });

        function addToCart(n, p) { cart.push({name:n, price:p}); document.getElementById('cart-ui').classList.remove('hidden'); }
        
        function placeOrder() {
            const n = document.getElementById('u-n').value, p = document.getElementById('u-p').value, a = document.getElementById('u-a').value, t = document.getElementById('u-t').value;
            let items = cart.map(i => `▫️ ${i.name} - ₹${i.price}`).join('%0A');
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            const msg = `*🍔 नया PAID ऑर्डर (MOULASAR)*%0A%0A*ग्राहक:* ${n}%0A*नंबर:* ${p}%0A*समय:* ${t}%0A*एड्रेस:* ${a}%0A%0A*आइटम्स:*%0A${items}%0A-------------------%0A*कुल बिल: ₹${total}*%0A-------------------%0A_(भाई मैंने ₹${total} का पेमेंट QR से कर दिया है, स्क्रीनशॉट भेज रहा हूँ!)_`;
            window.location.href = `https://wa.me/918058733741?text=${msg}`;
        }

        function loginAdmin() { if(prompt("Pass:") === "jitu8087") document.getElementById('admin-panel').classList.remove('hidden'); }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        function addItem() { rdb.ref('menu').push({name:document.getElementById('new-n').value, price:parseInt(document.getElementById('new-p').value), icon:document.getElementById('new-i').value}); }
    </script>
</body>
</html>
