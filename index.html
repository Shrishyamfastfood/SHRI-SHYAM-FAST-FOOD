<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Smart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 140px; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,0,0,0.1); }
        .gradient-text { background: linear-gradient(90deg, #dc2626, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-press:active { transform: scale(0.95); transition: 0.2s; }
        .cart-sheet { transition: transform 0.4s; transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body>

    <div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md z-[2000] flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-4xl font-black text-gray-800">Shop Closed</h2>
        <p class="text-gray-500 font-bold mt-2">Kripya khulne ka intezaar karein.</p>
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-100 rounded-full text-xs font-black text-gray-500 uppercase tracking-widest border btn-press">Owner Login</button>
    </div>

    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 object-cover">
            <div>
                <h1 class="font-black text-lg gradient-text uppercase tracking-tight">Shri Shyam Fast Food</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="shop-indicator" class="text-red-500 flex items-center gap-1.5 text-[10px] font-black uppercase tracking-widest">
                        <span id="shop-text">Checking...</span>
                    </span>
                </div>
            </div>
        </div>
        <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 border text-gray-500 flex items-center justify-center btn-press"><i class="fa-solid fa-sliders"></i></button>
    </header>

    <div class="max-w-2xl mx-auto px-4 py-6">
        
        <!-- ADMIN DASHBOARD -->
        <div id="admin-panel" class="hidden bg-gray-900 rounded-[2.5rem] shadow-2xl p-6 mb-8 text-white border border-white/10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-yellow-400">Admin Pro Panel</h2>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center btn-press"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Shop Toggle -->
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-2xl font-black mb-8 uppercase btn-press text-sm tracking-widest shadow-lg"></button>

            <!-- Naya Product Section -->
            <div class="bg-white/5 p-5 rounded-[2rem] mb-6 border border-white/10">
                <p class="font-black text-orange-400 text-[10px] mb-4 uppercase tracking-widest">Product & Timing Set Karein</p>
                
                <div class="grid grid-cols-12 gap-3">
                    <!-- Basic Info -->
                    <input id="new-i" placeholder="Icon (🍔)" class="col-span-3 p-4 bg-white/5 rounded-2xl text-center border border-white/10 text-xl focus:border-yellow-400 outline-none">
                    <input id="new-n" placeholder="Item Name" class="col-span-9 p-4 bg-white/5 rounded-2xl border border-white/10 focus:border-yellow-400 outline-none font-bold">
                    
                    <!-- Timing Inputs (Yahan hain options) -->
                    <div class="col-span-6">
                        <label class="text-[9px] text-gray-400 font-black ml-2 uppercase">Start (Kab shuru ho?)</label>
                        <input id="new-start" type="time" value="00:00" class="w-full p-4 bg-white/5 rounded-2xl border border-white/10 text-sm font-bold text-white outline-none">
                    </div>
                    <div class="col-span-6">
                        <label class="text-[9px] text-gray-400 font-black ml-2 uppercase">End (Kab band ho?)</label>
                        <input id="new-end" type="time" value="23:59" class="w-full p-4 bg-white/5 rounded-2xl border border-white/10 text-sm font-bold text-white outline-none">
                    </div>

                    <input id="new-p" type="number" placeholder="Price ₹" class="col-span-6 p-4 bg-white/5 rounded-2xl border border-white/10 focus:border-yellow-400 outline-none font-black text-lg">
                    <button onclick="addItem()" class="col-span-6 bg-yellow-400 text-black font-black rounded-2xl btn-press shadow-xl hover:bg-yellow-300 transition-all">ADD ITEM +</button>
                </div>

                <!-- Admin List -->
                <div id="admin-menu-list" class="mt-6 space-y-2 max-h-48 overflow-y-auto pr-2 custom-scroll"></div>
            </div>

            <!-- Live Orders Section -->
            <div class="mt-8 border-t border-white/10 pt-6">
                <h3 class="text-lg font-black mb-4 text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-bolt"></i> Live Orders</h3>
                <div id="admin-orders-list" class="space-y-4 max-h-80 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center gap-3">
            <span class="bg-red-500 w-2 h-8 rounded-full"></span> Aaj Ka Menu
        </h2>
        <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- UI Elements -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-all duration-500 translate-y-32">
        <div onclick="openCheckout()" class="bg-black p-5 rounded-[2rem] shadow-2xl flex justify-between items-center text-white cursor-pointer btn-press border border-white/10">
            <div class="flex items-center gap-4">
                <div class="bg-red-500 w-12 h-12 rounded-full flex items-center justify-center font-black" id="float-items">0</div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Total Bill</p>
                    <p id="float-total" class="text-xl font-black">₹0</p>
                </div>
            </div>
            <div class="flex items-center gap-2 font-black text-xs bg-white/10 px-4 py-2 rounded-full">VIEW CART <i class="fa-solid fa-arrow-right"></i></div>
        </div>
    </div>

    <div id="checkout-sheet" class="cart-sheet fixed inset-0 z-50 flex flex-col justify-end bg-black/60 backdrop-blur-md">
        <div class="bg-white w-full max-w-2xl mx-auto rounded-t-[3rem] shadow-2xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b flex justify-between items-center">
                <div>
                    <h3 class="font-black text-2xl text-gray-800">Review Order</h3>
                    <p class="text-xs text-gray-400 font-bold">Kripya apni details check karein</p>
                </div>
                <button onclick="closeCheckout()" class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center btn-press text-gray-500"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6">
                <div id="cart-summary" class="space-y-3"></div>
                <div class="flex justify-between items-center border-t border-dashed pt-4 font-black text-xl">
                    <span>Final Amount</span><span id="sheet-total" class="text-red-600">₹0</span>
                </div>
                <div class="space-y-4">
                    <input id="u-n" placeholder="Aapka Naam" class="w-full p-5 bg-gray-50 rounded-2xl outline-none font-bold border-2 border-transparent focus:border-red-500 transition-all">
                    <input id="u-p" type="tel" placeholder="Mobile No." class="w-full p-5 bg-gray-50 rounded-2xl outline-none font-bold border-2 border-transparent focus:border-red-500 transition-all">
                    <input id="u-a" placeholder="Table No / Address" class="w-full p-5 bg-gray-50 rounded-2xl outline-none font-bold border-2 border-transparent focus:border-red-500 transition-all">
                    <select id="u-pay" class="w-full p-5 bg-gray-900 text-white rounded-2xl outline-none font-black">
                        <option value="PAID">QR Code (Online)</option>
                        <option value="COD">Cash (Pay at Shop)</option>
                    </select>
                </div>
            </div>
            <div class="p-6 bg-white border-t">
                <button onclick="processPayment()" class="w-full bg-red-600 text-white font-black py-5 rounded-[2rem] shadow-xl btn-press text-lg uppercase tracking-widest">Confirm Order</button>
            </div>
        </div>
    </div>

    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[3000] flex items-center justify-center p-6 text-center backdrop-blur-xl">
        <div class="bg-white rounded-[3rem] p-8 max-w-xs w-full shadow-2xl">
             <h3 class="font-black text-2xl mb-2 gradient-text uppercase">Scan & Pay</h3>
             <p class="text-[10px] text-gray-400 font-black mb-6 uppercase">Shri Shyam Fast Food</p>
             <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-3xl border-4 border-gray-100 mb-6 p-2">
             <button onclick="confirmOrderAndSave('PAID')" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-lg mb-3 btn-press">I HAVE PAID ✅</button>
             <button onclick="document.getElementById('qr-modal').classList.add('hidden');" class="text-gray-400 font-black text-xs uppercase btn-press tracking-widest">Cancel</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        let cart = [];
        let isShopOpen = true;

        // --- PRODUCT TIMING LOGIC ---
        function checkProductTiming() {
            const now = new Date();
            const curTime = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            rdb.ref('menu').once('value', snap => {
                const data = snap.val();
                if(!data) return;

                Object.keys(data).forEach(id => {
                    const item = data[id];
                    if(item.startTime && item.endTime) {
                        let shouldBeActive = false;
                        if (item.startTime <= item.endTime) {
                            shouldBeActive = (curTime >= item.startTime && curTime <= item.endTime);
                        } else {
                            shouldBeActive = (curTime >= item.startTime || curTime <= item.endTime);
                        }
                        if(item.available !== shouldBeActive) {
                            rdb.ref(`menu/${id}/available`).set(shouldBeActive);
                        }
                    }
                });
            });
        }
        setInterval(checkProductTiming, 20000); // Har 20 seconds mein check

        // Firebase Sync Shop
        rdb.ref('shop_status').on('value', snap => {
            isShopOpen = snap.val() ?? true;
            document.getElementById('closed-screen').style.display = isShopOpen ? 'none' : 'flex';
            document.getElementById('shop-text').innerText = isShopOpen ? 'SHOP OPEN' : 'SHOP CLOSED';
            const btn = document.getElementById('toggle-shop-btn');
            btn.innerText = isShopOpen ? "🔴 Close Shop Now" : "🟢 Open Shop Now";
            btn.className = isShopOpen ? "w-full py-4 rounded-2xl font-black bg-red-600/20 text-red-500 border border-red-500/30 btn-press" : "w-full py-4 rounded-2xl font-black bg-green-500 text-white shadow-xl btn-press";
        });

        // Sync Menu
        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box');
            const adminBox = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminBox.innerHTML = '';
            
            Object.keys(data).forEach(id => {
                const i = data[id];
                const isAvail = i.available !== false;
                
                // User Menu
                box.innerHTML += `
                <div class="bg-white p-5 rounded-3xl flex justify-between items-center shadow-sm border border-gray-100 ${isAvail ? 'scale-100' : 'opacity-60 grayscale scale-95'} transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-gray-50 rounded-2xl flex items-center justify-center text-2xl border">${i.icon || '🍽️'}</div>
                        <div>
                            <p class="font-black text-gray-800 text-lg">${i.name}</p>
                            <div class="flex items-center gap-2">
                                <p class="text-red-500 font-black">₹${i.price}</p>
                                <span class="text-[8px] bg-gray-100 px-2 py-0.5 rounded-full font-bold text-gray-400 tracking-tighter">${i.startTime}-${i.endTime}</span>
                            </div>
                        </div>
                    </div>
                    ${isAvail ? `<button onclick="addToCart('${i.name.replace(/'/g, "")}', ${i.price})" class="bg-red-50 text-red-500 px-6 py-3 rounded-2xl text-xs font-black btn-press border border-red-100">ADD</button>` : `<span class="text-[9px] text-gray-400 font-black uppercase tracking-widest">Not Available</span>`}
                </div>`;
                
                // Admin List Item
                adminBox.innerHTML += `
                <div class="flex justify-between items-center bg-white/5 p-3 rounded-2xl border border-white/5">
                    <div class="flex flex-col">
                        <span class="text-[11px] font-black text-white">${i.name}</span>
                        <span class="text-[9px] text-yellow-400 font-bold uppercase">${i.startTime} to ${i.endTime}</span>
                    </div>
                    <button onclick="rdb.ref('menu/${id}').remove()" class="w-8 h-8 rounded-full bg-red-500/20 text-red-500 text-xs btn-press"><i class="fa fa-trash"></i></button>
                </div>`;
            });
        });

        // Core App Functions
        function loginAdmin() { if(prompt("Enter PIN:") === "8087jitu") { document.getElementById('admin-panel').classList.remove('hidden'); window.scrollTo(0,0); } }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        
        function addItem() {
            const n = document.getElementById('new-n').value, 
                  p = document.getElementById('new-p').value, 
                  i = document.getElementById('new-i').value || "🍔",
                  s = document.getElementById('new-start').value,
                  e = document.getElementById('new-end').value;
            if(n && p && s && e) {
                rdb.ref('menu').push({name:n, price:parseInt(p), icon:i, startTime:s, endTime:e, available:true});
                document.getElementById('new-n').value=''; document.getElementById('new-p').value='';
                checkProductTiming();
            } else { alert("Sabhi fields bhariye (Time zaroori hai)"); }
        }

        function addToCart(n, p) { cart.push({name:n, price:p}); updateCartUI(); }
        function updateCartUI() {
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            const floatBar = document.getElementById('floating-cart');
            if(cart.length > 0) floatBar.classList.remove('translate-y-32'); else floatBar.classList.add('translate-y-32');
            document.getElementById('float-items').innerText = cart.length;
            document.getElementById('float-total').innerText = `₹${total}`;
            document.getElementById('cart-summary').innerHTML = cart.map((i, idx) => `<div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl"><div><p class="font-black text-gray-800 text-sm">${i.name}</p><p class="text-xs text-red-500 font-bold">₹${i.price}</p></div><i onclick="cart.splice(${idx},1); updateCartUI();" class="fa-solid fa-circle-minus text-gray-300 text-xl cursor-pointer hover:text-red-500"></i></div>`).join('');
            document.getElementById('sheet-total').innerText = `₹${total}`;
        }

        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }

        function processPayment() {
            if(!document.getElementById('u-n').value || !document.getElementById('u-p').value) { alert("Naam aur Number bhariye!"); return; }
            if(document.getElementById('u-pay').value === "PAID") { document.getElementById('qr-modal').classList.remove('hidden'); } 
            else { confirmOrderAndSave("COD"); }
        }

        function confirmOrderAndSave(type) {
            const name = document.getElementById('u-n').value, phone = document.getElementById('u-p').value, addr = document.getElementById('u-a').value;
            let itemsMsg = cart.map(i => `▫️ ${i.name} - ₹${i.price}`).join('%0A');
            let total = cart.reduce((sum, i) => sum + i.price, 0);
            const orderData = { customerName: name, customerPhone: phone, items: itemsMsg, total: total, payType: type, address: addr, status: 'Pending', timestamp: Date.now() };
            
            rdb.ref('orders').push(orderData).then(() => {
                const msg = `*🍔 Naya Order (${type})*%0A%0A*Naam:* ${name}%0A*Number:* ${phone}%0A*Table/Addr:* ${addr}%0A%0A*Items:*%0A${itemsMsg}%0A%0A*Total:* ₹${total}`;
                window.location.href = `https://wa.me/918058733741?text=${msg}`;
                cart = []; updateCartUI(); document.getElementById('qr-modal').classList.add('hidden'); closeCheckout();
            });
        }

        // Live Order Sync for Admin
        rdb.ref('orders').limitToLast(10).on('value', snap => {
            const orders = snap.val() || {};
            const list = document.getElementById('admin-orders-list');
            list.innerHTML = '';
            Object.keys(orders).reverse().forEach(id => {
                const o = orders[id];
                list.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl border bord
