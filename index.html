<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 120px; }
        .cart-sheet { transition: transform 0.4s ease; transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Shop Closed Screen -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white z-[5000] flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-3xl font-black text-gray-800">SHOP CLOSED</h2>
        <button onclick="loginAdmin()" class="mt-8 px-6 py-2 bg-gray-100 rounded-full text-xs font-bold border">Admin Login</button>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white shadow-sm px-4 py-3 flex justify-between items-center border-b border-red-50">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-10 h-10 rounded-full border-2 border-red-500">
            <div>
                <h1 class="font-black text-red-600 leading-none">Shri Shyam</h1>
                <p id="shop-indicator" class="text-[9px] font-bold text-gray-400 uppercase">Connecting...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('track-modal').classList.remove('hidden')" class="px-3 py-1.5 rounded-full bg-red-50 text-red-600 font-bold text-[10px] border uppercase">Track</button>
            <button onclick="loginAdmin()" class="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center text-gray-500 border"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <div class="max-w-xl mx-auto px-4 py-6">
        <!-- Admin Panel (Iska button upar gear icon hai) -->
        <div id="admin-panel" class="hidden bg-gray-900 rounded-3xl p-6 mb-8 text-white">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-black text-yellow-400 uppercase">Admin Hub</h2>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-3 rounded-xl font-black mb-4 uppercase bg-red-600">Toggle Shop</button>
            
            <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/10">
                <div class="flex gap-2 mb-4">
                    <input id="new-n" placeholder="Item Name" class="flex-1 p-2 rounded bg-white text-black font-bold">
                    <input id="new-p" type="number" placeholder="₹" class="w-20 p-2 rounded bg-white text-black font-bold">
                    <button onclick="addItem()" class="bg-green-600 px-4 rounded font-bold"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="admin-menu-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>

            <h3 class="text-orange-400 font-bold mb-2 uppercase text-xs tracking-widest">Live Orders</h3>
            <div id="admin-orders-list" class="space-y-3 max-h-60 overflow-y-auto"></div>
        </div>

        <!-- User Menu -->
        <div id="menu-box" class="grid grid-cols-1 gap-3"></div>
    </div>

    <!-- Cart Bar -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-xl mx-auto z-40 translate-y-32 transition-transform">
        <div onclick="openCheckout()" class="bg-black p-4 rounded-2xl flex justify-between items-center text-white border-2 border-red-600 cursor-pointer shadow-2xl">
            <div>
                <p id="float-count" class="text-[10px] font-bold text-gray-400">0 ITEMS</p>
                <p id="float-total" class="text-xl font-black text-red-500">₹0</p>
            </div>
            <span class="bg-red-600 px-6 py-2 rounded-xl font-black text-xs uppercase">Check Out</span>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 z-[5000] flex flex-col justify-end bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-t-[2rem] p-6 max-w-xl mx-auto w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-xl">Confirm Order</h3>
                <button onclick="closeCheckout()"><i class="fa-solid fa-circle-xmark text-2xl text-gray-300"></i></button>
            </div>
            <div id="cart-summary" class="bg-gray-50 p-4 rounded-xl mb-4 space-y-2 max-h-40 overflow-y-auto"></div>
            <div class="space-y-3">
                <input id="u-n" placeholder="Name" class="w-full p-3 bg-gray-100 rounded-xl font-bold border-none outline-none">
                <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-3 bg-gray-100 rounded-xl font-bold border-none outline-none">
                <input id="u-a" placeholder="Address/Table No" class="w-full p-3 bg-gray-100 rounded-xl font-bold border-none outline-none">
                <div class="flex gap-2">
                    <select id="u-pay" class="flex-1 p-3 bg-green-50 text-green-700 rounded-xl font-black border-none outline-none">
                        <option value="PAID">Online (QR)</option>
                        <option value="COD">Cash (COD)</option>
                    </select>
                </div>
                <button onclick="processOrder()" class="w-full bg-red-600 text-white font-black py-4 rounded-xl uppercase shadow-lg mt-2">Send Order to WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[6000] flex items-center justify-center p-6 text-center">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full">
            <h3 class="font-black mb-4">Scan To Pay</h3>
            <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-xl mb-6">
            <button onclick="saveToFirebase('PAID')" class="w-full bg-green-600 text-white font-black py-3 rounded-xl uppercase">I have paid ✅</button>
        </div>
    </div>

    <!-- Track Modal -->
    <div id="track-modal" class="hidden fixed inset-0 bg-black/80 z-[6000] flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full relative">
            <button onclick="document.getElementById('track-modal').classList.add('hidden')" class="absolute top-4 right-4"><i class="fa-solid fa-xmark text-gray-400"></i></button>
            <h3 class="font-black text-center mb-6">TRACK ORDER</h3>
            <input id="track-id" placeholder="Enter ID" class="w-full p-3 border-2 rounded-xl text-center font-bold uppercase mb-4 outline-none">
            <button onclick="trackNow()" class="w-full bg-red-600 text-white font-black py-3 rounded-xl uppercase">Track Status</button>
            <div id="track-res" class="mt-6 text-center font-black text-red-600 uppercase"></div>
        </div>
    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        let cart = [];
        let isShopOpen = true;

        // 1. SHOP STATUS SYNC
        rdb.ref('shop_status').on('value', (s) => {
            isShopOpen = s.val() !== false;
            document.getElementById('closed-screen').classList.toggle('hidden', isShopOpen);
            document.getElementById('shop-indicator').innerText = isShopOpen ? "● Online" : "○ Offline";
            document.getElementById('shop-indicator').style.color = isShopOpen ? "green" : "red";
            const btn = document.getElementById('toggle-shop-btn');
            if(btn) {
                btn.innerText = isShopOpen ? "Close Shop" : "Open Shop";
                btn.style.backgroundColor = isShopOpen ? "red" : "green";
            }
        });

        // 2. MENU SYNC
        rdb.ref('menu').on('value', (s) => {
            const data = s.val() || {};
            const box = document.getElementById('menu-box');
            const adminList = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminList.innerHTML = '';

            Object.keys(data).forEach(id => {
                const item = data[id];
                const avail = item.available !== false;
                // User Side
                box.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100 ${avail ? '' : 'opacity-50 grayscale'}">
                        <div><p class="font-black text-gray-800">${item.name}</p><p class="text-red-600 font-bold">₹${item.price}</p></div>
                        ${avail ? `<button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-50 text-red-600 px-5 py-2 rounded-xl text-xs font-black border border-red-100">ADD</button>` : '<span class="text-[10px] font-bold text-gray-400">OUT</span>'}
                    </div>`;
                // Admin Side
                adminList.innerHTML += `
                    <div class="flex justify-between items-center bg-white/10 p-2 rounded text-xs">
                        <span>${item.name}</span>
                        <div class="flex gap-2">
                            <button onclick="rdb.ref('menu/${id}/available').set(${!avail})" class="px-2 py-1 rounded bg-gray-700">${avail?'IN':'OUT'}</button>
                            <button onclick="rdb.ref('menu/${id}').remove()" class="text-red-400"><i class="fa fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        });

        // 3. ADMIN ORDERS SYNC
        rdb.ref('orders').on('value', (s) => {
            const orders = s.val() || {};
            const list = document.getElementById('admin-orders-list');
            if(!list) return;
            list.innerHTML = '';
            Object.keys(orders).reverse().forEach(id => {
                const o = orders[id];
                list.innerHTML += `
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10 text-[11px]">
                        <div class="flex justify-between text-yellow-400 font-bold mb-1"><span>${o.customerName}</span><span>₹${o.total}</span></div>
                        <p class="text-gray-400 mb-2">${o.items.split('%0A').join(', ')}</p>
                        <select onchange="rdb.ref('orders/${id}/status').set(this.value)" class="w-full bg-gray-800 p-1.5 rounded border border-white/20">
                            <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                            <option value="Ready" ${o.status==='Ready'?'selected':''}>Ready</option>
                            <option value="Cancel" ${o.status==='Cancel'?'selected':''}>Cancel</option>
                        </select>
                    </div>`;
            });
        });

        // FUNCTIONS
        function addToCart(n, p) { cart.push({name:n, price:p}); updateUI(); }
        function updateUI() {
            let total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('floating-cart').style.transform = cart.length > 0 ? "translateY(0)" : "translateY(110%)";
            document.getElementById('float-count').innerText = cart.length + " ITEMS";
            document.getElementById('float-total').innerText = "₹" + total;
            document.getElementById('sheet-total').innerText = "₹" + total;
            document.getElementById('cart-summary').innerHTML = cart.map((i, idx) => `<div class="flex justify-between font-bold text-sm bg-white p-2 rounded shadow-sm"><span>${i.name}</span><span class="text-red-500" onclick="cart.splice(${idx},1);updateUI()">✕</span></div>`).join('');
        }

        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }

        function loginAdmin() {
            if(prompt("Password?") === "1234") document.getElementById('admin-panel').classList.remove('hidden');
        }

        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }

        function addItem() {
            const n = document.getElementById('new-n').value;
            const p = document.getElementById('new-p').value;
            if(n && p) rdb.ref('menu').push({ name:n, price:parseInt(p), available:true });
        }

        function processOrder() {
            const n = document.getElementById('u-n').value;
            const p = document.getElementById('u-p').value;
            if(!n || !p) return alert("Fill Name and Phone!");
            if(document.getElementById('u-pay').value === "PAID") {
                document.getElementById('qr-modal').classList.remove('hidden');
            } else {
                saveToFirebase("COD");
            }
        }

        function saveToFirebase(method) {
            const tid = Math.random().toString(36).substring(2, 8).toUpperCase();
            const order = {
                customerName: document.getElementById('u-n').value,
                customerPhone: document.getElementById('u-p').value,
                address: document.getElementById('u-a').value,
                items: cart.map(i => i.name).join('%0A'),
                total: cart.reduce((s, i) => s + i.price, 0),
                payType: method, status: 'Pending', trackingId: tid
            };

            rdb.ref('orders').push(order).then(() => {
                const msg = `*NEW ORDER: ${tid}*%0A*Name:* ${order.customerName}%0A*Items:*%0A${order.items}%0A*Total:* ₹${order.total}%0A*Method:* ${method}`;
                window.open(`https://wa.me/918058733741?text=${msg}`, '_blank');
                cart = []; updateUI(); closeCheckout();
                document.getElementById('qr-modal').classList.add('hidden');
                alert("Order Placed! ID: " + tid);
            });
        }

        function trackNow() {
            const id = document.getElementById('track-id').value.toUpperCase();
            rdb.ref('orders').orderByChild('trackingId').equalTo(id).once('value', (snap) => {
                const res = document.getElementById('track-res');
                if(snap.exists()) {
                    const data = Object.values(snap.val())[0];
                    res.innerText = "STATUS: " + data.status;
                } else res.innerText = "NOT FOUND!";
            });
        }
    </script>
</body>
</html>
