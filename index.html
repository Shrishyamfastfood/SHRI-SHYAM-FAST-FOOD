<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Shri Shyam Fast Food Moulasar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot-green { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body class="bg-gray-100 pb-20">

    <!-- Header with Bindi -->
    <header class="bg-red-600 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="font-black italic text-lg">SHRI SHYAM FAST FOOD</h1>
                <p class="text-[10px] uppercase font-bold tracking-widest italic">Moulasar | 8058733741</p>
                <div class="flex items-center gap-2 mt-1">
                    <span id="conn-dot" class="status-dot dot-red"></span>
                    <span id="conn-text" class="text-[9px] font-bold">CONNECTING...</span>
                </div>
            </div>
            <button onclick="checkAdmin()" class="bg-white/20 p-2 rounded-lg"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4">
        <!-- ADMIN PANEL (FULL CONTROL) -->
        <div id="admin-panel" class="hidden bg-white p-5 rounded-2xl shadow-xl border-t-4 border-red-600 mb-6">
            <h2 class="font-black text-red-600 mb-4 uppercase">Master Control</h2>
            <button id="shop-toggle" onclick="toggleShop()" class="w-full py-3 rounded-lg font-black text-white mb-4"></button>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <input id="n-name" placeholder="Name" class="p-2 border rounded text-sm">
                <input id="n-price" placeholder="Price" class="p-2 border rounded text-sm">
                <input id="n-icon" placeholder="Emoji" class="p-2 border rounded text-sm">
                <button onclick="addItem()" class="bg-black text-white rounded-lg font-bold text-xs">ADD ITEM</button>
            </div>
            <div id="admin-menu-list" class="space-y-2"></div>
        </div>

        <!-- CUSTOMER MENU -->
        <div id="menu-container" class="space-y-3"></div>
    </div>

    <script>
        const config = { databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(config);
        const rdb = firebase.database();

        // 1. Monitor Shop Status & Bindi
        rdb.ref('shop_status').on('value', snap => {
            const open = snap.val() ?? true;
            document.getElementById('conn-dot').className = open ? "status-dot dot-green" : "status-dot dot-red";
            document.getElementById('conn-text').innerText = open ? "SHOP OPEN" : "SHOP CLOSED";
            const btn = document.getElementById('shop-toggle');
            btn.innerText = open ? "CLOSE SHOP" : "OPEN SHOP";
            btn.className = open ? "w-full py-3 bg-red-600 text-white rounded-lg font-bold" : "w-full py-3 bg-green-600 text-white rounded-lg font-bold";
        });

        // 2. Load Menu & Admin List
        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const list = document.getElementById('menu-container');
            const adminList = document.getElementById('admin-menu-list');
            list.innerHTML = ''; adminList.innerHTML = '';
            
            Object.keys(data).forEach(id => {
                const i = data[id];
                // Customer View
                list.innerHTML += `<div class="bg-white p-4 rounded-xl flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3"><span class="text-2xl">${i.icon}</span><div><p class="font-bold text-sm">${i.name}</p><p class="text-red-500 font-bold text-xs">₹${i.price}</p></div></div>
                    <button onclick="alert('Order Feature active!')" class="bg-black text-white px-4 py-2 rounded-lg text-[10px] font-black">ADD</button>
                </div>`;
                // Admin View
                adminList.innerHTML += `<div class="flex justify-between items-center text-xs border-b p-1">
                    <span>${i.name}</span>
                    <div class="flex gap-1"><input value="${i.price}" onchange="rdb.ref('menu/${id}/price').set(parseInt(this.value))" class="w-10 border text-center">
                    <button onclick="rdb.ref('menu/${id}').remove()" class="text-red-500"><i class="fa fa-trash"></i></button></div>
                </div>`;
            });
        });

        // Functions
        function toggleShop() { rdb.ref('shop_status').set(!document.getElementById('conn-text').innerText.includes("OPEN")); }
        function addItem() { 
            rdb.ref('menu').push({ name: document.getElementById('n-name').value, price: parseInt(document.getElementById('n-price').value), icon: document.getElementById('n-icon').value }); 
        }
        function checkAdmin() { if(prompt("Password:") === "jitu8087") document.getElementById('admin-panel').classList.toggle('hidden'); }
    </script>
</body>
</html>
