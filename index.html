<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 140px; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,0,0,0.1); }
        .gradient-text { background: linear-gradient(90deg, #dc2626, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-press:active { transform: scale(0.95); transition: 0.2s; }
        .cart-sheet { transition: transform 0.4s; transform: translateY(110%); }
        .cart-sheet.active { transform: translateY(0); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .animate-pulse-slow { animation: pulse-slow 3s infinite; }
    </style>
</head>
<body>

    <!-- Closed Overlay -->
    <div id="closed-screen" class="hidden fixed inset-0 bg-white/95 backdrop-blur-md z-[2000] flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-store-slash text-6xl text-red-500 mb-4"></i>
        <h2 class="text-4xl font-black text-gray-800">Shop Closed</h2>
        <p class="text-gray-500 font-bold mt-2">Kripya khulne ka intezaar karein.</p>
        <button onclick="loginAdmin()" class="mt-10 px-8 py-3 bg-gray-100 rounded-full text-xs font-black text-gray-500 uppercase tracking-widest border btn-press">Owner Login</button>
    </div>

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 object-cover">
            <div>
                <h1 class="font-black text-lg gradient-text uppercase tracking-tight">Shri Shyam Fast Food</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="shop-indicator" class="text-red-500 flex items-center gap-1.5 text-[10px] font-black uppercase">
                        <span class="status-dot bg-gray-400"></span> <span id="shop-text">Checking...</span>
                    </span>
                    <span class="text-[10px] font-bold text-gray-400">| MOULASAR | <i class="fa-solid fa-phone"></i> 80587 33741</span>
                </div>
            </div>
        </div>
        <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 border text-gray-500 flex items-center justify-center btn-press"><i class="fa-solid fa-sliders"></i></button>
    </header>

    <div class="max-w-2xl mx-auto px-4 py-6">
        
        <!-- LIVE TRACKING SECTION -->
        <div id="tracking-section" class="hidden mb-8 bg-white p-6 rounded-[2.5rem] shadow-lg border-2 border-orange-100 animate-pulse-slow">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-gray-800 uppercase text-xs tracking-widest">Live Order Status</h3>
                <span id="track-id-display" class="text-[10px] bg-gray-100 px-2 py-1 rounded font-bold text-gray-500 italic"></span>
            </div>
            
            <div class="flex justify-between relative mb-8 px-2">
                <div class="absolute top-4 left-0 w-full h-1 bg-gray-100 z-0"></div>
                <div id="track-progress-bar" class="absolute top-4 left-0 w-0 h-1 bg-orange-500 z-0 transition-all duration-700"></div>
                
                <div class="z-10 text-center flex flex-col items-center">
                    <div id="step-1" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-white transition-colors duration-500"><i class="fa-solid fa-clock text-[10px]"></i></div>
                    <p class="text-[8px] font-black mt-2 uppercase text-gray-400">Wait</p>
                </div>
                <div class="z-10 text-center flex flex-col items-center">
                    <div id="step-2" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-white transition-colors duration-500"><i class="fa-solid fa-fire-burner text-[10px]"></i></div>
                    <p class="text-[8px] font-black mt-2 uppercase text-gray-400">Cook</p>
                </div>
                <div class="z-10 text-center flex flex-col items-center">
                    <div id="step-3" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-white transition-colors duration-500"><i class="fa-solid fa-check-double text-[10px]"></i></div>
                    <p class="text-[8px] font-black mt-2 uppercase text-gray-400">Ready</p>
                </div>
            </div>

            <div id="status-msg" class="text-center font-bold text-gray-600 text-sm mb-5 italic">Checking your order...</div>
            <button id="cancel-order-btn" onclick="requestCancellation()" class="w-full py-3 border-2 border-red-500 text-red-500 rounded-2xl font-black text-xs uppercase btn-press">Cancel Order</button>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-panel" class="hidden bg-gray-900 rounded-[2rem] shadow-2xl p-6 mb-8 text-white">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-yellow-400">Admin Dashboard</h2>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center btn-press"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button id="toggle-shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-xl font-black mb-6 uppercase btn-press">Checking...</button>
            <div class="bg-white/5 p-4 rounded-2xl mb-6 border border-white/10">
                <div class="grid grid-cols-12 gap-2">
                    <input id="new-i" placeholder="Icon" class="col-span-3 p-3 bg-black/30 rounded-xl text-center text-xs">
                    <input id="new-n" placeholder="Item Name" class="col-span-9 p-3 bg-black/30 rounded-xl">
                    <input id="new-p" type="number" placeholder="Price (₹)" class="col-span-6 p-3 bg-black/30 rounded-xl">
                    <button onclick="addItem()" class="col-span-6 bg-red-600 text-white font-black rounded-xl btn-press">ADD +</button>
                </div>
                <div id="admin-menu-list" class="space-y-3 max-h-60 overflow-y-auto mt-4"></div>
            </div>
            <div class="mt-8 border-t border-white/10 pt-6">
                <h3 class="text-lg font-black mb-4 text-orange-400">Live Orders</h3>
                <div id="admin-orders-list" class="space-y-4 max-h-96 overflow-y-auto"></div>
            </div>
        </div>

        <h2 class="text-2xl font-black text-gray-800 mb-4 border-b-2 border-red-100 pb-2 border-dashed">Today's Menu</h2>
        <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Cart Bar -->
    <div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300 translate-y-32">
        <div onclick="openCheckout()" class="bg-gradient-to-r from-green-600 to-emerald-500 p-4 rounded-2xl shadow-xl flex justify-between items-center text-white cursor-pointer btn-press">
            <div><p id="float-items" class="text-xs font-bold uppercase">0 Items</p><p id="float-total" class="text-lg font-black">₹0</p></div>
            <div class="flex items-center gap-2 font-black text-sm">VIEW CART <i class="fa-solid fa-bag-shopping"></i></div>
        </div>
    </div>

    <!-- Checkout Sheet -->
    <div id="checkout-sheet" class="cart-sheet fixed inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl mx-auto rounded-t-[2.5rem] shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-[2.5rem]">
                <h3 class="font-black text-2xl text-gray-800">Checkout</h3>
                <button onclick="closeCheckout()" class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center btn-press text-gray-500"><i class="fa-solid fa-arrow-down"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <div id="cart-summary" class="bg-gray-50 p-4 rounded-2xl border space-y-2"></div>
                <div class="flex justify-between font-black text-xl px-2"><span>Total</span><span id="sheet-total" class="text-red-600">₹0</span></div>
                <input id="u-n" placeholder="Naam" class="w-full p-4 bg-gray-50 border rounded-xl font-bold">
                <input id="u-p" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 border rounded-xl font-bold">
                <input id="u-a" placeholder="Address / Table No." class="w-full p-4 bg-gray-50 border rounded-xl font-bold">
                <select id="u-pay" class="w-full p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl font-black">
                    <option value="PAID">Online Pay (QR Code)</option>
                    <option value="COD">Cash on Delivery (COD)</option>
                </select>
            </div>
            <div class="p-5"><button onclick="processPayment()" class="w-full bg-gradient-to-r from-red-600 to-orange-500 text-white font-black py-4 rounded-2xl shadow-xl btn-press">CONFIRM ORDER</button></div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/95 z-[3000] flex items-center justify-center p-6 text-center backdrop-blur-md">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full">
             <h3 class="font-black text-2xl mb-2 gradient-text">JAY SHREE SHYAM</h3>
             <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl border-4 mb-6">
             <button onclick="confirmOrderAndSave('PAID')" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-lg mb-3 btn-press">PAYMENT DONE</button>
             <button onclick="document.getElementById('qr-modal').classList.add('hidden');" class="text-gray-400 font-bold text-xs uppercase">CANCEL</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
          authDomain: "shri-shyam-fast-food.firebaseapp.com",
          databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com",
          projectId: "shri-shyam-fast-food",
          storageBucket: "shri-shyam-fast-food.firebasestorage.app",
          messagingSenderId: "828353855950",
          appId: "1:828353855950:web:96d62828e8e410e8812b9f",
          measurementId: "G-38J1Y2M8LD"
        };

        firebase.initializeApp(firebaseConfig);
        const rdb = firebase.database();

        let cart = [];
        let isShopOpen = true;

        // On Load Tracking Check
        window.onload = () => {
            const urlID = new URLSearchParams(window.location.search).get('track');
            const localID = localStorage.getItem('activeOrderID');
            if(urlID || localID) startLiveTracking(urlID || localID);
        };

        // Shop Status
        rdb.ref('shop_status').on('value', snap => {
            isShopOpen = (snap.val() !== false);
            document.getElementById('closed-screen').style.display = isShopOpen ? 'none' : 'flex';
            document.getElementById('shop-indicator').innerHTML = `<span class="status-dot ${isShopOpen ? 'bg-green-500' : 'bg-red-500'}"></span> <span>${isShopOpen ? 'SHOP OPEN' : 'SHOP CLOSED'}</span>`;
            document.getElementById('toggle-shop-btn').innerText = isShopOpen ? "🔴 TURN OFF SHOP" : "🟢 TURN ON SHOP";
            document.getElementById('toggle-shop-btn').className = isShopOpen ? "w-full py-4 rounded-xl font-black bg-red-600 text-white btn-press" : "w-full py-4 rounded-xl font-black bg-green-500 text-white btn-press";
        });

        // Menu Sync
        rdb.ref('menu').on('value', snap => {
            const data = snap.val() || {};
            const box = document.getElementById('menu-box'), adminBox = document.getElementById('admin-menu-list');
            box.innerHTML = ''; adminBox.innerHTML = '';
            Object.keys(data).forEach(id => {
                const i = data[id], isAvail = i.available !== false;
                box.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100 ${isAvail ? '' : 'opacity-60 grayscale'}"><div class="flex items-center gap-3"><div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-xl border">${i.icon}</div><div><p class="font-black text-gray-800">${i.name}</p><p class="text-red-500 font-black text-sm">₹${i.price}</p></div></div>${isAvail ? `<button onclick="addToCart('${i.name}', ${i.price})" class="border-2 border-red-100 text-red-500 px-5 py-2 rounded-xl text-xs font-black btn-press">ADD</button>` : `<span class="text-[10px] text-gray-400 font-black uppercase">OUT</span>`}</div>`;
                adminBox.innerHTML += `<div class="bg-white/5 p-3 rounded-xl flex justify-between items-center border border-white/10"><span class="text-xs font-bold">${i.name}</span><div class="flex gap-2"><button onclick="rdb.ref('menu/${id}/available').set(${!isAvail})" class="px-2 py-1 text-[10px] rounded ${isAvail?'bg-green-500':'bg-red-500'}">${isAvail?'IN':'OUT'}</button><button onclick="rdb.ref('menu/${id}').remove()" class="text-red-400 px-2"><i class="fa fa-trash"></i></button></div></div>`;
            });
        });

        // Admin Orders Sync
        rdb.ref('orders').on('value', snap => {
            const orders = snap.val() || {}, list = document.getElementById('admin-orders-list');
            list.innerHTML = '';
            Object.keys(orders).reverse().forEach(id => {
                const o = orders[id];
                list.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-sm mb-2"><div class="flex justify-between font-black text-orange-400"><span>${o.customerName}</span><span>${o.status}</span></div><div class="text-[10px] text-gray-400 mb-2">${o.payType} | ₹${o.total}</div><div class="bg-black/20 p-2 rounded mb-3 text-xs">${o.items.replace(/%0A/g, '<br>')}</div><div class="flex gap-2"><select onchange="rdb.ref('orders/${id}/status').set(this.value)" class="flex-1 bg-gray-800 p-2 rounded text-xs"><option>Update Status</option><option value="Preparing">Preparing</option><option value="Ready">Ready</option><option value="Completed">Completed</option><option value="Cancelled">Cancel</option></select><button onclick="window.location.href='https://wa.me/91${o.customerPhone}'" class="bg-green-600 px-3 rounded"><i class="fa-brands fa-whatsapp"></i></button></div></div>`;
            });
        });

        function addToCart(n, p) { cart.push({name:n, price:p}); updateCartUI(); }
        function updateCartUI() {
            let total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('floating-cart').className = cart.length ? 'fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300' : 'fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 transition-transform duration-300 translate-y-32';
            document.getElementById('float-items').innerText = `${cart.length} ITEMS`;
            document.getElementById('float-total').innerText = `₹${total}`;
            document.getElementById('sheet-total').innerText = `₹${total}`;
            document.getElementById('cart-summary').innerHTML = cart.map((i,idx) => `<div class="flex justify-between text-sm font-bold"><span>${i.name}</span><span>₹${i.price} <i onclick="cart.splice(${idx},1);updateCartUI()" class="fa-solid fa-circle-minus text-red-400 ml-1"></i></span></div>`).join('');
        }

        function processPayment() {
            if(!document.getElementById('u-n').value || !document.getElementById('u-p').value) return alert("Details bhariye!");
            if(document.getElementById('u-pay').value === "PAID") document.getElementById('qr-modal').classList.remove('hidden');
            else confirmOrderAndSave("COD");
        }

        function confirmOrderAndSave(type) {
            const name = document.getElementById('u-n').value, phone = document.getElementById('u-p').value;
            let itemsMsg = cart.map(i => `▫️ ${i.name} - ₹${i.price}`).join('%0A'), total = cart.reduce((s, i) => s + i.price, 0);
            const ref = rdb.ref('orders').push();
            ref.set({ customerName:name, customerPhone:phone, items:itemsMsg, total, payType:type, status:'Pending', timestamp:Date.now() })
            .then(() => {
                localStorage.setItem('activeOrderID', ref.key);
                localStorage.setItem('activePayType', type);
                window.location.href = `https://wa.me/918058733741?text=*नया ऑर्डर (${type})*%0A*नाम:* ${name}%0A*Items:*%0A${itemsMsg}%0A*Track:* ${window.location.href}?track=${ref.key}`;
                cart = []; updateCartUI(); closeCheckout(); document.getElementById('qr-modal').classList.add('hidden');
                startLiveTracking(ref.key);
            });
        }

        function startLiveTracking(id) {
            const section = document.getElementById('tracking-section'), msg = document.getElementById('status-msg'), bar = document.getElementById('track-progress-bar');
            rdb.ref(`orders/${id}`).on('value', snap => {
                const o = snap.val();
                if(!o || o.status === 'Completed') { section.classList.add('hidden'); localStorage.removeItem('activeOrderID'); return; }
                section.classList.remove('hidden');
                document.getElementById('track-id-display').innerText = `ID: ${id.slice(-6)}`;
                
                const steps = { 'Pending': [1, "20%", "Aapka order mil gaya hai.", "#fbbf24"], 'Preparing': [2, "55%", "Chef khana bana rahe hain...", "#3b82f6"], 'Ready': [3, "100%", "✅ Order Taiyar Hai!", "#10b981"] };
                const s = steps[o.status] || [0, "0%", o.status, "#666"];
                
                bar.style.width = s[1]; bar.style.backgroundColor = s[3];
                for(let i=1;i<=3;i++) document.getElementById(`step-${i}`).style.backgroundColor = i <= s[0] ? s[3] : '#e5e7eb';
                msg.innerText = s[2];
                
                if(o.status === 'Refund Requested') { msg.innerText = "Refund Request Sent!"; document.getElementById('cancel-order-btn').innerText = "REFUND PENDING"; }
                if(o.status === 'Cancelled') { msg.innerText = "Order Cancelled."; setTimeout(() => location.reload(), 2000); localStorage.clear(); }
            });
        }

        function requestCancellation() {
            const id = localStorage.getItem('activeOrderID'), type = localStorage.getItem('activePayType');
            if(!confirm("Cancel order?")) return;
            if(type === "COD") rdb.ref(`orders/${id}/status`).set('Cancelled');
            else rdb.ref(`orders/${id}/status`).set('Refund Requested');
        }

        function loginAdmin() { if(prompt("PIN:") === "8087jitu") document.getElementById('admin-panel').classList.remove('hidden'); }
        function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
        function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }
        function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
        function addItem() {
            const n = document.getElementById('new-n').value, p = document.getElementById('new-p').value, i = document.getElementById('new-i').value || "🍔";
            if(n && p) rdb.ref('menu').push({name:n, price:parseInt(p), icon:i, available:true});
        }
    </script>
</body>
</html>
