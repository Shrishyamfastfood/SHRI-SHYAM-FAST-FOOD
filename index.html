<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food Moulasar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; padding-bottom: 100px; }
        .gradient-nav { background: linear-gradient(90deg, #cc0000 0%, #ff5722 100%); }
        .logo-img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid white; object-fit: cover; }
        .admin-panel { display: none; background: white; border-top: 6px solid #cc0000; border-radius: 24px; padding: 24px; margin-bottom: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .closed-screen { display: none; position: fixed; inset: 0; background: white; z-index: 200; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

    <!-- POORI DUKAN BAND HONE PAR YE DIKHEGA -->
    <div id="closed-screen" class="closed-screen">
        <i class="fa-solid fa-clock-rotate-left text-7xl text-red-500 mb-4"></i>
        <h2 class="text-3xl font-black text-gray-900">Dukaan Abhi Band Hai</h2>
        <p class="text-gray-500 mt-2">Hum jaldi hi wapas aayenge!</p>
        <button onclick="showLogin()" class="mt-20 text-gray-300 text-xs hover:text-gray-600">Admin Login</button>
    </div>

    <!-- Header -->
    <header class="gradient-nav text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" alt="Logo" class="logo-img shadow-lg">
                <div>
                    <h1 class="text-lg font-black leading-none uppercase">Shri Shyam Fast Food</h1>
                    <p class="text-[10px] font-bold mt-1 text-white/80 uppercase tracking-tighter italic">Moulasar | 8058733741</p>
                </div>
            </div>
            <!-- BADA ADMIN BUTTON -->
            <button onclick="showLogin()" class="bg-white/20 p-3 rounded-full hover:bg-white/40 transition">
                <i class="fa-solid fa-user-gear text-white text-lg"></i>
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- ADMIN PANEL SECTION -->
        <div id="admin-section" class="admin-panel max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-8 border-b pb-4">
                <h2 class="text-2xl font-black text-red-600">MANAGER SETTINGS</h2>
                <button onclick="logout()" class="text-gray-400 font-black text-sm uppercase">Logout</button>
            </div>

            <!-- POORI DUKAN ON/OFF BUTTON -->
            <div class="bg-gray-100 p-6 rounded-2xl mb-8 flex justify-between items-center border-2 border-dashed border-gray-300">
                <div>
                    <p class="font-black text-gray-800">SHOP STATUS (OPEN/CLOSED)</p>
                    <p class="text-xs text-gray-500">Ise dabane par poori dukan band ho jayegi</p>
                </div>
                <button id="shop-main-toggle" onclick="toggleShopMain()" class="px-8 py-3 rounded-xl font-black transition shadow-lg"></button>
            </div>

            <h3 class="font-black text-gray-400 text-xs mb-4 uppercase tracking-widest">Items & Prices</h3>
            <div id="admin-controls" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- Menu & Cart (Same Logic) -->
        <div class="flex flex-col md:flex-row gap-8">
            <div class="w-full md:w-2/3">
                <h2 class="text-2xl font-black mb-6 italic text-gray-800">Today's Menu</h2>
                <div id="menu-container" class="grid grid-cols-1 gap-4"></div>
            </div>
            <div class="w-full md:w-1/3">
                <div class="bg-white rounded-3xl shadow-xl p-6 sticky top-24 border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 flex justify-between items-center text-gray-800">Your Cart <span id="cart-count" class="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs font-black">0</span></h2>
                    <div id="cart-items" class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-2"></div>
                    <div class="border-t pt-4 mb-6 flex justify-between items-center text-2xl font-black text-gray-900"><span>Total Bill</span><span id="total" class="text-red-600">₹0</span></div>
                    <!-- Checkout Logic remains same -->
                    <div id="checkout-form" class="hidden space-y-4">
                        <input type="text" id="cust-name" class="w-full border rounded-xl p-3 bg-gray-50 text-gray-800" placeholder="Aapka Naam">
                        <input type="tel" id="cust-phone" class="w-full border rounded-xl p-3 bg-gray-50 text-gray-800" placeholder="Mobile Number">
                        <button onclick="document.getElementById('payment-modal').style.display='flex'" class="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-lg">PAY & ORDER</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal stays same -->
    <div id="payment-modal" style="display:none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center">
             <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" alt="QR" class="w-full rounded-2xl mb-4">
             <button onclick="finalSubmit()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl">DONE: SEND ON WHATSAPP</button>
             <button onclick="document.getElementById('payment-modal').style.display='none'" class="mt-4 text-gray-400 text-xs">CANCEL</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
            authDomain: "shri-shyam-fast-food.firebaseapp.com",
            projectId: "shri-shyam-fast-food",
            storageBucket: "shri-shyam-fast-food.firebasestorage.app",
            messagingSenderId: "828353855950",
            appId: "1:828353855950:web:96d62828e8e410e8812b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = [];
        let isShopOpenGlobal = true;

        // 1. Sync Everything
        function syncData() {
            // Sync Shop Status
            db.collection("settings").doc("shop_status").onSnapshot(doc => {
                if(doc.exists) {
                    isShopOpenGlobal = doc.data().isOpen;
                    document.getElementById('closed-screen').style.display = isShopOpenGlobal ? 'none' : 'flex';
                    const btn = document.getElementById('shop-main-toggle');
                    btn.innerText = isShopOpenGlobal ? "DUKAN KHULI HAI" : "DUKAN BAND HAI";
                    btn.className = isShopOpenGlobal ? "px-8 py-3 rounded-xl font-black bg-green-100 text-green-600 border border-green-200" : "px-8 py-3 rounded-xl font-black bg-red-600 text-white shadow-xl";
                }
            });

            // Sync Menu
            db.collection("menu").onSnapshot(snapshot => {
                const container = document.getElementById('menu-container');
                const adminBox = document.getElementById('admin-controls');
                container.innerHTML = ''; adminBox.innerHTML = '';
                snapshot.forEach(doc => {
                    const item = doc.data(); const id = doc.id;
                    container.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm ${!item.available ? 'opacity-40 pointer-events-none' : ''}"><div class="flex items-center gap-4"><span class="text-3xl">${item.icon}</span><div><p class="font-bold text-gray-800 text-sm">${item.name}</p><p class="text-red-600 font-black">₹${item.price}</p></div></div><button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-50 text-red-600 font-bold px-6 py-2 rounded-xl">ADD</button></div>`;
                    adminBox.innerHTML += `<div class="bg-gray-50 p-4 rounded-xl border border-gray-200"><div class="flex justify-between items-center mb-2"><p class="text-[10px] font-bold text-gray-400 uppercase">${item.name}</p><button onclick="db.collection('menu').doc('${id}').update({available: ${!item.available}})" class="px-3 py-1 rounded text-[9px] font-black ${item.available ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}">${item.available ? 'ON' : 'OFF'}</button></div><input type="number" value="${item.price}" onchange="db.collection('menu').doc('${id}').update({price: parseInt(this.value)})" class="w-full p-2 border rounded-lg text-sm font-bold"></div>`;
                });
            });
        }

        function toggleShopMain() { db.collection("settings").doc("shop_status").set({ isOpen: !isShopOpenGlobal }); }
        function showLogin() { if(prompt("Admin Password:") === "jitu8087") { document.getElementById('admin-section').style.display = 'block'; window.scrollTo(0,0); } }
        function logout() { document.getElementById('admin-section').style.display = 'none'; }
        
        // Cart Logic (Minimal for code length)
        function addToCart(n, p) { cart.push({name:n, price:p}); updateCart(); }
        function updateCart() {
            let sub = cart.reduce((a, b) => a + b.price, 0);
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `<div class="flex justify-between text-xs font-bold p-2 bg-gray-50 rounded"><span>${i.name}</span><span class="text-red-600">₹${i.price}</span></div>`).join('');
            document.getElementById('total').innerText = `₹${sub}`;
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('checkout-form').classList.toggle('hidden', sub < 100);
        }

        function finalSubmit() {
            const msg = `*🍔 नया ऑर्डर*\n*ग्राहक:* ${document.getElementById('cust-name').value}\n*बिल:* ${document.getElementById('total').innerText}\n\n_(भाई पेमेंट कर दिया है!)_`;
            window.location.href = `https://wa.me/918058733741?text=${encodeURIComponent(msg)}`;
        }

        syncData();
    </script>
</body>
</html>
