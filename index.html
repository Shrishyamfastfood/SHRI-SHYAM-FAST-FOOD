<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food - Pickup App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #ffffff; padding-bottom: 120px; color: #1e293b; }
        
        /* Saaf Interface - No excessive blur */
        .header-ui { background: #ffffff; border-bottom: 2px solid #f1f5f9; position: sticky; top: 0; z-index: 100; }
        .category-pill { background: #f1f5f9; color: #64748b; transition: 0.3s; border: 1px solid transparent; }
        .category-pill.active { background: #ef4444; color: #ffffff; border-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        
        /* Cart & Panels */
        .cart-sheet { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: fixed; inset: 0; z-index: 1000; display: none; }
        .cart-sheet.active { display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0,0,0,0.5); }
        .sheet-content { background: white; border-radius: 2rem 2rem 0 0; transform: translateY(100%); transition: 0.4s; width: 100%; max-width: 600px; margin: 0 auto; }
        .cart-sheet.active .sheet-content { transform: translateY(0); }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .item-card { border: 1px solid #f1f5f9; background: #ffffff; border-radius: 1.5rem; transition: 0.2s; }
        .item-card:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-red-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="font-black text-red-500 uppercase tracking-widest">Shri Shyam Kitchen...</p>
</div>

<header class="header-ui px-4 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
        <img src="https://i.ibb.co/1GCNRt0h/IMG-20260513-WA0000.jpg" class="w-12 h-12 rounded-full border-2 border-red-500 object-cover">
        <div>
            <h1 class="font-black text-xl text-gray-900 leading-none">SHRI SHYAM</h1>
            <div class="flex items-center gap-2 mt-1">
                <span id="shop-indicator" class="text-[10px] font-black uppercase flex items-center gap-1">
                    <span id="status-dot-ui" class="status-dot bg-gray-400"></span>
                    <span id="status-text-ui">Checking...</span>
                </span>
            </div>
        </div>
    </div>
    <button onclick="loginAdmin()" class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 border"><i class="fa-solid fa-sliders"></i></button>
</header>

<main class="px-4 py-6 max-w-2xl mx-auto">
    <div id="user-tracking" class="hidden mb-8 animate-pop">
        <div class="bg-red-50 border border-red-100 p-4 rounded-3xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-red-500 uppercase tracking-widest">Live Order Status</span>
                <span id="track-status" class="bg-red-500 text-white text-[10px] px-2 py-1 rounded-full font-black uppercase">Pending</span>
            </div>
            <p id="track-items" class="text-sm font-bold text-gray-700 truncate">Aapka order receive ho gya hai...</p>
        </div>
    </div>

    <div class="relative mb-6">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-300"></i>
        <input id="searchBox" onkeyup="filterMenu()" type="text" placeholder="Khana search karein..." class="w-full pl-12 pr-4 py-4 rounded-2xl bg-gray-50 border-none outline-none font-bold text-gray-600 focus:ring-2 ring-red-500 transition-all">
    </div>

    <div class="flex gap-3 overflow-x-auto pb-4 no-scrollbar mb-4">
        <button onclick="filterCategory('All')" class="category-pill active px-6 py-2 rounded-full font-black text-xs whitespace-nowrap">Sabhi Food</button>
        <button onclick="filterCategory('Fast Food')" class="category-pill px-6 py-2 rounded-full font-black text-xs whitespace-nowrap">🍔 Fast Food</button>
        <button onclick="filterCategory('Pizza')" class="category-pill px-6 py-2 rounded-full font-black text-xs whitespace-nowrap">🍕 Pizza</button>
        <button onclick="filterCategory('Drinks')" class="category-pill px-6 py-2 rounded-full font-black text-xs whitespace-nowrap">🥤 Drinks</button>
    </div>

    <div id="menu-box" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
</main>

<div id="floating-cart" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto z-40 translate-y-32 transition-transform duration-300">
    <button onclick="openCheckout()" class="w-full bg-red-600 text-white p-4 rounded-3xl shadow-xl flex justify-between items-center px-8 active:scale-95 transition-transform">
        <div>
            <p id="float-count" class="text-[10px] font-black uppercase opacity-80">0 Items</p>
            <p id="float-total" class="text-xl font-black">₹0</p>
        </div>
        <div class="flex items-center gap-2 font-black">VIEW CART <i class="fa-solid fa-arrow-right"></i></div>
    </button>
</div>

<div id="checkout-sheet" class="cart-sheet">
    <div class="sheet-content max-h-[90vh] flex flex-col shadow-2xl">
        <div class="p-6 border-b flex justify-between items-center">
            <h3 class="text-xl font-black">Order Details</h3>
            <button onclick="closeCheckout()" class="text-gray-400"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
        </div>
        <div class="p-6 overflow-y-auto flex-1">
            <div id="cart-items-list" class="space-y-3 mb-6"></div>
            <div class="space-y-4">
                <input id="u-name" placeholder="Aapka Naam" class="w-full p-4 bg-gray-50 rounded-2xl outline-none font-bold">
                <input id="u-phone" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 rounded-2xl outline-none font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <select id="u-time" class="p-4 bg-gray-50 rounded-2xl font-bold outline-none"><option>10-15 Mins</option><option>20-30 Mins</option></select>
                    <select id="u-pay" class="p-4 bg-green-50 text-green-600 rounded-2xl font-bold outline-none"><option value="CASH">Cash</option><option value="ONLINE">Online (QR)</option></select>
                </div>
            </div>
        </div>
        <div class="p-6 bg-gray-50 rounded-t-3xl">
            <div class="flex justify-between mb-4 px-2 font-black text-lg"><span>Total Amount</span><span id="final-price" class="text-red-600">₹0</span></div>
            <button onclick="placeOrder()" class="w-full bg-red-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg">PLACE ORDER</button>
        </div>
    </div>
</div>

<div id="admin-panel" class="hidden fixed inset-0 bg-white z-[2000] p-6 overflow-y-auto">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-black">Admin Panel</h2>
        <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="text-2xl text-gray-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="p-4 bg-gray-100 rounded-2xl">Revenue: <h3 id="adm-rev" class="text-xl font-black text-green-600">₹0</h3></div>
        <div class="p-4 bg-gray-100 rounded-2xl">Pending: <h3 id="adm-pen" class="text-xl font-black text-red-500">0</h3></div>
    </div>
    <button id="shop-btn" onclick="toggleShop()" class="w-full py-4 rounded-2xl font-black mb-8 text-white"></button>
    
    <div class="mb-10">
        <h3 class="font-black mb-4 text-orange-500">Live Orders</h3>
        <div id="adm-orders" class="space-y-4"></div>
    </div>

    <div class="p-6 bg-gray-50 rounded-3xl border border-dashed border-gray-300">
        <h3 class="font-black mb-4">Add Menu Item</h3>
        <input id="ni" placeholder="Emoji (🍔)" class="w-full p-3 mb-2 rounded-xl border-none font-bold">
        <input id="nn" placeholder="Item Name" class="w-full p-3 mb-2 rounded-xl border-none font-bold">
        <input id="np" type="number" placeholder="Price" class="w-full p-3 mb-2 rounded-xl border-none font-bold">
        <select id="nc" class="w-full p-3 mb-4 rounded-xl border-none font-bold"><option>Fast Food</option><option>Pizza</option><option>Drinks</option></select>
        <button onclick="addItem()" class="w-full bg-black text-white py-3 rounded-xl font-black">SAVE TO MENU</button>
    </div>
</div>

<div id="qr-modal" class="hidden fixed inset-0 bg-black/90 z-[3000] flex items-center justify-center p-6">
    <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full text-center">
        <h3 class="font-black text-2xl mb-4">Pay via QR</h3>
        <img src="https://i.ibb.co/chqR1YGg/IMG-20260513-WA0001.jpg" class="w-full rounded-2xl mb-6 shadow-xl">
        <button onclick="finalOrder('PAID')" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black">PAYMENT DONE</button>
    </div>
</div>

<audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAD6rZ9pbMfkCsYs3ItGoIe89H38mod504",
    authDomain: "shri-shyam-fast-food.firebaseapp.com",
    databaseURL: "https://shri-shyam-fast-food-default-rtdb.firebaseio.com/",
    projectId: "shri-shyam-fast-food",
    storageBucket: "shri-shyam-fast-food.firebasestorage.app",
    messagingSenderId: "828353855950",
    appId: "1:828353855950:web:96d62828e8e410e8812b9f"
};

firebase.initializeApp(firebaseConfig);
const rdb = firebase.database();
let cart = [], menu = [], isShopOpen = true, currentCat = 'All';

// Init Functions
rdb.ref('shop_status').on('value', snap => {
    isShopOpen = snap.val() !== false;
    document.getElementById('status-dot-ui').className = `status-dot ${isShopOpen ? 'bg-green-500' : 'bg-red-500'}`;
    document.getElementById('status-text-ui').innerText = isShopOpen ? 'SHOP OPEN' : 'SHOP CLOSED';
    document.getElementById('shop-btn').innerText = isShopOpen ? 'TURN OFF SHOP' : 'TURN ON SHOP';
    document.getElementById('shop-btn').className = `w-full py-4 rounded-2xl font-black mb-8 text-white ${isShopOpen ? 'bg-red-600' : 'bg-green-600'}`;
    document.getElementById('loader').style.display = 'none';
});

rdb.ref('menu').on('value', snap => {
    menu = [];
    const data = snap.val() || {};
    Object.keys(data).forEach(id => menu.push({id, ...data[id]}));
    renderMenu();
});

rdb.ref('orders').on('value', snap => {
    const orders = snap.val() || {};
    renderAdminOrders(orders);
    updateTrack(orders);
});

function renderMenu() {
    const box = document.getElementById('menu-box');
    box.innerHTML = '';
    const filtered = currentCat === 'All' ? menu : menu.filter(i => i.category === currentCat);
    filtered.forEach(i => {
        const avail = i.available !== false;
        box.innerHTML += `
        <div class="item-card p-4 flex justify-between items-center ${!avail ? 'opacity-50' : ''}">
            <div class="flex items-center gap-4">
                <div class="text-3xl">${i.icon || '🍔'}</div>
                <div><h4 class="font-black text-gray-800">${i.name}</h4><p class="text-red-500 font-black">₹${i.price}</p></div>
            </div>
            ${avail ? `<button onclick="addCart('${i.name}', ${i.price})" class="bg-red-50 text-red-600 px-6 py-2 rounded-xl font-black text-xs active:scale-90 transition-all">ADD</button>` : '<span class="text-[10px] font-black uppercase text-gray-400">SOLD OUT</span>'}
        </div>`;
    });
}

function addCart(n, p) {
    cart.push({name: n, price: p});
    updateUI();
}

function updateUI() {
    const total = cart.reduce((s, i) => s + i.price, 0);
    document.getElementById('float-count').innerText = `${cart.length} Items`;
    document.getElementById('float-total').innerText = `₹${total}`;
    document.getElementById('final-price').innerText = `₹${total}`;
    document.getElementById('floating-cart').style.transform = cart.length > 0 ? 'translateY(0)' : 'translateY(128px)';
    
    document.getElementById('cart-items-list').innerHTML = cart.map((i, idx) => `
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
            <span class="font-bold text-gray-700">${i.name}</span>
            <div class="flex items-center gap-3 font-black">₹${i.price} <i onclick="cart.splice(${idx},1);updateUI()" class="fa-solid fa-trash-can text-red-400 cursor-pointer"></i></div>
        </div>`).join('');
}

function openCheckout() { document.getElementById('checkout-sheet').classList.add('active'); }
function closeCheckout() { document.getElementById('checkout-sheet').classList.remove('active'); }

function placeOrder() {
    if(!document.getElementById('u-name').value || document.getElementById('u-phone').value.length < 10) return alert('Details bhariye!');
    if(document.getElementById('u-pay').value === 'ONLINE') document.getElementById('qr-modal').classList.remove('hidden');
    else finalOrder('CASH');
}

function finalOrder(pay) {
    const token = Math.floor(1000 + Math.random() * 9000);
    const order = {
        token, customerName: document.getElementById('u-name').value, customerPhone: document.getElementById('u-phone').value,
        pickupTime: document.getElementById('u-time').value, items: cart.map(i => i.name).join(', '),
        total: cart.reduce((s, i) => s + i.price, 0), payType: pay, status: 'Pending', timestamp: Date.now()
    };
    rdb.ref('orders').push(order).then(() => {
        localStorage.setItem('myToken', token);
        window.location.href = `https://wa.me/918058733741?text=New Order: #${token}, Total: ₹${order.total}`;
    });
}

function updateTrack(orders) {
    const myToken = localStorage.getItem('myToken');
    if(!myToken) return;
    const myOrder = Object.values(orders).find(o => o.token == myToken);
    if(myOrder && myOrder.status !== 'Completed') {
        document.getElementById('user-tracking').classList.remove('hidden');
        document.getElementById('track-status').innerText = myOrder.status;
        document.getElementById('track-items').innerText = myOrder.items;
    } else {
        document.getElementById('user-tracking').classList.add('hidden');
    }
}

function renderAdminOrders(orders) {
    const list = document.getElementById('adm-orders');
    list.innerHTML = '';
    let rev = 0, pen = 0;
    Object.keys(orders).reverse().forEach(id => {
        const o = orders[id];
        if(o.status !== 'Cancelled') rev += o.total;
        if(o.status === 'Pending') pen++;
        if(o.status === 'Completed') return;

        list.innerHTML += `
        <div class="p-5 bg-gray-50 rounded-3xl border border-gray-100">
            <div class="flex justify-between items-start mb-2">
                <h4 class="font-black">#${o.token} • ${o.customerName}</h4>
                <select onchange="rdb.ref('orders/${id}/status').set(this.value)" class="text-xs font-bold bg-white p-2 rounded-lg outline-none">
                    <option value="Pending" ${o.status=='Pending'?'selected':''}>Pending</option>
                    <option value="Preparing" ${o.status=='Preparing'?'selected':''}>Preparing</option>
                    <option value="Ready" ${o.status=='Ready'?'selected':''}>Ready</option>
                    <option value="Completed">Done</option>
                </select>
            </div>
            <p class="text-xs text-gray-500 font-bold mb-4">${o.items}</p>
            <div class="flex gap-2">
                <a href="tel:${o.customerPhone}" class="flex-1 bg-white border py-2 text-center rounded-xl"><i class="fa-solid fa-phone"></i></a>
                <a href="https://wa.me/91${o.customerPhone}" class="flex-1 bg-green-500 text-white py-2 text-center rounded-xl"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>`;
    });
    document.getElementById('adm-rev').innerText = `₹${rev}`;
    document.getElementById('adm-pen').innerText = pen;
}

function loginAdmin() { if(prompt('PIN:') === '8087jitu') document.getElementById('admin-panel').classList.remove('hidden'); }
function toggleShop() { rdb.ref('shop_status').set(!isShopOpen); }
function addItem() {
    const n = document.getElementById('nn').value, p = document.getElementById('np').value, i = document.getElementById('ni').value, c = document.getElementById('nc').value;
    if(n && p) rdb.ref('menu').push({name:n, price:parseInt(p), icon:i, category:c, available:true});
}
function filterCategory(c) { currentCat = c; document.querySelectorAll('.category-pill').forEach(b => b.classList.toggle('active', b.innerText.includes(c))); renderMenu(); }
function filterMenu() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    document.querySelectorAll('#menu-box > div').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
}
</script>
</body>
</html>
