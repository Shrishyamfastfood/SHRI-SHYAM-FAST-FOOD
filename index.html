<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Shyam Fast Food</title>
    <style>
        /* === CSS & ANIMATIONS === */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8f9fa; color: #333; overflow-x: hidden; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .navbar { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 22px; cursor: pointer; }
        .nav-btns button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: 600; margin-left: 10px; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; animation: fadeIn 0.8s ease-out; }
        .section-title { text-align: center; color: #ff4b2b; margin-bottom: 20px; font-size: 24px; text-transform: uppercase; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .menu-card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #eee; transition: 0.3s; }
        .menu-card:hover { transform: translateY(-5px); border-color: #ff416c; }
        .menu-card h3 { font-size: 18px; color: #333; }
        .price { font-size: 20px; font-weight: 700; color: #ff416c; margin-bottom: 10px; }
        .add-btn { background: #ff416c; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }

        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: #28a745; color: white; border: none; padding: 15px 20px; border-radius: 50px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4); z-index: 1000; display: none; animation: pulse 2s infinite;}

        /* Modal / Checkout Box */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; animation: fadeIn 0.3s; }
        .modal-box input, .modal-box textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .btn-confirm { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        .btn-close { background: #dc3545; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}

        /* Admin Dashboard */
        .admin-view { display: none; background: white; padding: 30px; border-radius: 15px; max-width: 400px; margin: 50px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .admin-view input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        .admin-view button { background: #ff416c; color: white; border: none; width: 100%; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        .dashboard { display: none; max-width: 900px; margin: 20px auto; padding: 0 20px;}
        .table-wrap { background: white; padding: 20px; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f4f4f4; }
        .status-btn { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; color: white; font-size: 12px; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1 onclick="showCustomer()">Shri Shyam Fast Food</h1>
        <div class="nav-btns">
            <button onclick="showAdminLogin()">Admin Panel</button>
        </div>
    </div>

    <!-- CUSTOMER VIEW -->
    <div id="customer-page" class="container">
        <h2 class="section-title">Hamara Menu</h2>
        <div class="menu-grid" id="menu-container"></div>
    </div>

    <button class="floating-cart" id="cart-btn" onclick="openCheckout()">
        🛒 Cart (<span id="cart-count">0</span>) - ₹<span id="cart-total">0</span>
    </button>

    <!-- CHECKOUT MODAL -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-box">
            <h2 style="color: #ff416c;">Complete Your Order</h2>
            <p>Total Bill: ₹<span id="modal-total">0</span></p>
            <input type="text" id="cust-name" placeholder="Aapka Naam" required>
            <input type="number" id="cust-phone" placeholder="Phone Number" required>
            <textarea id="cust-address" placeholder="Delivery Address / Table No." rows="3" required></textarea>
            <button class="btn-confirm" onclick="placeOrder()">Place Order Now</button>
            <button class="btn-close" onclick="closeCheckout()">Cancel</button>
        </div>
    </div>

    <!-- ADMIN LOGIN -->
    <div id="login-page" class="admin-view">
        <h2 style="text-align:center; color:#ff416c;">Admin Login</h2>
        <input type="text" id="admin-id" placeholder="Admin ID">
        <input type="password" id="admin-pass" placeholder="Password">
        <button onclick="loginAdmin()">Login Securely</button>
        <p id="error-msg" style="color:red; display:none; text-align:center;">Galat Details!</p>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="dashboard-page" class="dashboard">
        <h2 class="section-title">Live Orders Dashboard</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Details</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-orders-table"></tbody>
            </table>
            <button onclick="clearOrders()" style="margin-top: 15px; background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">Clear All Orders</button>
        </div>
    </div>

    <script>
        // Database
        let menuItems = [
            { id: 1, name: "Special Aloo Tikki Burger", price: 50 },
            { id: 2, name: "Chatpata Masala Noodles", price: 60 },
            { id: 3, name: "Baraf ka Gola", price: 20 },
            { id: 4, name: "Cheese Sandwich", price: 80 }
        ];

        let cart = [];
        
        // LocalStorage for saving orders locally
        let ordersDB = JSON.parse(localStorage.getItem("shriShyamOrders")) || []; 

        function renderCustomerMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = "";
            menuItems.forEach(item => {
                container.innerHTML += `
                    <div class="menu-card">
                        <div>
                            <h3>${item.name}</h3>
                            <div class="price">₹${item.price}</div>
                        </div>
                        <button class="add-btn" onclick="addToCart(${item.id}, '${item.name}', ${item.price})">Add to Cart</button>
                    </div>`;
            });
        }

        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total;
            document.getElementById('modal-total').innerText = total;
            document.getElementById('cart-btn').style.display = count > 0 ? 'block' : 'none';
        }

        function openCheckout() {
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        // FULLY DIGITAL ORDER PLACEMENT
        function placeOrder() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            if(!name || !phone || !address) {
                alert("Please saari details bharein!");
                return;
            }

            let newOrder = {
                orderId: "ORD" + Math.floor(Math.random() * 10000),
                customer: name,
                phone: phone,
                address: address,
                items: cart.map(i => i.name).join(", "),
                total: total,
                status: "Pending",
                time: new Date().toLocaleTimeString()
            };

            // Save to LocalStorage
            ordersDB.push(newOrder);
            localStorage.setItem("shriShyamOrders", JSON.stringify(ordersDB));

            // Success Message
            alert(`🎉 Order Placed Successfully!\n\nYour Order ID: ${newOrder.orderId}\nTotal Bill: ₹${newOrder.total}\n\nHum jald hi aapka order deliver karenge!`);
            
            // Reset everything
            cart = [];
            updateCartUI();
            closeCheckout();
            document.getElementById('cust-name').value = "";
            document.getElementById('cust-phone').value = "";
            document.getElementById('cust-address').value = "";
        }

        // Admin System
        function showAdminLogin() {
            document.getElementById('customer-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'none';
            document.getElementById('cart-btn').style.display = 'none';
            document.getElementById('login-page').style.display = 'block';
        }

        function showCustomer() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'none';
            document.getElementById('customer-page').style.display = 'block';
            updateCartUI();
        }

        function loginAdmin() {
            let id = document.getElementById('admin-id').value;
            let pass = document.getElementById('admin-pass').value;

            // Admin ID: Shri Shyam Fast Food | Pass: Jitu
            if (id === "Shri Shyam Fast Food" && pass === "Jitu") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard-page').style.display = 'block';
                loadAdminOrders();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function loadAdminOrders() {
            const table = document.getElementById('admin-orders-table');
            table.innerHTML = "";
            let savedOrders = JSON.parse(localStorage.getItem("shriShyamOrders")) || [];
            
            savedOrders.forEach((order, index) => {
                let statusColor = order.status === 'Pending' ? '#ffc107' : order.status === 'Accepted' ? '#17a2b8' : '#28a745';
                
                table.innerHTML += `
                    <tr>
                        <td><strong>${order.orderId}</strong><br><small>${order.time}</small></td>
                        <td>${order.customer}<br>📞 ${order.phone}<br>📍 ${order.address}</td>
                        <td>${order.items}</td>
                        <td><strong>₹${order.total}</strong></td>
                        <td><span style="color: ${statusColor}; font-weight:bold;">${order.status}</span></td>
                        <td>
                            <button class="status-btn" style="background:#17a2b8;" onclick="updateStatus(${index}, 'Accepted')">Accept</button>
                            <button class="status-btn" style="background:#28a745;" onclick="updateStatus(${index}, 'Delivered')">Done</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateStatus(index, newStatus) {
            ordersDB[index].status = newStatus;
            localStorage.setItem("shriShyamOrders", JSON.stringify(ordersDB));
            loadAdminOrders();
        }

        function clearOrders() {
            if(confirm("Kya aap sach me saare orders history delete karna chahte hain?")) {
                ordersDB = [];
                localStorage.removeItem("shriShyamOrders");
                loadAdminOrders();
            }
        }

        renderCustomerMenu();
    </script>
</body>
</html>
